<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc">
<title id="title">LangGraph：证据不足时，流程怎么走</title><desc id="desc">输入问题后检索并重排组织上下文，判断证据是否适用完整。有证据则生成带引用的回答；缺产品版本等条件时追问；检索不足时最多改写查询一次，仍不足则说明缺失证据并结束。图为教学流程设计，不表示已实现服务。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#789095"/></marker></defs>
<rect width="1200" height="1210" rx="24" fill="#F7F4ED"/>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="52" y="68" font-size="36" font-weight="650" fill="#18383F">LangGraph：证据不足时，流程怎么走</text>
<text x="52" y="111" font-size="22" font-weight="400" fill="#586D70">先做有界流程：最多改写一次；每条路径都有明确去向。</text>
<rect x="450" y="155" width="300" height="86" rx="18" fill="#FFFFFF" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="472" y="196" font-size="27" font-weight="650" fill="#226C8B">接收问题</text>
<path d="M600 249V279" fill="none" stroke="#789095" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="450" y="295" width="300" height="103" rx="18" fill="#E1EDF2" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="472" y="336" font-size="27" font-weight="650" fill="#226C8B">检索候选</text>
<text x="472" y="378" font-size="22" font-weight="400" fill="#18383F">按版本与系统条件过滤</text>
<path d="M600 406V438" fill="none" stroke="#789095" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="450" y="454" width="300" height="87" rx="18" fill="#E3F0E9" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="472" y="495" font-size="27" font-weight="650" fill="#21766B">重排并组织上下文</text>
<path d="M600 549V582" fill="none" stroke="#789095" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="450" y="598" width="300" height="126" rx="18" fill="#FFFFFF" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="472" y="639" font-size="27" font-weight="650" fill="#226C8B">判断证据</text>
<text x="472" y="681" font-size="22" font-weight="400" fill="#18383F">适用吗？够回答吗？</text>
<path d="M440 649H352" fill="none" stroke="#789095" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="80" y="600" font-size="23" font-weight="650" fill="#B56B32">缺少必要条件</text>
<rect x="52" y="617" width="282" height="103" rx="18" fill="#F7E7D7" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="74" y="658" font-size="27" font-weight="650" fill="#B56B32">追问用户</text>
<text x="74" y="700" font-size="21" font-weight="400" fill="#18383F">例如：产品版本不明</text>
<text x="70" y="756" font-size="22" font-weight="400" fill="#586D70">结束本轮，等待补充</text>
<path d="M760 649H846" fill="none" stroke="#789095" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="871" y="600" font-size="23" font-weight="650" fill="#21766B">证据完整且适用</text>
<rect x="864" y="617" width="284" height="103" rx="18" fill="#E3F0E9" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="886" y="658" font-size="27" font-weight="650" fill="#21766B">生成回答＋引用</text>
<text x="886" y="700" font-size="21" font-weight="400" fill="#18383F">逐条依据证据作答</text>
<text x="916" y="756" font-size="22" font-weight="400" fill="#586D70">结束本轮</text>
<path d="M600 732V808" fill="none" stroke="#789095" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="617" y="778" font-size="21" font-weight="400" fill="#586D70">检索证据不足</text>
<rect x="450" y="825" width="300" height="103" rx="18" fill="#FFFFFF" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="472" y="866" font-size="27" font-weight="650" fill="#226C8B">已改写过一次？</text>
<path d="M760 876H846" fill="none" stroke="#789095" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="788" y="858" font-size="22" font-weight="400" fill="#226C8B">否</text>
<rect x="864" y="825" width="284" height="103" rx="18" fill="#E1EDF2" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="886" y="866" font-size="27" font-weight="650" fill="#226C8B">改写查询一次</text>
<text x="886" y="908" font-size="21" font-weight="400" fill="#18383F">保留产品与版本约束</text>
<path d="M1157 874H1176V345H762" fill="none" stroke="#789095" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="825" y="325" font-size="22" font-weight="400" fill="#226C8B">带新查询重检索</text>
<path d="M600 936V1007" fill="none" stroke="#789095" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="618" y="980" font-size="22" font-weight="400" fill="#B56B32">是</text>
<rect x="384" y="1024" width="432" height="110" rx="18" fill="#F7E7D7" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="406" y="1065" font-size="27" font-weight="650" fill="#B56B32">说明缺少哪些证据，结束</text>
<text x="406" y="1107" font-size="22" font-weight="400" fill="#18383F">不编造操作步骤或系统行为。</text>
<text x="52" y="1180" font-size="18" font-weight="400" fill="#586D70">图展示已实现路由；默认判断与回答为替身，真实语义效果需另评。CodeHub / FlowCI 为模拟产品。</text>
</g></svg>