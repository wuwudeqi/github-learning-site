<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">文档解析：先把原文读完整</title><desc id="desc">解析与验收示意：本地 HTML 清理噪声并提取标题、列表、表格和代码；文本 PDF 提取后检查阅读顺序和页码。扫描件 OCR、复杂版面还原和 ACL 为扩展方案，未在当前代码实现。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#789095"/></marker></defs>
<rect width="1200" height="1060" rx="24" fill="#F7F4ED"/>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="52" y="68" font-size="36" font-weight="650" fill="#18383F">文档解析：先把原文读完整</text>
<text x="52" y="111" font-size="22" font-weight="400" fill="#586D70">检索器只能查到已经解析进来的内容；结构丢了，后面很难补救。</text>
<rect x="52" y="164" width="516" height="372" rx="18" fill="#FFFFFF" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="74" y="205" font-size="27" font-weight="650" fill="#226C8B">在线 HTML：保留正文结构</text>
<rect x="76" y="230" width="468" height="61" rx="18" fill="#F7E7D7" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="96" y="270" font-size="22" font-weight="400" fill="#B56B32">去掉：导航、侧栏、页脚、重复菜单</text>
<rect x="76" y="312" width="468" height="159" rx="18" fill="#E1EDF2" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="97" y="354" font-size="23" font-weight="400" fill="#18383F">保留 h2 / h3：功能与小节标题</text>
<text x="97" y="392" font-size="23" font-weight="400" fill="#18383F">保留列表：操作顺序与前提</text>
<text x="97" y="430" font-size="23" font-weight="400" fill="#18383F">保留 table / code：规则表与命令</text>
<text x="76" y="512" font-size="21" font-weight="400" fill="#586D70">用正文容器或结构规则提取，抽样对照原页。</text>
<rect x="632" y="164" width="516" height="372" rx="18" fill="#FFFFFF" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="654" y="205" font-size="27" font-weight="650" fill="#226C8B">PDF：按页面核对提取结果</text>
<rect x="656" y="230" width="468" height="103" rx="18" fill="#E1EDF2" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="676" y="271" font-size="23" font-weight="400" fill="#18383F">文本页：检查双栏阅读顺序</text>
<text x="676" y="308" font-size="23" font-weight="400" fill="#18383F">表格与代码：检查行列、缩进和跨页</text>
<rect x="656" y="355" width="468" height="116" rx="18" fill="#F7E7D7" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="676" y="396" font-size="23" font-weight="400" fill="#18383F">扫描页（扩展）：OCR 后复核文字</text>
<text x="676" y="433" font-size="23" font-weight="400" fill="#18383F">OCR 不自动还原正确表格与命令。</text>
<text x="656" y="512" font-size="21" font-weight="400" fill="#586D70">页眉页脚按需清理，页码仍随来源保存。</text>
<path d="M310 544V584H458V625" fill="none" stroke="#789095" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M890 544V584H742V625" fill="none" stroke="#789095" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="284" y="643" width="632" height="235" rx="18" fill="#E3F0E9" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="306" y="684" font-size="27" font-weight="650" fill="#21766B">统一来源结构</text>
<text x="306" y="726" font-size="25" font-weight="400" fill="#18383F">正文＋标题路径＋列表 / 表格 / 代码</text>
<text x="306" y="760" font-size="25" font-weight="400" fill="#18383F">文档 ID＋URL 或文件名＋页码 / 锚点</text>
<text x="306" y="794" font-size="25" font-weight="400" fill="#18383F">产品版本＋适用范围＋发布状态</text>
<text x="306" y="828" font-size="25" font-weight="400" fill="#18383F">保留解析记录，再交给切片步骤。</text>
<rect x="52" y="922" width="1096" height="72" rx="18" fill="#FFFFFF" stroke="#CFDAD6" stroke-width="1.5"/>
<text x="76" y="966" font-size="24" font-weight="400" fill="#18383F">验收时选含表格、代码、操作前提的页面；不能只看“成功读取了多少页”。</text>
<text x="52" y="1030" font-size="18" font-weight="400" fill="#586D70">当前代码处理本地 HTML 与文本 PDF；OCR、复杂版面还原和 ACL 为扩展。</text>
</g></svg>