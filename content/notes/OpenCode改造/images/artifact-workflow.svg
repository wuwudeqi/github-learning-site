<text x="472" y="260" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">固定输入与步骤</text>
<text x="472" y="294" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">记录工作流版本</text>
<rect x="848" y="179" width="300" height="163" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="870" y="219" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">再次调用</text>
<text x="870" y="260" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">Web 上传或 IM 触发</text>
<text x="870" y="294" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">按同一规则执行</text>
<path d="M360 261H440" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M758 261H838" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="76" y="410" font-size="28" font-weight="650" fill="#21766b" text-anchor="start">目标交付流程：什么时候允许用户拿到正式产物？</text>
<rect x="52" y="445" width="232" height="194" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="485" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">执行处理</text>
<text x="74" y="526" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">固定输入</text>
<text x="74" y="560" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">生成临时产物</text>
<rect x="340" y="445" width="232" height="194" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="362" y="485" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">独立校验</text>
<text x="362" y="526" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">金额与记录覆盖</text>
<text x="362" y="560" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">文件可重新读取</text>
