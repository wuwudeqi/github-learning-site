<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">从一次报表到可复用工作流</title><desc id="desc">先把口径与结果验收固定，再让员工重复使用。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5b7173"/></marker></defs>
<rect width="1200" height="1050" rx="24" fill="#f8f5ee"/>
<g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
<text x="52" y="64" font-size="38" font-weight="650" fill="#173a40" text-anchor="start">从一次报表到可复用工作流</text>
<text x="52" y="108" font-size="22" font-weight="400" fill="#5b7173" text-anchor="start">先把口径与结果验收固定，再让员工重复使用。</text>
<path d="M52 132L1148 132" fill="none" stroke="#cbd8d3" stroke-width="1.5"/>
