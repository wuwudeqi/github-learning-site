<path d="M580 542H618" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M868 542H906" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M456 647V692H290V733" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="474" y="699" font-size="23" font-weight="400" fill="#aa673a" text-anchor="start">校验失败</text>
<rect x="52" y="746" width="526" height="171" rx="18" fill="#f6e7d7" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="786" font-size="27" font-weight="650" fill="#aa673a" text-anchor="start">失败分支</text>
<text x="74" y="827" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">保存可定位的错误</text>
<text x="74" y="861" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">正式产物不可见，不显示成功</text>
<rect x="622" y="746" width="526" height="171" rx="18" fill="#e5eef3" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="644" y="786" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">小工具扩展</text>
<text x="644" y="827" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">新代码需运行时校验与隔离</text>
<text x="644" y="861" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">预览后使用独立输入再次验证</text>
<text x="52" y="1020" font-size="21" font-weight="400" fill="#5b7173" text-anchor="start">图中为目标方案；当前 demo 在内存完成后写文件，尚无持久原子发布流程。</text>
</g></svg>