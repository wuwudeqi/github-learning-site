<text x="74" y="260" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">模型辅助理解请求</text>
<text x="74" y="294" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">明确字段与统计口径</text>
<rect x="450" y="179" width="300" height="163" rx="18" fill="#e5eef3" stroke="#cbd8d3" stroke-width="1.5"/>
