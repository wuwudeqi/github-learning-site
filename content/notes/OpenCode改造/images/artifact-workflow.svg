<text x="650" y="526" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">关联任务与版本</text>
<text x="650" y="560" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">记录来源清单</text>
<rect x="916" y="445" width="232" height="194" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="938" y="485" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">返回可用结果</text>
<text x="938" y="526" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">下载或预览</text>
<text x="938" y="560" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">关联原始会话</text>
