<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">SDD：让规格连接到代码与独立验收</title><desc id="desc">同一个需求编号贯穿行为、设计、修改范围和验收依据。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5b7173"/></marker></defs>
<rect width="1200" height="1040" rx="24" fill="#f8f5ee"/>
<g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
<text x="52" y="64" font-size="38" font-weight="650" fill="#173a40" text-anchor="start">SDD：让规格连接到代码与独立验收</text>
<text x="52" y="108" font-size="22" font-weight="400" fill="#5b7173" text-anchor="start">同一个需求编号贯穿行为、设计、修改范围和验收依据。</text>
<path d="M52 132L1148 132" fill="none" stroke="#cbd8d3" stroke-width="1.5"/>
<rect x="52" y="178" width="330" height="172" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="218" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">需求：可观察行为</text>
<text x="74" y="259" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">RUN-003：取消先提交</text>
<text x="74" y="293" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">迟到结果不能变成成功</text>
<rect x="434" y="178" width="330" height="172" rx="18" fill="#e5eef3" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="456" y="218" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">设计：状态与边界</text>
<text x="456" y="259" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">await 后重新读状态</text>
<text x="456" y="293" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">提交前检查终态</text>
<rect x="816" y="178" width="332" height="172" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="838" y="218" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">任务：控制修改范围</text>
<text x="838" y="259" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">只改任务提交路径</text>
<text x="838" y="293" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">保留事件顺序</text>
<path d="M388 264H424" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M770 264H806" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M982 356V398H820V442" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="632" y="456" width="516" height="170" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="654" y="496" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">Codex 实现</text>
<text x="654" y="537" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">依据规格修改最小范围</text>
<text x="654" y="571" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">输出 diff、命令与未验证项</text>
<rect x="52" y="456" width="516" height="170" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="496" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">独立验收依据</text>
<text x="74" y="537" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">先手算报表，再看实现</text>
<text x="74" y="571" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">用 Promise 闸门控制竞态</text>
<text x="600" y="548" font-size="22" font-weight="400" fill="#5b7173" text-anchor="middle">对照</text>
<path d="M300 632V680H600V716" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M900 632V680H600" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="52" y="730" width="1096" height="150" rx="18" fill="#e5eef3" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="770" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">验收冲突时先定位原因</text>
<text x="74" y="811" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">规格含糊、实现错误、预期错误分别说明；修改预期需要依据。</text>
<rect x="52" y="905" width="1096" height="64" rx="18" fill="#f6e7d7" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="76" y="946" font-size="23" font-weight="400" fill="#aa673a" text-anchor="start">规格不会自行执行：把规则落到运行时校验、反例测试和变更审查。</text>
<text x="52" y="1010" font-size="21" font-weight="400" fill="#5b7173" text-anchor="start">示例规则：取消先发生 → 保留 cancelled；完成先提交 → 后续取消不改变结果。</text>
</g></svg>