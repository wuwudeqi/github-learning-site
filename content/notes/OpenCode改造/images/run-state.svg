<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">取消与完成：先提交的终态生效</title><desc id="desc">实际实验规则 · 单进程内存状态；取消协作信号不能撤销外部副作用。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5b7173"/></marker></defs>
<rect width="1200" height="1120" rx="24" fill="#f8f5ee"/>
<g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
<text x="52" y="64" font-size="38" font-weight="650" fill="#173a40" text-anchor="start">取消与完成：先提交的终态生效</text>
<text x="52" y="108" font-size="22" font-weight="400" fill="#5b7173" text-anchor="start">实际实验规则 · 单进程内存状态；取消协作信号不能撤销外部副作用。</text>
<path d="M52 132L1148 132" fill="none" stroke="#cbd8d3" stroke-width="1.5"/>
<rect x="52" y="191" width="258" height="126" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="231" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">queued</text>
<text x="74" y="272" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">已创建、未执行</text>
<rect x="460" y="191" width="284" height="126" rx="18" fill="#e5eef3" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="482" y="231" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">running</text>
<text x="482" y="272" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">工具已开始执行</text>
<rect x="889" y="191" width="259" height="126" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="911" y="231" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">completed</text>
<text x="911" y="272" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">内存产物已提交</text>
<path d="M318 254H450" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="347" y="232" font-size="23" font-weight="400" fill="#5b7173" text-anchor="start">开始</text>
<path d="M752 254H879" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="779" y="232" font-size="23" font-weight="400" fill="#5b7173" text-anchor="start">成功提交</text>
<rect x="460" y="404" width="284" height="126" rx="18" fill="#f6e7d7" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="482" y="444" font-size="27" font-weight="650" fill="#aa673a" text-anchor="start">cancelled</text>
<text x="482" y="485" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">拒收迟到成功结果</text>
<rect x="889" y="404" width="259" height="126" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="911" y="444" font-size="27" font-weight="650" fill="#aa673a" text-anchor="start">failed</text>
<text x="911" y="485" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">保存失败原因</text>
<path d="M181 325V467H450" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="210" y="449" font-size="23" font-weight="400" fill="#aa673a" text-anchor="start">排队时取消</text>
<path d="M602 325V393" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="620" y="367" font-size="23" font-weight="400" fill="#aa673a" text-anchor="start">运行时取消</text>
<path d="M752 285H804V467H879" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="814" y="443" font-size="23" font-weight="400" fill="#aa673a" text-anchor="start">失败</text>
<text x="76" y="598" font-size="28" font-weight="650" fill="#21766b" text-anchor="start">取消与成功的两个可控时序</text>
<rect x="52" y="629" width="1096" height="154" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="76" y="670" font-size="26" font-weight="650" fill="#aa673a" text-anchor="start">A  取消先发生</text>
<text x="76" y="716" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">工具等待</text>
<path d="M205 709H293" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="320" y="716" font-size="24" font-weight="400" fill="#aa673a" text-anchor="start">写 cancelled</text>
<path d="M487 709H575" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="602" y="716" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">迟到结果</text>
<path d="M732 709H820" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="848" y="716" font-size="24" font-weight="650" fill="#aa673a" text-anchor="start">不提交产物</text>
<rect x="52" y="818" width="1096" height="154" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="76" y="859" font-size="26" font-weight="650" fill="#21766b" text-anchor="start">B  完成先发生</text>
<text x="76" y="905" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">工具返回</text>
<path d="M205 898H293" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="320" y="905" font-size="24" font-weight="400" fill="#21766b" text-anchor="start">写 completed</text>
<path d="M487 898H575" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="602" y="905" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">用户取消</text>
<path d="M732 898H820" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="848" y="905" font-size="24" font-weight="650" fill="#21766b" text-anchor="start">完成结果保留</text>
<text x="76" y="1031" font-size="25" font-weight="650" fill="#226c8b" text-anchor="start">await 后重新读状态；状态检查与内存提交之间没有 await。</text>
<text x="52" y="1090" font-size="21" font-weight="400" fill="#5b7173" text-anchor="start">Map 不支持进程恢复或多实例竞争；落到持久存储后需要原子条件提交。</text>
</g></svg>