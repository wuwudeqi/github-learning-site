<text x="76" y="963" font-size="23" font-weight="400" fill="#5b7173" text-anchor="start">重试设置总预算；避免 SDK、网关、应用重复叠加重试。</text>
<text x="52" y="1050" font-size="21" font-weight="400" fill="#5b7173" text-anchor="start">当前未提供公司模型端点；本专题没有真实模型正确率或线上延迟数据。</text>
