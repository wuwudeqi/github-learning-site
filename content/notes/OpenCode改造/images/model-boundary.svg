<text x="74" y="727" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">参数校验 → 真实工具 → 结果回传</text>
<text x="74" y="761" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">业务金额由确定性代码核对</text>
