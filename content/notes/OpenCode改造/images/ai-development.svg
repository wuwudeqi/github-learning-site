<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc">
<title id="title">用 Codex 开发陌生领域：把判断留下来</title><desc id="desc">AI 可以完成实现与审查；需求、取舍和验收需要有可核对的依据。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5b7173"/></marker></defs>
<rect width="1200" height="1130" rx="24" fill="#f8f5ee"/>
<g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
<text x="52" y="64" font-size="38" font-weight="650" fill="#173a40" text-anchor="start">用 Codex 开发陌生领域：把判断留下来</text>
<text x="52" y="108" font-size="22" font-weight="400" fill="#5b7173" text-anchor="start">AI 可以完成实现与审查；需求、取舍和验收需要有可核对的依据。</text>
<path d="M52 132L1148 132" fill="none" stroke="#cbd8d3" stroke-width="1.5"/>
<rect x="52" y="182" width="320" height="150" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="222" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">01  对齐需求</text>
<text x="74" y="263" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">结果、口径与反例</text>
<rect x="440" y="182" width="320" height="150" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="462" y="222" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">02  查源码证据</text>
<text x="462" y="263" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">固定版本，核对调用链</text>
<rect x="828" y="182" width="320" height="150" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="850" y="222" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">03  跑最小实验</text>
<text x="850" y="263" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">先验证一个真实假设</text>
<rect x="828" y="454" width="320" height="150" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="850" y="494" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">04  小步修改</text>
<text x="850" y="535" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">范围、接口与退出条件</text>
<rect x="440" y="454" width="320" height="150" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="462" y="494" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">05  独立验收</text>
<text x="462" y="535" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">手算预期、故障与竞态</text>
<rect x="52" y="454" width="320" height="150" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="494" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">06  审查与复盘</text>
<text x="74" y="535" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">把判断转成可运行反例</text>
<path d="M380 257H430" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M768 257H818" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M988 340V444" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M820 529H770" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M432 529H382" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M212 612V650H30V160H212V172" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<text x="76" y="707" font-size="28" font-weight="650" fill="#21766b" text-anchor="start">一次真实反例，比“AI 说已经完成”更容易复核</text>
<rect x="52" y="744" width="526" height="220" rx="18" fill="#e5eef3" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="784" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">AI 提出修改之后</text>
<text x="74" y="825" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">核对 diff 是否越过任务范围</text>
<text x="74" y="859" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">测试预期是否随实现一起改了</text>
<text x="74" y="893" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">待验证判断是否被写成事实</text>
<rect x="622" y="744" width="526" height="220" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="644" y="784" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">留下可讲的开发证据</text>
<text x="644" y="825" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">原始问题与规格编号</text>
<text x="644" y="859" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">采用或否决方案的理由</text>
<text x="644" y="893" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">输入、命令、结果与局限</text>
<rect x="52" y="995" width="1096" height="64" rx="18" fill="#f6e7d7" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="76" y="1036" font-size="23" font-weight="400" fill="#aa673a" text-anchor="start">遇到失败：先复现并区分假设，再让 Codex 做最小修复。</text>
<text x="52" y="1100" font-size="21" font-weight="400" fill="#5b7173" text-anchor="start">教学方法以当前报表与运行机制实验举例，不编造尚未发生的企业开发经历。</text>
</g></svg>