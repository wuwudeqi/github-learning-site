<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
<title id="title">三种入口：提交、观察与交付分开</title><desc id="desc">企业 taskId 关联底层会话；事件游标表示已读进度，不表示重新执行。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5b7173"/></marker></defs>
<rect width="1200" height="1110" rx="24" fill="#f8f5ee"/>
<g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
<text x="52" y="64" font-size="38" font-weight="650" fill="#173a40" text-anchor="start">三种入口：提交、观察与交付分开</text>
<text x="52" y="108" font-size="22" font-weight="400" fill="#5b7173" text-anchor="start">企业 taskId 关联底层会话；事件游标表示已读进度，不表示重新执行。</text>
<path d="M52 132L1148 132" fill="none" stroke="#cbd8d3" stroke-width="1.5"/>
<rect x="52" y="184" width="454" height="126" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="224" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">CLI</text>
<text x="74" y="265" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">研发仓库与终端交互</text>
<path d="M514 248H632" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="646" y="184" width="502" height="126" rx="18" fill="#e5eef3" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="670" y="226" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">本地执行实例</text>
<text x="670" y="270" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">共享执行代码与能力协议</text>
<rect x="52" y="343" width="454" height="126" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="383" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">Web</text>
<text x="74" y="424" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">上传、预览与下载</text>
<path d="M514 407H632" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="646" y="343" width="502" height="126" rx="18" fill="#e5eef3" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="670" y="385" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">服务端执行实例</text>
<text x="670" y="429" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">共享执行代码与能力协议</text>
<rect x="52" y="502" width="454" height="126" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="542" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">IM</text>
<text x="74" y="583" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">身份映射、消息去重与回执</text>
<path d="M514 566H632" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="646" y="502" width="502" height="126" rx="18" fill="#e5eef3" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="670" y="544" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">服务端执行实例</text>
<text x="670" y="588" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">共享执行代码与能力协议</text>
<rect x="52" y="681" width="1096" height="185" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="76" y="724" font-size="29" font-weight="650" fill="#21766b" text-anchor="start">企业任务契约</text>
<text x="76" y="772" font-size="25" font-weight="400" fill="#173a40" text-anchor="start">可信身份＋渠道＋会话＋消息 ID  →  taskId  →  执行会话</text>
<text x="76" y="818" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">同键同内容复用；同键不同内容冲突；新任务拥有独立状态。</text>
<rect x="52" y="908" width="526" height="127" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="948" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">执行命令</text>
<text x="74" y="989" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">创建、开始与取消</text>
<rect x="622" y="908" width="526" height="127" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="644" y="948" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">只读观察</text>
<text x="644" y="989" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">查状态、按游标补取事件与产物</text>
<text x="52" y="1080" font-size="21" font-weight="400" fill="#5b7173" text-anchor="start">上图是企业接入设计；实验没有真实登录、Web、IM 回调或持久事件服务。</text>
</g></svg>