<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">能力装配：这次任务究竟用了哪个版本</title><desc id="desc">上游已有 Skill、MCP 与组织配置；企业方案补充发布规则和任务版本记录。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5b7173"/></marker></defs>
<rect width="1200" height="1050" rx="24" fill="#f8f5ee"/>
<g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
<text x="52" y="64" font-size="38" font-weight="650" fill="#173a40" text-anchor="start">能力装配：这次任务究竟用了哪个版本</text>
<text x="52" y="108" font-size="22" font-weight="400" fill="#5b7173" text-anchor="start">上游已有 Skill、MCP 与组织配置；企业方案补充发布规则和任务版本记录。</text>
<path d="M52 132L1148 132" fill="none" stroke="#cbd8d3" stroke-width="1.5"/>
<rect x="52" y="175" width="350" height="427" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="76" y="218" font-size="28" font-weight="650" fill="#21766b" text-anchor="start">内部能力目录</text>
<rect x="76" y="244" width="302" height="88" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="94" y="278" font-size="25" font-weight="650" fill="#21766b" text-anchor="start">Skill</text>
<text x="94" y="313" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">方法、口径与参考资料</text>
<rect x="76" y="355" width="302" height="88" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="94" y="389" font-size="25" font-weight="650" fill="#21766b" text-anchor="start">MCP 工具</text>
<text x="94" y="424" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">业务动作与输入输出</text>
<rect x="76" y="466" width="302" height="88" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="94" y="500" font-size="25" font-weight="650" fill="#21766b" text-anchor="start">工作流</text>
<text x="94" y="535" font-size="22" font-weight="400" fill="#173a40" text-anchor="start">已确认步骤及失败分支</text>
<rect x="465" y="281" width="294" height="245" rx="18" fill="#e5eef3" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="487" y="321" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">解析与装配</text>
<text x="487" y="362" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">身份与岗位范围</text>
<text x="487" y="396" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">名称冲突规则</text>
<text x="487" y="430" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">获批能力版本</text>
<text x="487" y="464" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">本次任务需要什么</text>
<path d="M410 400H455" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M767 400H799" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="809" y="175" width="339" height="427" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="831" y="215" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">任务能力快照</text>
<text x="831" y="256" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">Skill 版本与内容指纹</text>
<text x="831" y="290" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">MCP 合同与 Schema</text>
<text x="831" y="324" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">工作流版本</text>
<text x="831" y="358" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">解析来源与时间</text>
<text x="831" y="547" font-size="22" font-weight="400" fill="#226c8b" text-anchor="start">设计：旧任务继续读旧版</text>
<rect x="52" y="650" width="526" height="207" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="690" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">Skill：版本标签还不够</text>
<text x="74" y="731" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">要能取回不可变内容</text>
<text x="74" y="765" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">同版本内容变化必须被发现</text>
<text x="74" y="799" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">找不到旧版时不静默换新版</text>
<rect x="622" y="650" width="526" height="207" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="644" y="690" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">MCP：接口固定仍有边界</text>
<text x="644" y="731" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">Schema 相同，实现也可能变化</text>
<text x="644" y="765" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">还需服务端合同与兼容约定</text>
<text x="644" y="799" font-size="23" font-weight="400" fill="#173a40" text-anchor="start">调用时仍检查当前业务权限</text>
<rect x="52" y="904" width="1096" height="64" rx="18" fill="#f6e7d7" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="76" y="945" font-size="23" font-weight="400" fill="#aa673a" text-anchor="start">实验只保存四个版本字符串快照；真实下载、摘要校验与按版加载待实现。</text>
<text x="52" y="1020" font-size="21" font-weight="400" fill="#5b7173" text-anchor="start">岗位装配减少工具候选；工具目录的可见范围不能替代业务系统授权。</text>
</g></svg>