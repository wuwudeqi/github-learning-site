<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">长任务上下文：保留事实，按需读取细节</title><desc id="desc">对话、任务记录、文件产物与长期偏好有不同的来源和失效规则。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5b7173"/></marker></defs>
<rect width="1200" height="1080" rx="24" fill="#f8f5ee"/>
<g font-family="PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif">
<text x="52" y="64" font-size="38" font-weight="650" fill="#173a40" text-anchor="start">长任务上下文：保留事实，按需读取细节</text>
<text x="52" y="108" font-size="22" font-weight="400" fill="#5b7173" text-anchor="start">对话、任务记录、文件产物与长期偏好有不同的来源和失效规则。</text>
<path d="M52 132L1148 132" fill="none" stroke="#cbd8d3" stroke-width="1.5"/>
<rect x="52" y="179" width="526" height="227" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="219" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">近期对话</text>
<text x="74" y="260" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">刚确认的口径与补充问题</text>
<text x="74" y="294" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">保留当前决策需要的原文</text>
<text x="74" y="328" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">文件中的文字仍按数据处理</text>
<rect x="622" y="179" width="526" height="227" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="644" y="219" font-size="27" font-weight="650" fill="#21766b" text-anchor="start">任务事实</text>
<text x="644" y="260" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">输入指纹、能力版本与产物 ID</text>
<text x="644" y="294" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">确认口径、已完成步骤</text>
<text x="644" y="328" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">从任务记录读取，摘要不能改写</text>
<rect x="52" y="453" width="526" height="227" rx="18" fill="#e5eef3" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="74" y="493" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">大文件与工具输出</text>
<text x="74" y="534" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">CSV、完整日志、生成脚本</text>
<text x="74" y="568" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">保存为产物，返回摘要与范围</text>
<text x="74" y="602" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">需要细节时按 ID 和位置读取</text>
<rect x="622" y="453" width="526" height="227" rx="18" fill="#ffffff" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="644" y="493" font-size="27" font-weight="650" fill="#226c8b" text-anchor="start">长期偏好</text>
<text x="644" y="534" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">明确确认的模板与展示习惯</text>
<text x="644" y="568" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">按身份和场景读取，可撤销</text>
<text x="644" y="602" font-size="24" font-weight="400" fill="#173a40" text-anchor="start">个人会话与群聊范围分开</text>
<path d="M315 689V738H600V774" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M885 689V738H600" fill="none" stroke="#5b7173" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="52" y="788" width="1096" height="160" rx="18" fill="#e6f1ea" stroke="#cbd8d3" stroke-width="1.5"/>
<text x="76" y="830" font-size="28" font-weight="650" fill="#21766b" text-anchor="start">组装当前请求：检查预算，也检查来源</text>
<text x="76" y="879" font-size="25" font-weight="400" fill="#173a40" text-anchor="start">系统说明 ＋ 工具定义 ＋ 任务事实 ＋ 必要历史 ＋ 工具结果</text>
<text x="76" y="919" font-size="23" font-weight="400" fill="#5b7173" text-anchor="start">压缩后要验证：金额单位、去重键、空白处理和下一步是否保留。</text>
<text x="52" y="1050" font-size="21" font-weight="400" fill="#5b7173" text-anchor="start">实验没有实现模型压缩或长期记忆；上图是改造方案及待验证的读取规则。</text>
</g></svg>