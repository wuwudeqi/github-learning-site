<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc"><title id="title">一次生成：先算候选，再选一项</title><desc id="desc">先看清每一步的工作，再逐步拆开模型内部。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176d86"/></marker></defs><rect width="720" height="590" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#153642">一次生成：先算候选，再选一项</text><text x="28" y="88" font-size="23" fill="#526672">先看清每一步的工作，再逐步拆开模型内部。</text><rect x="28" y="120" width="664" height="90" rx="10" fill="#e9f3f5"/><text x="46" y="156" font-size="26" fill="#153642">已有文字</text><text x="46" y="192" font-size="23" fill="#526672">天气很热，我想喝一杯</text><path d="M350,218 L350,250" stroke="#176d86" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="28" y="260" width="664" height="94" rx="10" fill="#e9f3f5"/><text x="46" y="296" font-size="26" fill="#153642">模型计算下一小块的候选</text><text x="46" y="332" font-size="23" fill="#526672">可能是“冰水”，也可能是“热茶”等。</text><path d="M350,362 L350,394" stroke="#176d86" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="28" y="404" width="664" height="90" rx="10" fill="#fff0d8"/><text x="46" y="440" font-size="26" fill="#153642">生成程序选一个，再接回前文</text><text x="46" y="476" font-size="23" fill="#526672">这一轮假设选中“冰水”。</text><text x="28" y="549" font-size="25" fill="#153642">下一轮的前文：天气很热，我想喝一杯冰水</text></g></svg>