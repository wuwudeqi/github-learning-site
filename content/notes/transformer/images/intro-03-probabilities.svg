<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc"><title id="title">候选有多种，每种分到一个概率</title><desc id="desc">这里用一个只有三项的教学词表。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176d86"/></marker></defs><rect width="720" height="590" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#153642">候选有多种，每种分到一个概率</text><text x="28" y="88" font-size="23" fill="#526672">这里用一个只有三项的教学词表。</text><text x="28" y="135" font-size="26" fill="#153642">前文：天气很热，我想喝一杯</text><text x="28" y="204" font-size="26" fill="#153642">冰水</text><rect x="130" y="176" width="450" height="35" fill="#e7ecef"/><rect x="130" y="176" width="270.0" height="35" fill="#176d86"/><text x="609" y="204" font-size="25" fill="#153642">60%</text><text x="28" y="292" font-size="26" fill="#153642">热茶</text><rect x="130" y="264" width="450" height="35" fill="#e7ecef"/><rect x="130" y="264" width="135.0" height="35" fill="#176d86"/><text x="609" y="292" font-size="25" fill="#153642">30%</text><text x="28" y="380" font-size="26" fill="#153642">果汁</text><rect x="130" y="352" width="450" height="35" fill="#e7ecef"/><rect x="130" y="352" width="45.0" height="35" fill="#176d86"/><text x="609" y="380" font-size="25" fill="#153642">10%</text><text x="28" y="461" font-size="28" fill="#153642">60% + 30% + 10% = 100%</text><text x="28" y="512" font-size="23" fill="#526672">候选概率是教学假设；只考虑这三个候选。</text><text x="28" y="552" font-size="23" fill="#153642">概率最高的候选，也不一定每次都被选中。</text></g></svg>