<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img"><title>模型如何从误差中学习</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#23776b"/></marker></defs><rect width="1040" height="480" fill="#f7f8f5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#172e38"><text x="44" y="60" font-size="28" font-weight="bold">模型如何从误差中学习</text><text x="44" y="103" font-size="18">一次训练更新：预测 → 评价偏差 → 求梯度 → 调整参数。</text><rect x="44" y="156" width="218" height="195" rx="14" fill="#e5f1ed" stroke="#9cbfb4"/><text x="62" y="195" font-size="22" font-weight="bold">① 前向计算</text><text x="62" y="233" font-size="18">输入 x</text><text x="62" y="265" font-size="18">参数 w、b</text><text x="62" y="297" font-size="18">算出预测 y_hat</text><path d="M266,250 L288,250" stroke="#23776b" stroke-width="2" marker-end="url(#arrow)"/><rect x="294" y="156" width="218" height="195" rx="14" fill="#e5f1ed" stroke="#9cbfb4"/><text x="312" y="195" font-size="22" font-weight="bold">② 计算损失</text><text x="312" y="233" font-size="18">对照目标 y</text><text x="312" y="265" font-size="18">L = (y_hat − y)²</text><text x="312" y="297" font-size="18">衡量预测的偏差</text><path d="M516,250 L538,250" stroke="#23776b" stroke-width="2" marker-end="url(#arrow)"/><rect x="544" y="156" width="218" height="195" rx="14" fill="#e5f1ed" stroke="#9cbfb4"/><text x="562" y="195" font-size="22" font-weight="bold">③ 计算梯度</text><text x="562" y="233" font-size="18">损失对 w 的梯度</text><text x="562" y="265" font-size="18">损失对 b 的梯度</text><text x="562" y="297" font-size="18">都使用旧参数计算</text><path d="M766,250 L788,250" stroke="#23776b" stroke-width="2" marker-end="url(#arrow)"/><rect x="794" y="156" width="218" height="195" rx="14" fill="#e5f1ed" stroke="#9cbfb4"/><text x="812" y="195" font-size="22" font-weight="bold">④ 更新参数</text><text x="812" y="233" font-size="18">旧参数减去</text><text x="812" y="265" font-size="18">学习率 × 梯度</text><text x="812" y="297" font-size="18">进入下一次计算</text><text x="44" y="400" font-size="18">更新后的参数用于下一次前向计算，循环可以重复很多次。</text><text x="44" y="429" font-size="18">常规推理：只使用已学参数计算输出；评估可算损失，但不更新参数。</text></g></svg>