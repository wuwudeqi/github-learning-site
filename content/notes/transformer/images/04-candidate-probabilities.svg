<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">一张候选表，还需要一次选择</title><desc id="desc">冰水60%，热茶30%，果汁10%。三项和为100%。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#167e96"/></marker></defs><rect width="960" height="630" fill="#faf9f3"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="36" y="52" font-size="30" fill="#173747">一张候选表，还需要一次选择</text><text x="36" y="96" font-size="21" fill="#526878">只保留三个候选的教学词表；概率来自假设分数。</text><text x="40" y="160" font-size="26" fill="#173747">冰水</text><rect x="150" y="130" width="650" height="42" rx="12" fill="#e9edf0"/><rect x="150" y="130" width="390.0" height="42" fill="#167e96"/><text x="825" y="160" font-size="26" fill="#173747">60%</text><text x="40" y="250" font-size="26" fill="#173747">热茶</text><rect x="150" y="220" width="650" height="42" rx="12" fill="#e9edf0"/><rect x="150" y="220" width="195.0" height="42" fill="#167e96"/><text x="825" y="250" font-size="26" fill="#173747">30%</text><text x="40" y="340" font-size="26" fill="#173747">果汁</text><rect x="150" y="310" width="650" height="42" rx="12" fill="#e9edf0"/><rect x="150" y="310" width="65.0" height="42" fill="#167e96"/><text x="825" y="340" font-size="26" fill="#173747">10%</text><text x="40" y="440" font-size="25" fill="#173747">分数 z = [ln 6, ln 3, 0]</text><text x="40" y="490" font-size="23" fill="#173747">取指数 → [6, 3, 1]；再除以总和 10 → [0.6, 0.3, 0.1]</text><text x="40" y="544" font-size="22" fill="#173747">贪心：选最高项“冰水”。采样：其他候选也可能被选中。</text><text x="40" y="590" font-size="21" fill="#526878">60% 是候选概率，不能当作答案有 60% 的事实正确率。</text></g></svg>