<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc"><title id="title">自回归：概率分解与网络结构分开看</title><desc id="desc">路径示例只比较两步；数值为教学设定。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#147d99"/></marker></defs><rect width="1000" height="670" fill="#fafbfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="52" font-size="30" fill="#173747">自回归：概率分解与网络结构分开看</text><text x="32" y="91" font-size="21" fill="#526574">路径示例只比较两步；数值为教学设定。</text><rect x="32" y="124" width="936" height="132" rx="10" fill="#e9f3f7"/><text x="52" y="159" font-size="25" fill="#173747">条件概率的链式分解</text><text x="52" y="197" font-size="21" fill="#173747">pθ(y₁,y₂,y₃ | C) = pθ(y₁|C) · pθ(y₂|C,y₁) · pθ(y₃|C,y₁,y₂)</text><text x="52" y="231" font-size="21" fill="#173747">每一项仍可依赖全部可见前文；没有假设 token 相互独立。</text><rect x="32" y="282" width="448" height="168" rx="10" fill="#e9f3f7"/><text x="52" y="317" font-size="25" fill="#173747">分解：要拟合什么</text><text x="52" y="355" font-size="21" fill="#173747">定义联合概率如何拆成条件概率。</text><text x="52" y="389" font-size="21" fill="#173747">RNN、Transformer 都可参数化这些项。</text><text x="52" y="423" font-size="21" fill="#173747">它不是一种指定的网络层。</text><rect x="520" y="282" width="448" height="168" rx="10" fill="#e9f3f7"/><text x="540" y="317" font-size="25" fill="#173747">参数化：用什么计算</text><text x="540" y="355" font-size="21" fill="#173747">h = fθ(C)，z = hW + b</text><text x="540" y="389" font-size="21" fill="#173747">pθ = softmax(z)</text><text x="540" y="423" font-size="21" fill="#173747">同一 θ 可以处理不同长度的前缀。</text><rect x="32" y="478" width="936" height="156" rx="10" fill="#fff2df"/><text x="52" y="513" font-size="25" fill="#173747">整条路径与局部贪心</text><text x="52" y="551" font-size="21" fill="#173747">A: 0.6 × 0.1 = 0.06；B: 0.4 × 0.9 = 0.36</text><text x="52" y="585" font-size="21" fill="#173747">第一步贪心选 A，却错过更高的两步路径 B。</text><text x="52" y="619" font-size="21" fill="#173747">后续概率不同，逐步最大化不保证整条序列概率最大。</text></g></svg>