<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img"><title>把样本组织成矩阵</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#23776b"/></marker></defs><rect width="1040" height="480" fill="#f7f8f5"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#172e38"><text x="44" y="60" font-size="28" font-weight="bold">把样本组织成矩阵</text><text x="44" y="103" font-size="18">从左向右看：两个输入样本，共用同一组参数。</text><rect x="44" y="156" width="218" height="195" rx="14" fill="#e5f1ed" stroke="#9cbfb4"/><text x="62" y="195" font-size="22" font-weight="bold">输入 X · 2×2</text><text x="62" y="233" font-size="18">样本一：[2, 3]</text><text x="62" y="265" font-size="18">样本二：[1, 4]</text><path d="M266,250 L288,250" stroke="#23776b" stroke-width="2" marker-end="url(#arrow)"/><rect x="294" y="156" width="218" height="195" rx="14" fill="#e5f1ed" stroke="#9cbfb4"/><text x="312" y="195" font-size="22" font-weight="bold">权重 W · 2×1</text><text x="312" y="233" font-size="18">第 1 行：0.5</text><text x="312" y="265" font-size="18">第 2 行：1</text><text x="312" y="297" font-size="18">与 X 做矩阵乘法</text><path d="M516,250 L538,250" stroke="#23776b" stroke-width="2" marker-end="url(#arrow)"/><rect x="544" y="156" width="218" height="195" rx="14" fill="#e5f1ed" stroke="#9cbfb4"/><text x="562" y="195" font-size="22" font-weight="bold">X @ W · 2×1</text><text x="562" y="233" font-size="18">2×0.5 + 3×1 = 4</text><text x="562" y="265" font-size="18">1×0.5 + 4×1 = 4.5</text><path d="M766,250 L788,250" stroke="#23776b" stroke-width="2" marker-end="url(#arrow)"/><rect x="794" y="156" width="218" height="195" rx="14" fill="#e5f1ed" stroke="#9cbfb4"/><text x="812" y="195" font-size="22" font-weight="bold">加偏置 b = 0.2</text><text x="812" y="233" font-size="18">预测一：4.2</text><text x="812" y="265" font-size="18">预测二：4.7</text><text x="44" y="400" font-size="18">每一行对应一个样本；权重不会为每个样本单独设置。</text><text x="44" y="429" font-size="18">维度检查：(2, 2) @ (2, 1) → (2, 1)，加偏置后形状不变。</text></g></svg>