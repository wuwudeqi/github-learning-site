<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="695" viewBox="0 0 1000 695" role="img" aria-labelledby="title desc"><title id="title">损失怎样改变下一 token 的概率</title><desc id="desc">前向计算 → 损失 → 链式法则 → 参数更新。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#147d99"/></marker></defs><rect width="1000" height="695" fill="#fafbfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="52" font-size="30" fill="#173747">损失怎样改变下一 token 的概率</text><text x="32" y="91" font-size="21" fill="#526574">前向计算 → 损失 → 链式法则 → 参数更新。</text><rect x="32" y="124" width="936" height="134" rx="10" fill="#e9f3f7"/><text x="52" y="159" font-size="25" fill="#173747">从最大似然到单位置损失</text><text x="52" y="197" font-size="21" fill="#173747">maxθ ∏ pθ(target|prefix)  ⇔  minθ −Σ log pθ(target|prefix)</text><text x="52" y="231" font-size="21" fill="#173747">对目标 k：L=−log pₖ=−zₖ+log Σⱼ exp(zⱼ)</text><rect x="32" y="282" width="448" height="185" rx="10" fill="#e9f3f7"/><text x="52" y="317" font-size="25" fill="#173747">对 logits 求导</text><text x="52" y="355" font-size="21" fill="#173747">∂L/∂zⱼ = pⱼ − 1[j=k]</text><text x="52" y="389" font-size="21" fill="#173747">目标 k=冰水，p=[.6,.3,.1]</text><text x="52" y="423" font-size="21" fill="#173747">g=[−.4,.3,.1]</text><text x="52" y="457" font-size="21" fill="#173747">L=−ln(.6)≈0.510826</text><rect x="520" y="282" width="448" height="185" rx="10" fill="#e9f3f7"/><text x="540" y="317" font-size="25" fill="#173747">沿线性层反传</text><text x="540" y="355" font-size="21" fill="#173747">∂L/∂W = hᵀg</text><text x="540" y="389" font-size="21" fill="#173747">∂L/∂h = gWᵀ</text><text x="540" y="423" font-size="21" fill="#173747">h=[1,0] 时：</text><text x="540" y="457" font-size="21" fill="#173747">∂L/∂W=[[-.4,.3,.1],[0,0,0]]</text><rect x="32" y="497" width="936" height="164" rx="10" fill="#fff2df"/><text x="52" y="532" font-size="25" fill="#173747">只更新 W 一步，学习率 η=0.1，保持 h 不变</text><text x="52" y="570" font-size="21" fill="#173747">W′=W−η·∂L/∂W</text><text x="52" y="604" font-size="21" fill="#173747">p′≈[0.615485,0.286937,0.097578]；L′≈0.485345</text><text x="52" y="638" font-size="21" fill="#173747">有限差分检查 W 和 h 的梯度，误差应小于 10⁻⁷。</text></g></svg>