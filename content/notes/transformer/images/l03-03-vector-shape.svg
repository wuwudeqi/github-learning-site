<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-labelledby="title desc"><title id="title">向量与维度：先数清楚，再谈含义</title><desc id="desc">表里的 0.8 与词表编号 7 是不同类型的信息。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176f8a"/></marker></defs><rect width="920" height="720" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#163748">向量与维度：先数清楚，再谈含义</text><text x="28" y="89" font-size="22" fill="#526878">表里的 0.8 与词表编号 7 是不同类型的信息。</text><text x="28" y="138" font-size="27" fill="#163748">ID 7 的向量：[0.8, 0.1, −0.2]</text><rect x="180" y="192" width="162" height="90" rx="7" fill="#dceef7"/><text x="200" y="226" font-size="23" fill="#163748">第 1 个分量</text><text x="233" y="265" font-size="28" fill="#163748">0.8</text><rect x="375" y="192" width="162" height="90" rx="7" fill="#f9e9ce"/><text x="395" y="226" font-size="23" fill="#163748">第 2 个分量</text><text x="428" y="265" font-size="28" fill="#163748">0.1</text><rect x="570" y="192" width="162" height="90" rx="7" fill="#e2f0df"/><text x="590" y="226" font-size="23" fill="#163748">第 3 个分量</text><text x="623" y="265" font-size="28" fill="#163748">-0.2</text><text x="28" y="334" font-size="25" fill="#163748">向量：一串有顺序的数；维度 d：这串数有多长。</text><rect x="28" y="375" width="864" height="131" rx="7" fill="#edf3f6"/><text x="46" y="408" font-size="26" fill="#163748">把多行向量叠起来，得到矩阵</text><text x="46" y="444" font-size="22" fill="#526878">T 个 token → T 行；每行 d 个数 → d 列。</text><text x="46" y="477" font-size="22" fill="#526878">本例 T=3、d=3，只是巧合，两者含义不同。</text><rect x="28" y="555" width="864" height="131" rx="7" fill="#fff2de"/><text x="46" y="588" font-size="26" fill="#163748">不要提前替每一维命名</text><text x="46" y="624" font-size="22" fill="#526878">不能据此说第 1 维是“冷”，第 2 维是“热”。</text><text x="46" y="657" font-size="22" fill="#526878">真实向量的用途由训练与后续计算共同决定。</text></g></svg>