<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="695" viewBox="0 0 1000 695" role="img" aria-labelledby="title desc"><title id="title">输出层：多分类逻辑回归与表示几何</title><desc id="desc">这是输出头的完整算例；h 为指定值，不声称已算出完整 Transformer。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#147d99"/></marker></defs><rect width="1000" height="695" fill="#fafbfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="52" font-size="30" fill="#173747">输出层：多分类逻辑回归与表示几何</text><text x="32" y="91" font-size="21" fill="#526574">这是输出头的完整算例；h 为指定值，不声称已算出完整 Transformer。</text><rect x="32" y="124" width="448" height="175" rx="10" fill="#e9f3f7"/><text x="52" y="159" font-size="25" fill="#173747">共享输出矩阵</text><text x="52" y="197" font-size="21" fill="#173747">W = [[ln6, ln3, 0],</text><text x="52" y="231" font-size="21" fill="#173747">         [0,    ln8, 0]] ∈ R^(2×3)</text><text x="52" y="265" font-size="21" fill="#173747">h₁=[1,0]；h₂=[0,1]；b=0</text><rect x="520" y="124" width="448" height="175" rx="10" fill="#e9f3f7"/><text x="540" y="159" font-size="25" fill="#173747">同一参数，不同分布</text><text x="540" y="197" font-size="21" fill="#173747">p₁=[0.6,0.3,0.1]</text><text x="540" y="231" font-size="21" fill="#173747">p₂=[0.1,0.8,0.1]</text><text x="540" y="265" font-size="21" fill="#173747">顺序：冰水 / 热茶 / 果汁</text><rect x="32" y="326" width="936" height="163" rx="10" fill="#e9f3f7"/><text x="52" y="361" font-size="25" fill="#173747">几何联系：对数概率比等于线性分数差</text><text x="52" y="399" font-size="21" fill="#173747">log(pᵢ/pⱼ) = zᵢ − zⱼ = h·(wᵢ − wⱼ) + (bᵢ − bⱼ)</text><text x="52" y="433" font-size="21" fill="#173747">对 h₁：log(p冰水/p热茶)=ln6−ln3=ln2。</text><text x="52" y="467" font-size="21" fill="#173747">softmax 的公共分母抵消；方向 wᵢ−wⱼ 决定两候选相对偏好。</text><rect x="32" y="516" width="936" height="145" rx="10" fill="#fff2df"/><text x="52" y="551" font-size="25" fill="#173747">可辨识性与结构约束</text><text x="52" y="589" font-size="21" fill="#173747">softmax(z+c·1)=softmax(z)：绝对分数零点不可辨识。</text><text x="52" y="623" font-size="21" fill="#173747">z=hW+b；多个上下文的 Z−1b=HW，其秩不超过 d。</text></g></svg>