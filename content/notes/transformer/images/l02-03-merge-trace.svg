<svg xmlns="http://www.w3.org/2000/svg" width="920" height="965" viewBox="0 0 920 965" role="img" aria-labelledby="title desc"><title id="title">BPE 的四次合并：每一步改变下一次统计</title><desc id="desc">语料只有 low×5、lower×2、new×6；字符和规则均为教学设定。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176f8a"/></marker></defs><rect width="920" height="965" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#163748">BPE 的四次合并：每一步改变下一次统计</text><text x="28" y="89" font-size="22" fill="#526878">语料只有 low×5、lower×2、new×6；字符和规则均为教学设定。</text><rect x="24" y="120" width="872" height="162" rx="7" fill="#f1f5f7"/><text x="40" y="152" font-size="25" fill="#163748">第 1 轮：l + o → lo</text><text x="640" y="152" font-size="21" fill="#a65d19">频数 7；新增 ID 6</text><text x="42" y="189" font-size="22" fill="#163748">low ×5</text><text x="215" y="189" font-size="23" fill="#163748">l | o | w</text><path d="M425,182 L463,182" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="490" y="189" font-size="23" fill="#163748">lo | w</text><text x="42" y="225" font-size="22" fill="#163748">lower ×2</text><text x="215" y="225" font-size="23" fill="#163748">l | o | w | e | r</text><path d="M425,218 L463,218" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="490" y="225" font-size="23" fill="#163748">lo | w | e | r</text><text x="42" y="261" font-size="22" fill="#163748">new ×6</text><text x="215" y="261" font-size="23" fill="#163748">n | e | w</text><path d="M425,254 L463,254" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="490" y="261" font-size="23" fill="#163748">n | e | w</text><rect x="24" y="300" width="872" height="162" rx="7" fill="#f1f5f7"/><text x="40" y="332" font-size="25" fill="#163748">第 2 轮：lo + w → low</text><text x="640" y="332" font-size="21" fill="#a65d19">频数 7；新增 ID 7</text><text x="42" y="369" font-size="22" fill="#163748">low ×5</text><text x="215" y="369" font-size="23" fill="#163748">lo | w</text><path d="M425,362 L463,362" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="490" y="369" font-size="23" fill="#163748">low</text><text x="42" y="405" font-size="22" fill="#163748">lower ×2</text><text x="215" y="405" font-size="23" fill="#163748">lo | w | e | r</text><path d="M425,398 L463,398" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="490" y="405" font-size="23" fill="#163748">low | e | r</text><text x="42" y="441" font-size="22" fill="#163748">new ×6</text><text x="215" y="441" font-size="23" fill="#163748">n | e | w</text><path d="M425,434 L463,434" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="490" y="441" font-size="23" fill="#163748">n | e | w</text><rect x="24" y="480" width="872" height="162" rx="7" fill="#f1f5f7"/><text x="40" y="512" font-size="25" fill="#163748">第 3 轮：n + e → ne</text><text x="640" y="512" font-size="21" fill="#a65d19">频数 6；新增 ID 8</text><text x="42" y="549" font-size="22" fill="#163748">low ×5</text><text x="215" y="549" font-size="23" fill="#163748">low</text><path d="M425,542 L463,542" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="490" y="549" font-size="23" fill="#163748">low</text><text x="42" y="585" font-size="22" fill="#163748">lower ×2</text><text x="215" y="585" font-size="23" fill="#163748">low | e | r</text><path d="M425,578 L463,578" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="490" y="585" font-size="23" fill="#163748">low | e | r</text><text x="42" y="621" font-size="22" fill="#163748">new ×6</text><text x="215" y="621" font-size="23" fill="#163748">n | e | w</text><path d="M425,614 L463,614" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="490" y="621" font-size="23" fill="#163748">ne | w</text><rect x="24" y="660" width="872" height="162" rx="7" fill="#f1f5f7"/><text x="40" y="692" font-size="25" fill="#163748">第 4 轮：ne + w → new</text><text x="640" y="692" font-size="21" fill="#a65d19">频数 6；新增 ID 9</text><text x="42" y="729" font-size="22" fill="#163748">low ×5</text><text x="215" y="729" font-size="23" fill="#163748">low</text><path d="M425,722 L463,722" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="490" y="729" font-size="23" fill="#163748">low</text><text x="42" y="765" font-size="22" fill="#163748">lower ×2</text><text x="215" y="765" font-size="23" fill="#163748">low | e | r</text><path d="M425,758 L463,758" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="490" y="765" font-size="23" fill="#163748">low | e | r</text><text x="42" y="801" font-size="22" fill="#163748">new ×6</text><text x="215" y="801" font-size="23" fill="#163748">ne | w</text><path d="M425,794 L463,794" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="490" y="801" font-size="23" fill="#163748">new</text><text x="28" y="884" font-size="26" fill="#163748">加权 token 总数：43 → 36 → 29 → 23 → 17</text><text x="28" y="925" font-size="22" fill="#526878">每轮都重算相邻片段；后来的片段可以由多字符组成。</text></g></svg>