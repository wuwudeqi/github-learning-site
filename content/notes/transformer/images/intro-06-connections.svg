<svg xmlns="http://www.w3.org/2000/svg" width="720" height="705" viewBox="0 0 720 705" role="img" aria-labelledby="title desc"><title id="title">这一课留下的问题，后面逐个回答</title><desc id="desc">先建立全貌，数学推导按依赖顺序展开。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176d86"/></marker></defs><rect width="720" height="705" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#153642">这一课留下的问题，后面逐个回答</text><text x="28" y="88" font-size="23" fill="#526672">先建立全貌，数学推导按依赖顺序展开。</text><rect x="28" y="122" width="664" height="97" rx="10" fill="#e9f3f5"/><text x="46" y="158" font-size="26" fill="#153642">文字怎么进入计算？</text><text x="46" y="194" font-size="23" fill="#526672">第 2～4 课：分词、向量和矩阵。</text><path d="M350,224 L350,244" stroke="#176d86" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="28" y="248" width="664" height="97" rx="10" fill="#e9f3f5"/><text x="46" y="284" font-size="26" fill="#153642">前文怎样影响下一项？</text><text x="46" y="320" font-size="23" fill="#526672">第 5～14 课：注意力与 Transformer。</text><path d="M350,350 L350,370" stroke="#176d86" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="28" y="374" width="664" height="97" rx="10" fill="#e9f3f5"/><text x="46" y="410" font-size="26" fill="#153642">算出的数怎样变成文字？</text><text x="46" y="446" font-size="23" fill="#526672">第 15～16 课：候选分数、选择和生成。</text><path d="M350,476 L350,496" stroke="#176d86" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="28" y="500" width="664" height="97" rx="10" fill="#e9f3f5"/><text x="46" y="536" font-size="26" fill="#153642">这些计算方法怎样学来？</text><text x="46" y="572" font-size="23" fill="#526672">第 17～20 课：训练、误差和参数更新。</text><text x="28" y="666" font-size="24" fill="#153642">每个问题先有直觉，再加入公式和代码。</text></g></svg>