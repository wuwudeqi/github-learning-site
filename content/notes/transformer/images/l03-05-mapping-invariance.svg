<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" role="img" aria-labelledby="title desc"><title id="title">编号可重排，匹配关系不能错</title><desc id="desc">用这个思路解释“为什么 ID 相邻不能推出语义相近”。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176f8a"/></marker></defs><rect width="920" height="700" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#163748">编号可重排，匹配关系不能错</text><text x="28" y="89" font-size="22" fill="#526878">用这个思路解释“为什么 ID 相邻不能推出语义相近”。</text><rect x="28" y="122" width="390" height="131" rx="7" fill="#edf3f6"/><text x="46" y="155" font-size="26" fill="#163748">原来的编号</text><text x="46" y="191" font-size="22" fill="#526878">low → ID 7 → [0.8,0.1,−0.2]</text><text x="46" y="224" font-size="22" fill="#526878">e   → ID 0 → [0.1,0.2,0.3]</text><path d="M434,197 L483,197" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="499" y="122" width="393" height="131" rx="7" fill="#edf3f6"/><text x="517" y="155" font-size="26" fill="#163748">同步重排后</text><text x="517" y="191" font-size="22" fill="#526878">low → 新 ID 2 → 同一组数</text><text x="517" y="224" font-size="22" fill="#526878">e   → 新 ID 9 → 同一组数</text><rect x="28" y="339" width="864" height="131" rx="7" fill="#edf3f6"/><text x="46" y="372" font-size="26" fill="#163748">真正需要保持一致的是映射关系</text><text x="46" y="408" font-size="22" fill="#526878">若同步重排词表和 E 的行，查表结果保持不变。</text><text x="46" y="441" font-size="22" fill="#526878">若只换 tokenizer，不同步模型映射，就会取错行。</text><rect x="28" y="519" width="864" height="131" rx="7" fill="#fff2de"/><text x="46" y="552" font-size="26" fill="#163748">关联：输入向量与检索向量</text><text x="46" y="588" font-size="22" fill="#526878">一个 token 的输入向量，不等于一整篇文档的检索向量。</text><text x="46" y="621" font-size="22" fill="#526878">直接平均这些行虽然能得到一个向量，却不保证适合语义检索。</text></g></svg>