<svg xmlns="http://www.w3.org/2000/svg" width="960" height="798" viewBox="0 0 960 798" role="img" aria-labelledby="title desc"><title id="title">生成循环里面，接下来要学什么</title><desc id="desc">分词、嵌入、Transformer层、输出投影、采样与解码。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#167e96"/></marker></defs><rect width="960" height="798" fill="#faf9f3"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="36" y="52" font-size="30" fill="#173747">生成循环里面，接下来要学什么</text><text x="36" y="96" font-size="22" fill="#526878">先认识每一步的任务，后续课程逐个拆开。</text><rect x="38" y="120" width="884" height="87" rx="12" fill="#e7f2f3"/><text x="62" y="153" font-size="25" fill="#173747">文字 → token ID</text><text x="62" y="186" font-size="21" fill="#526878">分词器按词表编码；下一课从这里开始。</text><path d="M476,211 L476,235" stroke="#167e96" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="240" width="884" height="87" rx="12" fill="#e7f2f3"/><text x="62" y="273" font-size="25" fill="#173747">ID → 向量</text><text x="62" y="306" font-size="21" fill="#526878">查 Embedding 表，把编号换成可计算的数字。</text><path d="M476,331 L476,355" stroke="#167e96" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="360" width="884" height="87" rx="12" fill="#e7f2f3"/><text x="62" y="393" font-size="25" fill="#173747">向量 → 上下文表示</text><text x="62" y="426" font-size="21" fill="#526878">Transformer 层处理位置与前文信息。</text><path d="M476,451 L476,475" stroke="#167e96" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="480" width="884" height="87" rx="12" fill="#e7f2f3"/><text x="62" y="513" font-size="25" fill="#173747">表示 → 候选分数</text><text x="62" y="546" font-size="21" fill="#526878">输出投影，为词表里的候选给出 logits。</text><path d="M476,571 L476,595" stroke="#167e96" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="38" y="600" width="884" height="87" rx="12" fill="#e7f2f3"/><text x="62" y="633" font-size="25" fill="#173747">分数 → 一个 token</text><text x="62" y="666" font-size="21" fill="#526878">转换概率，按生成策略选择，再解码为文字。</text><text x="36" y="760" font-size="22" fill="#173747">选出的 token 接回输入。训练会改变参数；通常的生成不更新参数。</text></g></svg>