<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="title desc"><title id="title">自回归：自己写过的，也算前文</title><desc id="desc">假设“冰水”是一个 token；各步选择仅作示意。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176d86"/></marker></defs><rect width="720" height="600" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#153642">自回归：自己写过的，也算前文</text><text x="28" y="88" font-size="23" fill="#526672">假设“冰水”是一个 token；各步选择仅作示意。</text><rect x="28" y="122" width="664" height="96" rx="10" fill="#e9f3f5"/><text x="46" y="158" font-size="26" fill="#153642">第一轮：接出“冰水”</text><text x="46" y="194" font-size="23" fill="#526672">天气很热，我想喝一杯 → 冰水</text><path d="M350,226 L350,258" stroke="#176d86" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="28" y="268" width="664" height="96" rx="10" fill="#e9f3f5"/><text x="46" y="304" font-size="26" fill="#153642">第二轮：接出句号</text><text x="46" y="340" font-size="23" fill="#526672">天气很热，我想喝一杯冰水 → 。</text><path d="M350,372 L350,404" stroke="#176d86" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="28" y="414" width="664" height="96" rx="10" fill="#e9f3f5"/><text x="46" y="450" font-size="26" fill="#153642">第三轮：继续写，或结束</text><text x="46" y="486" font-size="23" fill="#526672">程序按结束标记、长度限制等条件停止。</text><text x="28" y="558" font-size="25" fill="#153642">每一轮，都把已经选出的内容算进前文。</text></g></svg>