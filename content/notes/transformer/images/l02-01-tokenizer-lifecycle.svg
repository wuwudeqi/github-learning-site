<svg xmlns="http://www.w3.org/2000/svg" width="920" height="695" viewBox="0 0 920 695" role="img" aria-labelledby="title desc"><title id="title">分词器先准备规则，再拿规则编码</title><desc id="desc">分词器训练与语言模型的参数训练，是不同步骤。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176f8a"/></marker></defs><rect width="920" height="695" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#163748">分词器先准备规则，再拿规则编码</text><text x="28" y="89" font-size="22" fill="#526878">分词器训练与语言模型的参数训练，是不同步骤。</text><rect x="28" y="122" width="390" height="164" rx="7" fill="#edf3f6"/><text x="46" y="155" font-size="26" fill="#163748">准备分词器：统计语料</text><text x="46" y="191" font-size="22" fill="#526878">low×5 / lower×2 / new×6</text><text x="46" y="224" font-size="22" fill="#526878">字符起步 → 反复统计相邻片段</text><text x="46" y="257" font-size="22" fill="#526878">得到固定词表和有先后顺序的规则</text><path d="M431,209 L485,209" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="499" y="122" width="393" height="164" rx="7" fill="#edf3f6"/><text x="517" y="155" font-size="26" fill="#163748">使用分词器：编码新文本</text><text x="517" y="191" font-size="22" fill="#526878">输入 newer</text><text x="517" y="224" font-size="22" fill="#526878">应用已保存的合并规则</text><text x="517" y="257" font-size="22" fill="#526878">new | e | r → [9,0,4]</text><rect x="28" y="341" width="864" height="131" rx="7" fill="#edf3f6"/><text x="46" y="374" font-size="26" fill="#163748">固定词表（本例从 0 开始编号）</text><text x="46" y="410" font-size="22" fill="#526878">0:e   1:l   2:n   3:o   4:r   5:w</text><text x="46" y="443" font-size="22" fill="#526878">6:lo   7:low   8:ne   9:new</text><rect x="28" y="522" width="864" height="131" rx="7" fill="#fff2de"/><text x="46" y="555" font-size="26" fill="#163748">编码结果的去向</text><text x="46" y="591" font-size="22" fill="#526878">token ID → 用于查 Embedding 表 → 模型计算</text><text x="46" y="624" font-size="22" fill="#526878">解码时按同一份词表将 ID 还原；实际还需配套解码规则。</text></g></svg>