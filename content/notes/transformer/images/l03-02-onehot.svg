<svg xmlns="http://www.w3.org/2000/svg" width="920" height="725" viewBox="0 0 920 725" role="img" aria-labelledby="title desc"><title id="title">查表与矩阵乘法，为什么结果相同？</title><desc id="desc">本图索引从 0 开始；“第 1 行”对应矩阵下标 0。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176f8a"/></marker></defs><rect width="920" height="725" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#163748">查表与矩阵乘法，为什么结果相同？</text><text x="28" y="89" font-size="22" fill="#526878">本图索引从 0 开始；“第 1 行”对应矩阵下标 0。</text><text x="28" y="137" font-size="25" fill="#163748">S：用 0 和 1 表示“取哪一行”</text><text x="169" y="180" font-size="20" fill="#526878">0</text><text x="229" y="180" font-size="20" fill="#526878">1</text><text x="289" y="180" font-size="20" fill="#526878">2</text><text x="349" y="180" font-size="20" fill="#526878">3</text><text x="409" y="180" font-size="20" fill="#526878">4</text><text x="469" y="180" font-size="20" fill="#526878">5</text><text x="529" y="180" font-size="20" fill="#526878">6</text><text x="589" y="180" font-size="20" fill="#526878">7</text><text x="649" y="180" font-size="20" fill="#526878">8</text><text x="709" y="180" font-size="20" fill="#526878">9</text><text x="28" y="232" font-size="23" fill="#163748">ID 7</text><rect x="150" y="199" width="52" height="45" rx="7" fill="#edf1f4"/><text x="168" y="230" font-size="23" fill="#163748">0</text><rect x="210" y="199" width="52" height="45" rx="7" fill="#edf1f4"/><text x="228" y="230" font-size="23" fill="#163748">0</text><rect x="270" y="199" width="52" height="45" rx="7" fill="#edf1f4"/><text x="288" y="230" font-size="23" fill="#163748">0</text><rect x="330" y="199" width="52" height="45" rx="7" fill="#edf1f4"/><text x="348" y="230" font-size="23" fill="#163748">0</text><rect x="390" y="199" width="52" height="45" rx="7" fill="#edf1f4"/><text x="408" y="230" font-size="23" fill="#163748">0</text><rect x="450" y="199" width="52" height="45" rx="7" fill="#edf1f4"/><text x="468" y="230" font-size="23" fill="#163748">0</text><rect x="510" y="199" width="52" height="45" rx="7" fill="#edf1f4"/><text x="528" y="230" font-size="23" fill="#163748">0</text><rect x="570" y="199" width="52" height="45" rx="7" fill="#dceef7"/><text x="588" y="230" font-size="23" fill="#163748">1</text><rect x="630" y="199" width="52" height="45" rx="7" fill="#edf1f4"/><text x="648" y="230" font-size="23" fill="#163748">0</text><rect x="690" y="199" width="52" height="45" rx="7" fill="#edf1f4"/><text x="708" y="230" font-size="23" fill="#163748">0</text><text x="28" y="292" font-size="23" fill="#163748">ID 0</text><rect x="150" y="259" width="52" height="45" rx="7" fill="#f9e9ce"/><text x="168" y="290" font-size="23" fill="#163748">1</text><rect x="210" y="259" width="52" height="45" rx="7" fill="#edf1f4"/><text x="228" y="290" font-size="23" fill="#163748">0</text><rect x="270" y="259" width="52" height="45" rx="7" fill="#edf1f4"/><text x="288" y="290" font-size="23" fill="#163748">0</text><rect x="330" y="259" width="52" height="45" rx="7" fill="#edf1f4"/><text x="348" y="290" font-size="23" fill="#163748">0</text><rect x="390" y="259" width="52" height="45" rx="7" fill="#edf1f4"/><text x="408" y="290" font-size="23" fill="#163748">0</text><rect x="450" y="259" width="52" height="45" rx="7" fill="#edf1f4"/><text x="468" y="290" font-size="23" fill="#163748">0</text><rect x="510" y="259" width="52" height="45" rx="7" fill="#edf1f4"/><text x="528" y="290" font-size="23" fill="#163748">0</text><rect x="570" y="259" width="52" height="45" rx="7" fill="#edf1f4"/><text x="588" y="290" font-size="23" fill="#163748">0</text><rect x="630" y="259" width="52" height="45" rx="7" fill="#edf1f4"/><text x="648" y="290" font-size="23" fill="#163748">0</text><rect x="690" y="259" width="52" height="45" rx="7" fill="#edf1f4"/><text x="708" y="290" font-size="23" fill="#163748">0</text><text x="28" y="352" font-size="23" fill="#163748">ID 4</text><rect x="150" y="319" width="52" height="45" rx="7" fill="#edf1f4"/><text x="168" y="350" font-size="23" fill="#163748">0</text><rect x="210" y="319" width="52" height="45" rx="7" fill="#edf1f4"/><text x="228" y="350" font-size="23" fill="#163748">0</text><rect x="270" y="319" width="52" height="45" rx="7" fill="#edf1f4"/><text x="288" y="350" font-size="23" fill="#163748">0</text><rect x="330" y="319" width="52" height="45" rx="7" fill="#edf1f4"/><text x="348" y="350" font-size="23" fill="#163748">0</text><rect x="390" y="319" width="52" height="45" rx="7" fill="#e2f0df"/><text x="408" y="350" font-size="23" fill="#163748">1</text><rect x="450" y="319" width="52" height="45" rx="7" fill="#edf1f4"/><text x="468" y="350" font-size="23" fill="#163748">0</text><rect x="510" y="319" width="52" height="45" rx="7" fill="#edf1f4"/><text x="528" y="350" font-size="23" fill="#163748">0</text><rect x="570" y="319" width="52" height="45" rx="7" fill="#edf1f4"/><text x="588" y="350" font-size="23" fill="#163748">0</text><rect x="630" y="319" width="52" height="45" rx="7" fill="#edf1f4"/><text x="648" y="350" font-size="23" fill="#163748">0</text><rect x="690" y="319" width="52" height="45" rx="7" fill="#edf1f4"/><text x="708" y="350" font-size="23" fill="#163748">0</text><text x="28" y="422" font-size="26" fill="#163748">S 的形状：3×10；E 的形状：10×3</text><text x="28" y="472" font-size="26" fill="#163748">X = S E，形状：(3×10) × (10×3) = 3×3</text><rect x="28" y="516" width="864" height="164" rx="7" fill="#fff2de"/><text x="46" y="549" font-size="26" fill="#163748">把第 1 行、第 2 列展开</text><text x="46" y="585" font-size="22" fill="#526878">X[0,1] = 0×E[0,1] + … + 1×E[7,1] + … + 0×E[9,1]</text><text x="46" y="618" font-size="22" fill="#526878">          = E[7,1] = 0.1</text><text x="46" y="651" font-size="22" fill="#526878">中间的 10 对齐；每行只有一个 1，留下的正是选中那行。</text></g></svg>