<svg xmlns="http://www.w3.org/2000/svg" width="920" height="775" viewBox="0 0 920 775" role="img" aria-labelledby="title desc"><title id="title">使用阶段：按已有规则处理新词</title><desc id="desc">“没有整词条目”不等于“无法编码”；关键看基础片段能否覆盖。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176f8a"/></marker></defs><rect width="920" height="775" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#163748">使用阶段：按已有规则处理新词</text><text x="28" y="89" font-size="22" fill="#526878">“没有整词条目”不等于“无法编码”；关键看基础片段能否覆盖。</text><text x="28" y="139" font-size="25" fill="#163748">未在训练词表中出现的完整单词：newer</text><text x="28" y="202" font-size="22" fill="#163748">初始字符</text><rect x="351" y="173" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="363" y="203" font-size="25" fill="#163748">n</text><rect x="422" y="173" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="434" y="203" font-size="25" fill="#163748">e</text><rect x="493" y="173" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="505" y="203" font-size="25" fill="#163748">w</text><rect x="564" y="173" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="576" y="203" font-size="25" fill="#163748">e</text><rect x="635" y="173" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="647" y="203" font-size="25" fill="#163748">r</text><text x="28" y="292" font-size="22" fill="#163748">规则 1、2 无匹配</text><rect x="351" y="263" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="363" y="293" font-size="25" fill="#163748">n</text><rect x="422" y="263" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="434" y="293" font-size="25" fill="#163748">e</text><rect x="493" y="263" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="505" y="293" font-size="25" fill="#163748">w</text><rect x="564" y="263" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="576" y="293" font-size="25" fill="#163748">e</text><rect x="635" y="263" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="647" y="293" font-size="25" fill="#163748">r</text><text x="28" y="382" font-size="22" fill="#163748">规则 3：n+e → ne</text><rect x="351" y="353" width="68" height="44" rx="7" fill="#f9e9ce"/><text x="363" y="383" font-size="25" fill="#163748">ne</text><rect x="428" y="353" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="440" y="383" font-size="25" fill="#163748">w</text><rect x="499" y="353" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="511" y="383" font-size="25" fill="#163748">e</text><rect x="570" y="353" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="582" y="383" font-size="25" fill="#163748">r</text><text x="28" y="472" font-size="22" fill="#163748">规则 4：ne+w → new</text><rect x="351" y="443" width="90" height="44" rx="7" fill="#f9e9ce"/><text x="363" y="473" font-size="25" fill="#163748">new</text><rect x="450" y="443" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="462" y="473" font-size="25" fill="#163748">e</text><rect x="521" y="443" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="533" y="473" font-size="25" fill="#163748">r</text><rect x="28" y="552" width="864" height="131" rx="7" fill="#edf3f6"/><text x="46" y="585" font-size="26" fill="#163748">查词表并解码核对</text><text x="46" y="621" font-size="22" fill="#526878">new → 9；e → 0；r → 4；输出 ID=[9,0,4]</text><text x="46" y="654" font-size="22" fill="#526878">反向查表并拼接：new + e + r = newer</text><text x="28" y="733" font-size="22" fill="#526878">词表和规则保持不变；不会为这一条输入重新统计词频。</text></g></svg>