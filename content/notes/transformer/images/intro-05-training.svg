<svg xmlns="http://www.w3.org/2000/svg" width="720" height="570" viewBox="0 0 720 570" role="img" aria-labelledby="title desc"><title id="title">训练与生成，差在是否调整参数</title><desc id="desc">知道两者的分工，就能避免把上下文当作训练。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176d86"/></marker></defs><rect width="720" height="570" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#153642">训练与生成，差在是否调整参数</text><text x="28" y="88" font-size="23" fill="#526672">知道两者的分工，就能避免把上下文当作训练。</text><rect x="28" y="122" width="664" height="133" rx="10" fill="#e9f3f5"/><text x="46" y="158" font-size="26" fill="#153642">训练：边练习，边调整内部的数值</text><text x="46" y="194" font-size="23" fill="#526672">看文本 → 预测 → 比较目标 → 调整参数</text><rect x="28" y="288" width="664" height="133" rx="10" fill="#e9f3f5"/><text x="46" y="324" font-size="26" fill="#153642">生成：用已经学到的数值计算</text><text x="46" y="360" font-size="23" fill="#526672">读前文 → 算候选 → 选一个 → 接回前文</text><text x="28" y="478" font-size="25" fill="#153642">“参数”就是模型里通过训练调整的数值。</text><text x="28" y="525" font-size="24" fill="#153642">通常的聊天生成，不会边回答边更新参数。</text></g></svg>