<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="695" viewBox="0 0 1000 695" role="img" aria-labelledby="title desc"><title id="title">前文怎样进入最后位置的表示</title><desc id="desc">例子只包含单头注意力；不含位置编码、残差、归一化或 MLP。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#147d99"/></marker></defs><rect width="1000" height="695" fill="#fafbfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="52" font-size="30" fill="#173747">前文怎样进入最后位置的表示</text><text x="32" y="91" font-size="21" fill="#526574">例子只包含单头注意力；不含位置编码、残差、归一化或 MLP。</text><rect x="32" y="125" width="936" height="132" rx="10" fill="#e9f3f7"/><text x="52" y="160" font-size="25" fill="#173747">行向量约定：每行对应一个位置</text><text x="52" y="198" font-size="21" fill="#173747">X ∈ R^(T×d)；Q=XWQ，K=XWK，V=XWV</text><text x="52" y="232" font-size="21" fill="#173747">QKᵀ ∈ R^(T×T)；A=softmax_rows(QKᵀ/√dₖ + M)</text><rect x="32" y="284" width="448" height="220" rx="10" fill="#e9f3f7"/><text x="52" y="319" font-size="25" fill="#173747">因果依赖矩阵 M</text><text x="52" y="357" font-size="21" fill="#173747">        来源位置  1     2     3</text><text x="52" y="391" font-size="21" fill="#173747">查询 1               0    −∞    −∞</text><text x="52" y="425" font-size="21" fill="#173747">查询 2               0      0    −∞</text><text x="52" y="459" font-size="21" fill="#173747">查询 3               0      0      0</text><rect x="520" y="284" width="448" height="220" rx="10" fill="#e9f3f7"/><text x="540" y="319" font-size="25" fill="#173747">可核算的两位置例子</text><text x="540" y="357" font-size="21" fill="#173747">X=Q=K=V=[[1,0],[0,1]]</text><text x="540" y="391" font-size="21" fill="#173747">A₁=[1,0]</text><text x="540" y="425" font-size="21" fill="#173747">A₂≈[0.330238,0.669762]</text><text x="540" y="459" font-size="21" fill="#173747">(AV)₂≈[0.330238,0.669762]</text><rect x="32" y="532" width="936" height="132" rx="10" fill="#fff2df"/><text x="52" y="567" font-size="25" fill="#173747">为什么只用最后位置预测新 token？</text><text x="52" y="605" font-size="21" fill="#173747">因果约束下，hᵢ 只能利用 x₁…xᵢ；hT 对应整个当前前缀。</text><text x="52" y="639" font-size="21" fill="#173747">遮罩限制依赖；位置编码表达顺序，两者承担不同任务。</text></g></svg>