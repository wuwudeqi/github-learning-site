<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">整段的概率，沿着生成路径相乘</title><desc id="desc">先冰水概率0.6，在此条件下句号概率0.8，两token路径概率0.48。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#167e96"/></marker></defs><rect width="960" height="590" fill="#faf9f3"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="36" y="52" font-size="30" fill="#173747">整段的概率，沿着生成路径相乘</text><text x="36" y="96" font-size="22" fill="#526878">C 代表固定前缀“天气很热，我想喝一杯”。</text><rect x="36" y="185" width="220" height="74" rx="12" fill="#e7f2f3"/><text x="60" y="230" font-size="26" fill="#173747">已有前缀 C</text><path d="M270,216 L450,160" stroke="#167e96" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M270,230 L450,354" stroke="#167e96" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="298" y="148" font-size="25" fill="#167e96">0.6</text><text x="298" y="340" font-size="25" fill="#526878">0.4</text><rect x="464" y="116" width="174" height="78" rx="12" fill="#e7f2f3"/><text x="502" y="165" font-size="26" fill="#173747">冰水</text><rect x="464" y="317" width="174" height="78" rx="12" fill="#eceff1"/><text x="492" y="365" font-size="24" fill="#173747">其他候选</text><path d="M650,153 L756,153" stroke="#167e96" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="665" y="130" font-size="24" fill="#167e96">0.8</text><rect x="772" y="116" width="144" height="78" rx="12" fill="#e7f2f3"/><text x="827" y="165" font-size="28" fill="#173747">。</text><path d="M650,171 L756,266" stroke="#167e96" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="681" y="240" font-size="23" fill="#526878">0.2</text><text x="785" y="280" font-size="22" fill="#173747">其他后续</text><text x="36" y="457" font-size="27" fill="#173747">路径“冰水 → 。”的概率：0.6 × 0.8 = 0.48</text><text x="36" y="507" font-size="22" fill="#173747">第二步的 0.8，条件里已经包含第一步选出的“冰水”。</text><text x="36" y="551" font-size="21" fill="#526878">只计算这两个 token 的路径；后续结束标记的概率未计入。</text></g></svg>