<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">token：模型处理的文字小块</title><desc id="desc">先认识单位，下一课再学怎么切分。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176d86"/></marker></defs><rect width="720" height="520" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#153642">token：模型处理的文字小块</text><text x="28" y="88" font-size="23" fill="#526672">先认识单位，下一课再学怎么切分。</text><text x="28" y="141" font-size="28" fill="#153642">原文：今天很热。</text><rect x="28" y="181" width="145" height="64" rx="10" fill="#e9f3f5"/><text x="46" y="217" font-size="26" fill="#153642">今天</text><rect x="201" y="181" width="145" height="64" rx="10" fill="#e9f3f5"/><text x="219" y="217" font-size="26" fill="#153642">很</text><rect x="374" y="181" width="145" height="64" rx="10" fill="#e9f3f5"/><text x="392" y="217" font-size="26" fill="#153642">热</text><rect x="547" y="181" width="145" height="64" rx="10" fill="#e9f3f5"/><text x="565" y="217" font-size="26" fill="#153642">。</text><text x="28" y="294" font-size="26" fill="#153642">上面每个框，暂时看作一个 token。</text><rect x="28" y="327" width="664" height="112" rx="10" fill="#e9f3f5"/><text x="46" y="363" font-size="26" fill="#153642">一个 token 可以不止一个字</text><text x="46" y="399" font-size="23" fill="#526672">具体切法取决于分词器。</text><text x="28" y="480" font-size="23" fill="#526672">这是教学切分，不是某个实际模型的输出。</text></g></svg>