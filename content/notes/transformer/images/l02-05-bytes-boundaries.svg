<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780" role="img" aria-labelledby="title desc"><title id="title">中文为什么不能按“一个字一个 token”估算</title><desc id="desc">本课的字符 BPE 简化了这些环节；实际实现要检查配置。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176f8a"/></marker></defs><rect width="920" height="780" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#163748">中文为什么不能按“一个字一个 token”估算</text><text x="28" y="89" font-size="22" fill="#526878">本课的字符 BPE 简化了这些环节；实际实现要检查配置。</text><rect x="28" y="122" width="864" height="98" rx="7" fill="#edf3f6"/><text x="46" y="155" font-size="26" fill="#163748">真实管线可能包含这些环节</text><text x="46" y="191" font-size="22" fill="#526878">原文 → 规范化（可选）→ 预切分 → 子词算法 → 特殊 token → ID</text><text x="28" y="280" font-size="26" fill="#163748">字符、字节和 token，是不同的计数单位。</text><rect x="28" y="318" width="62" height="44" rx="7" fill="#e4f0f5"/><text x="40" y="348" font-size="25" fill="#163748">中</text><path d="M124,340 L224,340" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="244" y="318" width="68" height="44" rx="7" fill="#e4f0f5"/><text x="256" y="348" font-size="25" fill="#163748">E4</text><rect x="321" y="318" width="68" height="44" rx="7" fill="#e4f0f5"/><text x="333" y="348" font-size="25" fill="#163748">B8</text><rect x="398" y="318" width="68" height="44" rx="7" fill="#e4f0f5"/><text x="410" y="348" font-size="25" fill="#163748">AD</text><text x="244" y="391" font-size="24" fill="#163748">UTF-8：三个字节（十六进制）</text><rect x="28" y="426" width="864" height="131" rx="7" fill="#edf3f6"/><text x="46" y="459" font-size="26" fill="#163748">byte-level BPE 的起点</text><text x="46" y="495" font-size="22" fill="#526878">基础符号覆盖 256 个字节值，再学习合并字节片段。</text><text x="46" y="528" font-size="22" fill="#526878">一个 token 的字节不一定独立构成完整 Unicode 字符。</text><rect x="28" y="606" width="864" height="131" rx="7" fill="#fff2de"/><text x="46" y="639" font-size="26" fill="#163748">排查实践</text><text x="46" y="675" font-size="22" fill="#526878">先看完整 encode/decode，再看单个 token；不要逐块强行解码。</text><text x="46" y="708" font-size="22" fill="#526878">如果规范化改了原文，解码未必恢复原始大小写或空格。</text></g></svg>