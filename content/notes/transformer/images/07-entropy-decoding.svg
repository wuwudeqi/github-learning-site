<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="695" viewBox="0 0 1000 695" role="img" aria-labelledby="title desc"><title id="title">概率、信息量与任务正确性</title><desc id="desc">同一组 logits 可以配不同解码策略；评估必须说明使用哪种分布。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#147d99"/></marker></defs><rect width="1000" height="695" fill="#fafbfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="52" font-size="30" fill="#173747">概率、信息量与任务正确性</text><text x="32" y="91" font-size="21" fill="#526574">同一组 logits 可以配不同解码策略；评估必须说明使用哪种分布。</text><rect x="32" y="124" width="448" height="206" rx="10" fill="#e9f3f7"/><text x="52" y="159" font-size="25" fill="#173747">分布不确定性</text><text x="52" y="197" font-size="21" fill="#173747">H(p)=−Σ pᵢ ln pᵢ，单位 nats</text><text x="52" y="231" font-size="21" fill="#173747">p₁=[.6,.3,.1]：H≈0.897946</text><text x="52" y="265" font-size="21" fill="#173747">p₂=[.1,.8,.1]：H≈0.639032</text><text x="52" y="299" font-size="21" fill="#173747">熵低说明集中，不证明事实正确。</text><rect x="520" y="124" width="448" height="206" rx="10" fill="#e9f3f7"/><text x="540" y="159" font-size="25" fill="#173747">温度改变采样分布</text><text x="540" y="197" font-size="21" fill="#173747">qτ(i) ∝ exp(zᵢ/τ) ∝ pᵢ^(1/τ)</text><text x="540" y="231" font-size="21" fill="#173747">τ=.5：q∝[.36,.09,.01]</text><text x="540" y="265" font-size="21" fill="#173747">q≈[.782609,.195652,.021739]</text><text x="540" y="299" font-size="21" fill="#173747">模型参数 θ 不随温度调整。</text><rect x="32" y="358" width="936" height="135" rx="10" fill="#e9f3f7"/><text x="52" y="393" font-size="25" fill="#173747">从拟合分布到知识联系</text><text x="52" y="431" font-size="21" fill="#173747">H(p*,pθ)=H(p*)+D_KL(p*‖pθ)</text><text x="52" y="465" font-size="21" fill="#173747">真实条件分布 p* 固定时，最小化交叉熵等价于最小化 KL。</text><rect x="32" y="521" width="936" height="142" rx="10" fill="#fff2df"/><text x="52" y="556" font-size="25" fill="#173747">Agent 的评估需要再跨一步</text><text x="52" y="594" font-size="21" fill="#173747">token 似然 → 输出合法性 → 工具执行 → 任务成功</text><text x="52" y="628" font-size="21" fill="#173747">schema 约束缩小候选集合；事实核验与工具结果检验仍要单独做。</text></g></svg>