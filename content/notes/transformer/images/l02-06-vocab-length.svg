<svg xmlns="http://www.w3.org/2000/svg" width="920" height="665" viewBox="0 0 920 665" role="img" aria-labelledby="title desc"><title id="title">V 与 T：两种“大小”怎样影响模型</title><desc id="desc">d 在第 3 课解释；这里先理解为每行保存的数字个数。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176f8a"/></marker></defs><rect width="920" height="665" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#163748">V 与 T：两种“大小”怎样影响模型</text><text x="28" y="89" font-size="22" fill="#526878">d 在第 3 课解释；这里先理解为每行保存的数字个数。</text><rect x="28" y="122" width="410" height="164" rx="7" fill="#edf3f6"/><text x="46" y="155" font-size="26" fill="#163748">词表大小 V</text><text x="46" y="191" font-size="22" fill="#526878">有多少种可用 token</text><text x="46" y="224" font-size="22" fill="#526878">影响嵌入表 E 的行数</text><text x="46" y="257" font-size="22" fill="#526878">不是当前输入的长度</text><rect x="482" y="122" width="410" height="164" rx="7" fill="#edf3f6"/><text x="500" y="155" font-size="26" fill="#163748">序列长度 T</text><text x="500" y="191" font-size="22" fill="#526878">这条输入编码后有几项</text><text x="500" y="224" font-size="22" fill="#526878">影响当前位置数量</text><text x="500" y="257" font-size="22" fill="#526878">同一词表下，不同输入的 T 不同</text><text x="28" y="348" font-size="25" fill="#163748">本例：6 个基础片段 + 4 个合并片段 → V=10</text><text x="28" y="396" font-size="25" fill="#163748">lower → [7,0,4] → T=3；new → [9] → T=1</text><rect x="28" y="446" width="864" height="164" rx="7" fill="#fff2de"/><text x="46" y="479" font-size="26" fill="#163748">词表扩大的成本与收益</text><text x="46" y="515" font-size="22" fill="#526878">Embedding 参数个数 = V × d（每项 token 存 d 个数）</text><text x="46" y="548" font-size="22" fill="#526878">更多合并可能缩短输入，但会扩大词表相关的参数与输出。</text><text x="46" y="581" font-size="22" fill="#526878">语义是否有用，仍需要模型训练；BPE 主要依据片段频次。</text></g></svg>