<svg xmlns="http://www.w3.org/2000/svg" width="920" height="678" viewBox="0 0 920 678" role="img" aria-labelledby="title desc"><title id="title">同一行参数可以被多次使用</title><desc id="desc">查表阶段相同，不代表经过整层网络后仍相同。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176f8a"/></marker></defs><rect width="920" height="678" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#163748">同一行参数可以被多次使用</text><text x="28" y="89" font-size="22" fill="#526878">查表阶段相同，不代表经过整层网络后仍相同。</text><rect x="28" y="122" width="864" height="98" rx="7" fill="#edf3f6"/><text x="46" y="155" font-size="26" fill="#163748">输入同一个 token 两次：ID=[7,0,7]</text><text x="46" y="191" font-size="22" fill="#526878">输出第 1 行与第 3 行都来自 E[7]，查表值相同。</text><rect x="40" y="280" width="240" height="65" rx="7" fill="#edf3f6"/><text x="58" y="313" font-size="26" fill="#163748">位置 1 → E[7]</text><rect x="340" y="280" width="240" height="65" rx="7" fill="#edf3f6"/><text x="358" y="313" font-size="26" fill="#163748">位置 2 → E[0]</text><rect x="640" y="280" width="252" height="65" rx="7" fill="#edf3f6"/><text x="658" y="313" font-size="26" fill="#163748">位置 3 → E[7]</text><text x="305" y="399" font-size="24" fill="#163748">E[7]：共享的一行参数</text><path d="M410,365 L164,346" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M515,365 L758,346" stroke="#176f8a" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="28" y="432" width="864" height="131" rx="7" fill="#edf3f6"/><text x="46" y="465" font-size="26" fill="#163748">训练时，这一行收到来自不同位置的调整信号</text><text x="46" y="501" font-size="22" fill="#526878">位置 1 给：[1,0,0]；位置 3 给：[3,0,1]</text><text x="46" y="534" font-size="22" fill="#526878">汇总到 E[7]：[4,0,1]（只展示梯度累加，不是直接加到参数）</text><text x="28" y="633" font-size="23" fill="#163748">后续模型处理位置和前文后，这两个位置的表示可以不同。</text></g></svg>