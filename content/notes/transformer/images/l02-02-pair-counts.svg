<svg xmlns="http://www.w3.org/2000/svg" width="920" height="652" viewBox="0 0 920 652" role="img" aria-labelledby="title desc"><title id="title">第 1 次统计：为什么先合并 l + o？</title><desc id="desc">相邻指同一个词内的相邻片段；本例不跨词边界合并。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176f8a"/></marker></defs><rect width="920" height="652" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#163748">第 1 次统计：为什么先合并 l + o？</text><text x="28" y="89" font-size="22" fill="#526878">相邻指同一个词内的相邻片段；本例不跨词边界合并。</text><text x="28" y="139" font-size="24" fill="#163748">词频会计入每一对相邻片段的次数。</text><text x="28" y="188" font-size="22" fill="#163748">片段对</text><text x="196" y="188" font-size="22" fill="#163748">来自 low×5</text><text x="365" y="188" font-size="22" fill="#163748">来自 lower×2</text><text x="554" y="188" font-size="22" fill="#163748">来自 new×6</text><text x="754" y="188" font-size="22" fill="#163748">总次数</text><rect x="24" y="211" width="868" height="46" rx="7" fill="#f9e9ce"/><text x="33" y="242" font-size="23" fill="#163748">(&#x27;l&#x27;, &#x27;o&#x27;)</text><text x="201" y="242" font-size="23" fill="#163748">5</text><text x="370" y="242" font-size="23" fill="#163748">2</text><text x="559" y="242" font-size="23" fill="#163748">0</text><text x="759" y="242" font-size="23" fill="#163748">7</text><rect x="24" y="264" width="868" height="46" rx="7" fill="#f7f9fb"/><text x="33" y="295" font-size="23" fill="#163748">(&#x27;o&#x27;, &#x27;w&#x27;)</text><text x="201" y="295" font-size="23" fill="#163748">5</text><text x="370" y="295" font-size="23" fill="#163748">2</text><text x="559" y="295" font-size="23" fill="#163748">0</text><text x="759" y="295" font-size="23" fill="#163748">7</text><rect x="24" y="317" width="868" height="46" rx="7" fill="#edf3f6"/><text x="33" y="348" font-size="23" fill="#163748">(&#x27;w&#x27;, &#x27;e&#x27;)</text><text x="201" y="348" font-size="23" fill="#163748">0</text><text x="370" y="348" font-size="23" fill="#163748">2</text><text x="559" y="348" font-size="23" fill="#163748">0</text><text x="759" y="348" font-size="23" fill="#163748">2</text><rect x="24" y="370" width="868" height="46" rx="7" fill="#f7f9fb"/><text x="33" y="401" font-size="23" fill="#163748">(&#x27;e&#x27;, &#x27;r&#x27;)</text><text x="201" y="401" font-size="23" fill="#163748">0</text><text x="370" y="401" font-size="23" fill="#163748">2</text><text x="559" y="401" font-size="23" fill="#163748">0</text><text x="759" y="401" font-size="23" fill="#163748">2</text><rect x="24" y="423" width="868" height="46" rx="7" fill="#edf3f6"/><text x="33" y="454" font-size="23" fill="#163748">(&#x27;n&#x27;, &#x27;e&#x27;)</text><text x="201" y="454" font-size="23" fill="#163748">0</text><text x="370" y="454" font-size="23" fill="#163748">0</text><text x="559" y="454" font-size="23" fill="#163748">6</text><text x="759" y="454" font-size="23" fill="#163748">6</text><rect x="24" y="476" width="868" height="46" rx="7" fill="#f7f9fb"/><text x="33" y="507" font-size="23" fill="#163748">(&#x27;e&#x27;, &#x27;w&#x27;)</text><text x="201" y="507" font-size="23" fill="#163748">0</text><text x="370" y="507" font-size="23" fill="#163748">0</text><text x="559" y="507" font-size="23" fill="#163748">6</text><text x="759" y="507" font-size="23" fill="#163748">6</text><text x="28" y="570" font-size="25" fill="#163748">l+o 与 o+w 都是 7；本例先选 l+o。</text><text x="28" y="614" font-size="21" fill="#526878">并列时按语料扫描的首次出现顺序；不是所有实现都如此。</text></g></svg>