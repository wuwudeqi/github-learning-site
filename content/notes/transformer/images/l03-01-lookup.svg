<svg xmlns="http://www.w3.org/2000/svg" width="920" height="729" viewBox="0 0 920 729" role="img" aria-labelledby="title desc"><title id="title">Embedding 的一次前向：编号决定取哪一行</title><desc id="desc">表中数字全部手工指定；不是训练所得的语义坐标。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#176f8a"/></marker></defs><rect width="920" height="729" fill="#fbfcfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="28" y="48" font-size="30" fill="#163748">Embedding 的一次前向：编号决定取哪一行</text><text x="28" y="89" font-size="22" fill="#526878">表中数字全部手工指定；不是训练所得的语义坐标。</text><text x="28" y="139" font-size="26" fill="#163748">lower → [low, e, r] → ID=[7,0,4]</text><text x="28" y="185" font-size="24" fill="#163748">词表 / 嵌入表 E：10 行 × 3 列</text><text x="550" y="185" font-size="24" fill="#163748">按输入顺序取出：X</text><rect x="24" y="207" width="466" height="36" rx="7" fill="#f9e9ce"/><text x="36" y="233" font-size="22" fill="#163748"> 0   e   </text><text x="205" y="233" font-size="22" fill="#163748">0.1</text><text x="293" y="233" font-size="22" fill="#163748">0.2</text><text x="381" y="233" font-size="22" fill="#163748">0.3</text><rect x="24" y="249" width="466" height="36" rx="7" fill="#f0f3f6"/><text x="36" y="275" font-size="22" fill="#163748"> 1   l   </text><text x="205" y="275" font-size="22" fill="#163748">0.2</text><text x="293" y="275" font-size="22" fill="#163748">0.0</text><text x="381" y="275" font-size="22" fill="#163748">0.1</text><rect x="24" y="291" width="466" height="36" rx="7" fill="#f0f3f6"/><text x="36" y="317" font-size="22" fill="#163748"> 2   n   </text><text x="205" y="317" font-size="22" fill="#163748">0.0</text><text x="293" y="317" font-size="22" fill="#163748">0.3</text><text x="381" y="317" font-size="22" fill="#163748">0.2</text><rect x="24" y="333" width="466" height="36" rx="7" fill="#f0f3f6"/><text x="36" y="359" font-size="22" fill="#163748"> 3   o   </text><text x="205" y="359" font-size="22" fill="#163748">0.1</text><text x="293" y="359" font-size="22" fill="#163748">-0.1</text><text x="381" y="359" font-size="22" fill="#163748">0.0</text><rect x="24" y="375" width="466" height="36" rx="7" fill="#e2f0df"/><text x="36" y="401" font-size="22" fill="#163748"> 4   r   </text><text x="205" y="401" font-size="22" fill="#163748">-0.2</text><text x="293" y="401" font-size="22" fill="#163748">0.4</text><text x="381" y="401" font-size="22" fill="#163748">0.1</text><rect x="24" y="417" width="466" height="36" rx="7" fill="#f0f3f6"/><text x="36" y="443" font-size="22" fill="#163748"> 5   w   </text><text x="205" y="443" font-size="22" fill="#163748">0.3</text><text x="293" y="443" font-size="22" fill="#163748">0.2</text><text x="381" y="443" font-size="22" fill="#163748">-0.1</text><rect x="24" y="459" width="466" height="36" rx="7" fill="#f0f3f6"/><text x="36" y="485" font-size="22" fill="#163748"> 6   lo  </text><text x="205" y="485" font-size="22" fill="#163748">0.4</text><text x="293" y="485" font-size="22" fill="#163748">0.1</text><text x="381" y="485" font-size="22" fill="#163748">0.2</text><rect x="24" y="501" width="466" height="36" rx="7" fill="#dceef7"/><text x="36" y="527" font-size="22" fill="#163748"> 7   low </text><text x="205" y="527" font-size="22" fill="#163748">0.8</text><text x="293" y="527" font-size="22" fill="#163748">0.1</text><text x="381" y="527" font-size="22" fill="#163748">-0.2</text><rect x="24" y="543" width="466" height="36" rx="7" fill="#f0f3f6"/><text x="36" y="569" font-size="22" fill="#163748"> 8   ne  </text><text x="205" y="569" font-size="22" fill="#163748">0.2</text><text x="293" y="569" font-size="22" fill="#163748">0.6</text><text x="381" y="569" font-size="22" fill="#163748">0.1</text><rect x="24" y="585" width="466" height="36" rx="7" fill="#f0f3f6"/><text x="36" y="611" font-size="22" fill="#163748"> 9   new </text><text x="205" y="611" font-size="22" fill="#163748">-0.1</text><text x="293" y="611" font-size="22" fill="#163748">0.9</text><text x="381" y="611" font-size="22" fill="#163748">0.3</text><rect x="548" y="234" width="344" height="85" rx="7" fill="#dceef7"/><text x="568" y="265" font-size="22" fill="#163748">第 1 个位置 ← E[7]</text><text x="568" y="300" font-size="23" fill="#163748">[0.8, 0.1, -0.2]</text><path d="M493,519 C520,519 521,276 541,276" stroke="#176f8a" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="548" y="365" width="344" height="85" rx="7" fill="#f9e9ce"/><text x="568" y="396" font-size="22" fill="#163748">第 2 个位置 ← E[0]</text><text x="568" y="431" font-size="23" fill="#163748">[0.1, 0.2, 0.3]</text><path d="M493,225 C520,225 521,407 541,407" stroke="#176f8a" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="548" y="496" width="344" height="85" rx="7" fill="#e2f0df"/><text x="568" y="527" font-size="22" fill="#163748">第 3 个位置 ← E[4]</text><text x="568" y="562" font-size="23" fill="#163748">[-0.2, 0.4, 0.1]</text><path d="M493,393 C520,393 521,538 541,538" stroke="#176f8a" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="28" y="684" font-size="24" fill="#163748">输入顺序是 7、0、4，所以输出顺序也按 7、0、4。</text></g></svg>