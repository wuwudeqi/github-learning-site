<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">刚写出的文字，会进入下一轮输入</title><desc id="desc">三轮前缀分别加入冰水、句号和结束标记。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#167e96"/></marker></defs><rect width="960" height="550" fill="#faf9f3"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="36" y="52" font-size="30" fill="#173747">刚写出的文字，会进入下一轮输入</text><text x="36" y="92" font-size="21" fill="#526878">教学假设：把“冰水”当作一个 token。</text><text x="36" y="159" font-size="23" fill="#173747">第 1 轮</text><rect x="152" y="125" width="560" height="66" rx="12" fill="#e7f2f3"/><text x="172" y="166" font-size="25" fill="#173747">天气很热，我想喝一杯</text><path d="M729,158 L771,158" stroke="#167e96" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="787" y="125" width="145" height="66" rx="12" fill="#f9e6bf"/><text x="805" y="166" font-size="23" fill="#173747">冰水</text><text x="165" y="223" font-size="20" fill="#526878">把选中的 token 接回前缀，再预测。</text><text x="36" y="281" font-size="23" fill="#173747">第 2 轮</text><rect x="152" y="247" width="560" height="66" rx="12" fill="#e7f2f3"/><text x="172" y="288" font-size="25" fill="#173747">天气很热，我想喝一杯冰水</text><path d="M729,280 L771,280" stroke="#167e96" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="787" y="247" width="145" height="66" rx="12" fill="#f9e6bf"/><text x="805" y="288" font-size="23" fill="#173747">。</text><text x="165" y="345" font-size="20" fill="#526878">把选中的 token 接回前缀，再预测。</text><text x="36" y="403" font-size="23" fill="#173747">第 3 轮</text><rect x="152" y="369" width="560" height="66" rx="12" fill="#e7f2f3"/><text x="172" y="410" font-size="25" fill="#173747">天气很热，我想喝一杯冰水。</text><path d="M729,402 L771,402" stroke="#167e96" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="787" y="369" width="145" height="66" rx="12" fill="#f9e6bf"/><text x="805" y="410" font-size="23" fill="#173747">结束标记</text><text x="36" y="518" font-size="21" fill="#173747">句号本身不必然让生成停止；结束标记或程序设置决定停止。</text></g></svg>