<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="695" viewBox="0 0 1000 695" role="img" aria-labelledby="title desc"><title id="title">训练的并行与生成的顺序依赖</title><desc id="desc">分清参数 θ、当前激活和 KV cache 的生命周期。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#147d99"/></marker></defs><rect width="1000" height="695" fill="#fafbfd"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="32" y="52" font-size="30" fill="#173747">训练的并行与生成的顺序依赖</text><text x="32" y="91" font-size="21" fill="#526574">分清参数 θ、当前激活和 KV cache 的生命周期。</text><rect x="32" y="124" width="448" height="223" rx="10" fill="#e9f3f7"/><text x="52" y="159" font-size="25" fill="#173747">训练：真实前缀已知</text><text x="52" y="197" font-size="21" fill="#173747">输入：x₁  x₂  x₃</text><text x="52" y="231" font-size="21" fill="#173747">目标：x₂  x₃  x₄</text><text x="52" y="265" font-size="21" fill="#173747">遮罩保证位置 i 不看 xᵢ₊₁。</text><text x="52" y="299" font-size="21" fill="#173747">各位置损失可一次前向计算。</text><text x="52" y="333" font-size="21" fill="#173747">通常更新 θ；使用 teacher forcing。</text><rect x="520" y="124" width="448" height="223" rx="10" fill="#e9f3f7"/><text x="540" y="159" font-size="25" fill="#173747">生成：后续输入尚未选定</text><text x="540" y="197" font-size="21" fill="#173747">prefill：计算已知前缀。</text><text x="540" y="231" font-size="21" fill="#173747">decode：选 y₁，再算 y₂…</text><text x="540" y="265" font-size="21" fill="#173747">通常固定 θ，追加 K/V 缓存。</text><text x="540" y="299" font-size="21" fill="#173747">缓存的是层内键和值。</text><text x="540" y="333" font-size="21" fill="#173747">增加缓存不等于训练参数。</text><rect x="32" y="376" width="936" height="145" rx="10" fill="#e9f3f7"/><text x="52" y="411" font-size="25" fill="#173747">K/V 存储量（仅 K、V 张量）</text><text x="52" y="449" font-size="21" fill="#173747">字节数 = 2 × L × B × T × n_kv × d_head × s</text><text x="52" y="483" font-size="21" fill="#173747">L=32，B=1，T=4096，n_kv=8，d_head=128，s=2</text><text x="52" y="517" font-size="21" fill="#173747">结果：536,870,912 bytes = 512 MiB</text><rect x="32" y="548" width="936" height="114" rx="10" fill="#fff2df"/><text x="52" y="583" font-size="25" fill="#173747">复杂度取舍</text><text x="52" y="621" font-size="21" fill="#173747">单层完整注意力约 O(T²d)；缓存后的单步注意力约 O(Td)。</text><text x="52" y="655" font-size="21" fill="#173747">这些只计注意力乘法，不包括投影、MLP、模型权重和运行时开销。</text></g></svg>