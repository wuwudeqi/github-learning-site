<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">LangGraph4j 的节点怎样完成一次任务</title><desc id="desc">实线顺序由编号表示；缺少口径走等待分支，已有口径直接验证计划。1 · resolve / await_basis，缺口径：写问题并暂停，有口径：直接进入计划校验，恢复：更新状态后继续原 thread；2 · validate_plan / query_summary，固定计划和发布版本，D_A 预算 52 万 / 实际 56 万，保存结果 ID 与证据哈希；3 · decide / query_project，需要解释差异时按项目下钻，P01：+4.2 万；P02：-0.2 万，重复动作或未知工具被拒绝；4 · prepare_export / submit_export，先保存意图，再创建任务，响应丢失 → 重试返回同一任务，finish：本例只完成任务受理</desc><rect width="1120" height="610" rx="24" fill="#f4f6f7"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="57" font-size="30" font-weight="700" fill="#173a43">LangGraph4j 的节点怎样完成一次任务</text><text x="40" y="94" font-size="18" fill="#536b72">实线顺序由编号表示；缺少口径走等待分支，已有口径直接验证计划</text><rect x="40" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="148" width="5" height="34" rx="2" fill="#007f86"/><text x="62" y="169" font-size="21" font-weight="700" fill="#007f86">1 · resolve / await_basis</text><text x="62" y="206" font-size="18" fill="#304c55">缺口径：写问题并暂停</text><text x="62" y="236" font-size="18" fill="#304c55">有口径：直接进入计划校验</text><text x="62" y="266" font-size="18" fill="#304c55">恢复：更新状态后继续原 thread</text><rect x="571" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="148" width="5" height="34" rx="2" fill="#3868a5"/><text x="593" y="169" font-size="21" font-weight="700" fill="#3868a5">2 · validate_plan / query_summary</text><text x="593" y="206" font-size="18" fill="#304c55">固定计划和发布版本</text><text x="593" y="236" font-size="18" fill="#304c55">D_A 预算 52 万 / 实际 56 万</text><text x="593" y="266" font-size="18" fill="#304c55">保存结果 ID 与证据哈希</text><rect x="40" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="344" width="5" height="34" rx="2" fill="#6c58a5"/><text x="62" y="365" font-size="21" font-weight="700" fill="#6c58a5">3 · decide / query_project</text><text x="62" y="402" font-size="18" fill="#304c55">需要解释差异时按项目下钻</text><text x="62" y="432" font-size="18" fill="#304c55">P01：+4.2 万；P02：-0.2 万</text><text x="62" y="462" font-size="18" fill="#304c55">重复动作或未知工具被拒绝</text><rect x="571" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="344" width="5" height="34" rx="2" fill="#a46537"/><text x="593" y="365" font-size="21" font-weight="700" fill="#a46537">4 · prepare_export / submit_export</text><text x="593" y="402" font-size="18" fill="#304c55">先保存意图，再创建任务</text><text x="593" y="432" font-size="18" fill="#304c55">响应丢失 → 重试返回同一任务</text><text x="593" y="462" font-size="18" fill="#304c55">finish：本例只完成任务受理</text><text x="40" y="582" font-size="17" fill="#60767e">本站原创执行图；固定决策替身的行为由 Java 测试验证。</text></g></svg>
