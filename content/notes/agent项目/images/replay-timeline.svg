<svg xmlns="http://www.w3.org/2000/svg" width="960" height="850" viewBox="0 0 960 850" role="img" aria-labelledby="title desc">
<title id="title">响应丢失，重试为什么还要用原编号</title><desc id="desc">Agent保存操作编号op-001，Java提交task-001后响应丢失；恢复仍发送op-001，唯一约束返回同一个任务。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#91a4be"/></marker></defs>
<rect width="960" height="850" rx="24" fill="#f6f8fc"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="480" y="51" font-size="30" fill="#172b4d" font-weight="700" text-anchor="middle">响应丢失，重试仍是同一次操作</text>
<text x="480" y="85" font-size="21" fill="#52647e" font-weight="400" text-anchor="middle">超时不等于失败：服务端可能已经提交</text>
<rect x="42" y="115" width="236" height="56" rx="14" fill="#eaf0ff" stroke="#b9ccf9" stroke-width="1.5"/>
<text x="160" y="152" font-size="23" fill="#2864d7" font-weight="700" text-anchor="middle">Agent</text>
<line x1="160" y1="173" x2="160" y2="693" stroke="#91a4be" stroke-width="2.5" stroke-dasharray="7 6"/>
<rect x="362" y="115" width="236" height="56" rx="14" fill="#eaf0ff" stroke="#b9ccf9" stroke-width="1.5"/>
<text x="480" y="152" font-size="23" fill="#2864d7" font-weight="700" text-anchor="middle">Java 工具服务</text>
<line x1="480" y1="173" x2="480" y2="693" stroke="#91a4be" stroke-width="2.5" stroke-dasharray="7 6"/>
<rect x="682" y="115" width="236" height="56" rx="14" fill="#eaf0ff" stroke="#b9ccf9" stroke-width="1.5"/>
<text x="800" y="152" font-size="23" fill="#2864d7" font-weight="700" text-anchor="middle">任务数据库</text>
<line x1="800" y1="173" x2="800" y2="693" stroke="#91a4be" stroke-width="2.5" stroke-dasharray="7 6"/>
<rect x="34" y="196" width="252" height="78" rx="14" fill="#e7f5f2" stroke="#91cfc4" stroke-width="1.5"/>
<text x="160" y="226" font-size="21" fill="#087f78" font-weight="700" text-anchor="middle">先持久化 op-001</text>
<text x="160" y="254" font-size="19" fill="#172b4d" font-weight="400" text-anchor="middle">保存结果与格式参数</text>
<line x1="160" y1="318" x2="480" y2="318" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="320" y="304" font-size="21" fill="#172b4d" font-weight="400" text-anchor="middle">提交 op-001</text>
<line x1="480" y1="386" x2="800" y2="386" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="640" y="370" font-size="20" fill="#172b4d" font-weight="400" text-anchor="middle">唯一键创建 task-001</text>
<line x1="800" y1="447" x2="480" y2="447" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="640" y="431" font-size="21" fill="#087f78" font-weight="700" text-anchor="middle">数据库已提交</text>
<line x1="480" y1="500" x2="226" y2="500" stroke="#91a4be" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="350" y="484" font-size="21" fill="#ad3f34" font-weight="700" text-anchor="middle">响应丢失</text>
<text x="205" y="508" font-size="32" fill="#ad3f34" font-weight="700" text-anchor="middle">×</text>
<rect x="34" y="533" width="252" height="73" rx="14" fill="#fff4df" stroke="#edd299" stroke-width="1.5"/>
<text x="160" y="562" font-size="20" fill="#a65f09" font-weight="700" text-anchor="middle">进程恢复 / 网络重试</text>
<text x="160" y="590" font-size="20" fill="#172b4d" font-weight="400" text-anchor="middle">读取原 op-001</text>
<line x1="160" y1="642" x2="480" y2="642" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="320" y="627" font-size="20" fill="#172b4d" font-weight="400" text-anchor="middle">再次提交 op-001</text>
<line x1="480" y1="687" x2="160" y2="687" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="320" y="676" font-size="20" fill="#087f78" font-weight="700" text-anchor="middle">返回已有 task-001</text>
<rect x="30" y="722" width="900" height="91" rx="14" fill="#fff" stroke="#d9e2ef" stroke-width="1.5"/>
<text x="480" y="758" font-size="22" fill="#2864d7" font-weight="700" text-anchor="middle">操作编号相同 ＋ 参数相同 → 返回同一任务</text>
<text x="480" y="791" font-size="20" fill="#172b4d" font-weight="400" text-anchor="middle">同编号改参数 → 冲突；用户新提交 → 使用新操作编号</text>
</g></svg>