<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">方法、选择、执行，各自承担什么</title><desc id="desc">LangGraph4j 组织步骤，Java 服务决定请求是否可以执行。Skill 与资料，描述适用场景和操作步骤，固定版本，保留来源和有效期，硬约束仍由代码执行；模型与 Function Calling，提出动作名称和结构化参数，本轮仅开放必要工具，调用申请不等于执行授权；Java 工具适配器，检查动作、参数和受信身份，直接复用已有业务服务，返回结果并配对调用编号；MCP 外部接入，按需连接配置好的外部服务，筛选工具目录与合同版本，不改变权限和幂等规则</desc><rect width="1120" height="610" rx="24" fill="#f4f6f7"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="57" font-size="30" font-weight="700" fill="#173a43">方法、选择、执行，各自承担什么</text><text x="40" y="94" font-size="18" fill="#536b72">LangGraph4j 组织步骤，Java 服务决定请求是否可以执行</text><rect x="40" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="148" width="5" height="34" rx="2" fill="#007f86"/><text x="62" y="169" font-size="21" font-weight="700" fill="#007f86">Skill 与资料</text><text x="62" y="206" font-size="18" fill="#304c55">描述适用场景和操作步骤</text><text x="62" y="236" font-size="18" fill="#304c55">固定版本，保留来源和有效期</text><text x="62" y="266" font-size="18" fill="#304c55">硬约束仍由代码执行</text><rect x="571" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="148" width="5" height="34" rx="2" fill="#3868a5"/><text x="593" y="169" font-size="21" font-weight="700" fill="#3868a5">模型与 Function Calling</text><text x="593" y="206" font-size="18" fill="#304c55">提出动作名称和结构化参数</text><text x="593" y="236" font-size="18" fill="#304c55">本轮仅开放必要工具</text><text x="593" y="266" font-size="18" fill="#304c55">调用申请不等于执行授权</text><rect x="40" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="344" width="5" height="34" rx="2" fill="#6c58a5"/><text x="62" y="365" font-size="21" font-weight="700" fill="#6c58a5">Java 工具适配器</text><text x="62" y="402" font-size="18" fill="#304c55">检查动作、参数和受信身份</text><text x="62" y="432" font-size="18" fill="#304c55">直接复用已有业务服务</text><text x="62" y="462" font-size="18" fill="#304c55">返回结果并配对调用编号</text><rect x="571" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="344" width="5" height="34" rx="2" fill="#a46537"/><text x="593" y="365" font-size="21" font-weight="700" fill="#a46537">MCP 外部接入</text><text x="593" y="402" font-size="18" fill="#304c55">按需连接配置好的外部服务</text><text x="593" y="432" font-size="18" fill="#304c55">筛选工具目录与合同版本</text><text x="593" y="462" font-size="18" fill="#304c55">不改变权限和幂等规则</text><text x="40" y="582" font-size="17" fill="#60767e">本站原创职责图；当前演示未连接真实模型或 MCP。</text></g></svg>
