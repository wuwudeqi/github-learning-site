<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 806" role="img" aria-labelledby="title desc"><title id="title">预算汇报 Agent · Java 应用架构</title><desc id="desc">Spring Boot 与 LangGraph4j 复用 Java 业务接口；完整应用接入属于目标设计。1 · Spring Boot API，登录主体 → 创建任务 → 返回编号，保存请求、任务归属与初始状态，不跨模型等待持有事务；2 · LangGraph4j Worker，确认口径 → 查询 → 决定是否下钻，状态、条件边、检查点与恢复，模型适配器负责提出动作；3 · Java 计划与核算服务，权限、分摊、指标与版本校验，节点直接调用业务接口，外部工具按需接入 MCP；4 · 不可变查询结果，保存行列、单位、范围与哈希，状态只引用当前结果 ID，改口径创建新计划与新结果；5 · 交付 Worker，稳定意图 → 唯一任务 → 生成文件，图表、Excel 引用同一结果，发布前核对，下载时再鉴权；当前已经运行的范围，Java 合成计算 + H2 任务，LangGraph4j 等待与进程恢复，32 项检查；尚未生成真实文件</desc><rect width="1120" height="806" rx="24" fill="#f4f6f7"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="57" font-size="30" font-weight="700" fill="#173a43">预算汇报 Agent · Java 应用架构</text><text x="40" y="94" font-size="18" fill="#536b72">Spring Boot 与 LangGraph4j 复用 Java 业务接口；完整应用接入属于目标设计</text><rect x="40" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="148" width="5" height="34" rx="2" fill="#007f86"/><text x="62" y="169" font-size="21" font-weight="700" fill="#007f86">1 · Spring Boot API</text><text x="62" y="206" font-size="18" fill="#304c55">登录主体 → 创建任务 → 返回编号</text><text x="62" y="236" font-size="18" fill="#304c55">保存请求、任务归属与初始状态</text><text x="62" y="266" font-size="18" fill="#304c55">不跨模型等待持有事务</text><rect x="571" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="148" width="5" height="34" rx="2" fill="#3868a5"/><text x="593" y="169" font-size="21" font-weight="700" fill="#3868a5">2 · LangGraph4j Worker</text><text x="593" y="206" font-size="18" fill="#304c55">确认口径 → 查询 → 决定是否下钻</text><text x="593" y="236" font-size="18" fill="#304c55">状态、条件边、检查点与恢复</text><text x="593" y="266" font-size="18" fill="#304c55">模型适配器负责提出动作</text><rect x="40" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="344" width="5" height="34" rx="2" fill="#6c58a5"/><text x="62" y="365" font-size="21" font-weight="700" fill="#6c58a5">3 · Java 计划与核算服务</text><text x="62" y="402" font-size="18" fill="#304c55">权限、分摊、指标与版本校验</text><text x="62" y="432" font-size="18" fill="#304c55">节点直接调用业务接口</text><text x="62" y="462" font-size="18" fill="#304c55">外部工具按需接入 MCP</text><rect x="571" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="344" width="5" height="34" rx="2" fill="#a46537"/><text x="593" y="365" font-size="21" font-weight="700" fill="#a46537">4 · 不可变查询结果</text><text x="593" y="402" font-size="18" fill="#304c55">保存行列、单位、范围与哈希</text><text x="593" y="432" font-size="18" fill="#304c55">状态只引用当前结果 ID</text><text x="593" y="462" font-size="18" fill="#304c55">改口径创建新计划与新结果</text><rect x="40" y="522" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="540" width="5" height="34" rx="2" fill="#4b7b51"/><text x="62" y="561" font-size="21" font-weight="700" fill="#4b7b51">5 · 交付 Worker</text><text x="62" y="598" font-size="18" fill="#304c55">稳定意图 → 唯一任务 → 生成文件</text><text x="62" y="628" font-size="18" fill="#304c55">图表、Excel 引用同一结果</text><text x="62" y="658" font-size="18" fill="#304c55">发布前核对，下载时再鉴权</text><rect x="571" y="522" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="540" width="5" height="34" rx="2" fill="#a65463"/><text x="593" y="561" font-size="21" font-weight="700" fill="#a65463">当前已经运行的范围</text><text x="593" y="598" font-size="18" fill="#304c55">Java 合成计算 + H2 任务</text><text x="593" y="628" font-size="18" fill="#304c55">LangGraph4j 等待与进程恢复</text><text x="593" y="658" font-size="18" fill="#304c55">32 项检查；尚未生成真实文件</text><text x="40" y="778" font-size="17" fill="#60767e">本站原创架构图；模型、生产身份与完整交付尚待接入。</text></g></svg>
