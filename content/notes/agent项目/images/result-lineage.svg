<rect width="960" height="710" rx="24" fill="#f6f8fc"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="480" y="52" font-size="32" fill="#172b4d" font-weight="700" text-anchor="middle">一份结果，三种交付</text>
<text x="480" y="86" font-size="21" fill="#52647e" font-weight="400" text-anchor="middle">查数结束后，图表和文件不再各自查库</text>
