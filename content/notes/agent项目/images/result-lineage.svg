<text x="480" y="295" font-size="21" fill="#172b4d" font-weight="400" text-anchor="middle">D_A：预算 52 万，实际 56 万</text>
<text x="480" y="324" font-size="21" fill="#172b4d" font-weight="400" text-anchor="middle">D_B：预算 68 万，实际 70 万</text>
<line x1="480" y1="340" x2="480" y2="381" stroke="#91a4be" stroke-width="2.5"/>
<line x1="170" y1="381" x2="790" y2="381" stroke="#91a4be" stroke-width="2.5"/>
<line x1="170" y1="381" x2="170" y2="418" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="480" y1="381" x2="480" y2="418" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="790" y1="381" x2="790" y2="418" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30" y="428" width="280" height="152" rx="14" fill="#fff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="340" y="428" width="280" height="152" rx="14" fill="#fff" stroke="#d9e2ef" stroke-width="1.5"/>
<rect x="650" y="428" width="280" height="152" rx="14" fill="#fff" stroke="#d9e2ef" stroke-width="1.5"/>
<text x="170" y="464" font-size="24" fill="#087f78" font-weight="700" text-anchor="middle">原查询数据</text>
<text x="170" y="501" font-size="20" fill="#172b4d" font-weight="400" text-anchor="middle">完整行列、类型、精确值</text>
<text x="170" y="538" font-size="21" fill="#52647e" font-weight="400" text-anchor="middle">JSONL / CSV</text>
<text x="480" y="464" font-size="24" fill="#2864d7" font-weight="700" text-anchor="middle">图表</text>
<text x="480" y="501" font-size="19" fill="#172b4d" font-weight="400" text-anchor="middle">ChartSpec 选字段与样式</text>
<text x="480" y="535" font-size="20" fill="#172b4d" font-weight="400" text-anchor="middle">程序组装数组 → SVG</text>
<text x="480" y="562" font-size="18" fill="#52647e" font-weight="400" text-anchor="middle">附真正绘制的 chart_data</text>
<text x="790" y="464" font-size="24" fill="#087f78" font-weight="700" text-anchor="middle">Excel</text>
<text x="790" y="501" font-size="19" fill="#172b4d" font-weight="400" text-anchor="middle">查询结果页 ＋ 图表数据页</text>
<text x="790" y="538" font-size="20" fill="#172b4d" font-weight="400" text-anchor="middle">注明期间、口径与来源</text>
