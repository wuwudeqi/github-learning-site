<text x="480" y="154" font-size="21" fill="#2864d7" font-weight="700" text-anchor="middle">已确认：P01/P02 ＋ 上半年 ＋ 部门口径 ＋ 指定规则</text>
<line x1="480" y1="178" x2="480" y2="218" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="260" y="228" width="440" height="112" rx="14" fill="#fff" stroke="#83a6ec" stroke-width="1.5"/>
