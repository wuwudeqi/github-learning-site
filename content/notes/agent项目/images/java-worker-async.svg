<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 806" role="img" aria-labelledby="title desc"><title id="title">提交以后，由 Java Worker 继续执行</title><desc id="desc">同一个 run_id 串起任务、检查点和用户答复。1 · 页面提交，Spring Boot 保存任务并返回 ID，前端查询状态或订阅事件，入口事务在受理后结束；2 · Worker 领取，按任务编号编译 / 加载图，调用模型与受信业务接口，同一任务只允许一个恢复执行者；3 · 缺口径时等待，检查点：next = await_basis，保存问题和 waiting_revision，用户答复入口重新校验归属；4 · 补充后恢复，updateState 写入已验证答案，原 threadId + GraphInput.resume()，观察最新状态不用旧 checkpointId；5 · 提交导出意图，调用前保存 operation_id，数据库唯一约束处理重复请求，提交后响应丢失仍可取回任务；6 · 验收交付，演示：查询 + 导出任务已受理，完整应用：文件生成并完成核对，状态 END 的含义要按业务说明</desc><rect width="1120" height="806" rx="24" fill="#f4f6f7"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="57" font-size="30" font-weight="700" fill="#173a43">提交以后，由 Java Worker 继续执行</text><text x="40" y="94" font-size="18" fill="#536b72">同一个 run_id 串起任务、检查点和用户答复</text><rect x="40" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="148" width="5" height="34" rx="2" fill="#007f86"/><text x="62" y="169" font-size="21" font-weight="700" fill="#007f86">1 · 页面提交</text><text x="62" y="206" font-size="18" fill="#304c55">Spring Boot 保存任务并返回 ID</text><text x="62" y="236" font-size="18" fill="#304c55">前端查询状态或订阅事件</text><text x="62" y="266" font-size="18" fill="#304c55">入口事务在受理后结束</text><rect x="571" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="148" width="5" height="34" rx="2" fill="#3868a5"/><text x="593" y="169" font-size="21" font-weight="700" fill="#3868a5">2 · Worker 领取</text><text x="593" y="206" font-size="18" fill="#304c55">按任务编号编译 / 加载图</text><text x="593" y="236" font-size="18" fill="#304c55">调用模型与受信业务接口</text><text x="593" y="266" font-size="18" fill="#304c55">同一任务只允许一个恢复执行者</text><rect x="40" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="344" width="5" height="34" rx="2" fill="#6c58a5"/><text x="62" y="365" font-size="21" font-weight="700" fill="#6c58a5">3 · 缺口径时等待</text><text x="62" y="402" font-size="18" fill="#304c55">检查点：next = await_basis</text><text x="62" y="432" font-size="18" fill="#304c55">保存问题和 waiting_revision</text><text x="62" y="462" font-size="18" fill="#304c55">用户答复入口重新校验归属</text><rect x="571" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="344" width="5" height="34" rx="2" fill="#a46537"/><text x="593" y="365" font-size="21" font-weight="700" fill="#a46537">4 · 补充后恢复</text><text x="593" y="402" font-size="18" fill="#304c55">updateState 写入已验证答案</text><text x="593" y="432" font-size="18" fill="#304c55">原 threadId + GraphInput.resume()</text><text x="593" y="462" font-size="18" fill="#304c55">观察最新状态不用旧 checkpointId</text><rect x="40" y="522" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="540" width="5" height="34" rx="2" fill="#4b7b51"/><text x="62" y="561" font-size="21" font-weight="700" fill="#4b7b51">5 · 提交导出意图</text><text x="62" y="598" font-size="18" fill="#304c55">调用前保存 operation_id</text><text x="62" y="628" font-size="18" fill="#304c55">数据库唯一约束处理重复请求</text><text x="62" y="658" font-size="18" fill="#304c55">提交后响应丢失仍可取回任务</text><rect x="571" y="522" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="540" width="5" height="34" rx="2" fill="#a65463"/><text x="593" y="561" font-size="21" font-weight="700" fill="#a65463">6 · 验收交付</text><text x="593" y="598" font-size="18" fill="#304c55">演示：查询 + 导出任务已受理</text><text x="593" y="628" font-size="18" fill="#304c55">完整应用：文件生成并完成核对</text><text x="593" y="658" font-size="18" fill="#304c55">状态 END 的含义要按业务说明</text><text x="40" y="778" font-size="17" fill="#60767e">本站原创流程图；多实例租约与并发恢复控制需另行实现。</text></g></svg>
