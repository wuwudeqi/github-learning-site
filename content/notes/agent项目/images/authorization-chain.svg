<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="权限闭环｜“全部”不会改变授权">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#55718a"/></marker></defs>
<rect width="1200" height="550" fill="#f4f7fb"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif">
<text x="40" y="45" font-size="27" font-weight="700" fill="#152b43">权限闭环｜“全部”不会改变授权</text>
<text x="40" y="78" font-size="16" fill="#526880">检查实际访问的数据，也检查交付的结果；模型输入不是身份凭证</text>
<path d="M360 180 L438 180" fill="none" stroke="#55718a" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M760 180 L838 180" fill="none" stroke="#55718a" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M1000 240 L1000 348" fill="none" stroke="#55718a" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M840 410 L762 410" fill="none" stroke="#55718a" stroke-width="2.2" marker-end="url(#a)"/>
<path d="M440 410 L362 410" fill="none" stroke="#55718a" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="40" y="120" width="320" height="120" rx="12" fill="white" stroke="#b9ccdf"/>
<rect x="40" y="120" width="5" height="120" rx="2" fill="#147e87"/>
<text x="58" y="150" font-size="20" font-weight="600" fill="#152b43">1. 可信主体</text>
<text x="58" y="179" font-size="16" fill="#526880">用户身份 · 功能权限</text>
<text x="58" y="204" font-size="16" fill="#526880">当前组织 / 项目 / 字段范围</text>
<rect x="440" y="120" width="320" height="120" rx="12" fill="white" stroke="#b9ccdf"/>
<rect x="440" y="120" width="5" height="120" rx="2" fill="#147e87"/>
<text x="458" y="150" font-size="20" font-weight="600" fill="#152b43">2. SQL 与计划校验</text>
<text x="458" y="179" font-size="16" fill="#526880">递归检查对象和表达式</text>
<text x="458" y="204" font-size="16" fill="#526880">有效查询绑定权限与版本</text>
<rect x="840" y="120" width="320" height="120" rx="12" fill="white" stroke="#b9ccdf"/>
<rect x="840" y="120" width="5" height="120" rx="2" fill="#147e87"/>
<text x="858" y="150" font-size="20" font-weight="600" fill="#152b43">3. 受限数据库执行</text>
<text x="858" y="179" font-size="16" fill="#526880">角色 · 行列策略 · 函数限制</text>
<text x="858" y="204" font-size="16" fill="#526880">事务上下文与连接复用隔离</text>
<rect x="840" y="350" width="320" height="120" rx="12" fill="white" stroke="#b9ccdf"/>
<rect x="840" y="350" width="5" height="120" rx="2" fill="#147e87"/>
<text x="858" y="380" font-size="20" font-weight="600" fill="#152b43">4. 查询结果</text>
<text x="858" y="409" font-size="16" fill="#526880">归属 · 来源范围 · 敏感级别</text>
<text x="858" y="434" font-size="16" fill="#526880">result_id 不等于访问授权</text>
<rect x="440" y="350" width="320" height="120" rx="12" fill="white" stroke="#b9ccdf"/>
<rect x="440" y="350" width="5" height="120" rx="2" fill="#147e87"/>
<text x="458" y="380" font-size="20" font-weight="600" fill="#152b43">5. 产物与缓存</text>
<text x="458" y="409" font-size="16" fill="#526880">继承全部必要数据范围</text>
<text x="458" y="434" font-size="16" fill="#526880">缓存命中仍需检查权限</text>
<rect x="40" y="350" width="320" height="120" rx="12" fill="white" stroke="#b9ccdf"/>
<rect x="40" y="350" width="5" height="120" rx="2" fill="#147e87"/>
<text x="58" y="380" font-size="20" font-weight="600" fill="#152b43">6. 交付 / 共享 / 下载</text>
<text x="58" y="409" font-size="16" fill="#526880">重新检查当前权限</text>
<text x="58" y="434" font-size="16" fill="#526880">有汇总权不等于有明细权</text>
</g></svg>