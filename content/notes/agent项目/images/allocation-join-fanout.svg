<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc">
<title id="title">预算为什么从 70 万变成 140 万</title>
<desc id="desc">一行预算连接两条实际费用后，预算重复两次。先将实际聚合成一行，再连接预算，执行率由错误的 55% 恢复为 110%。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="960" height="820" rx="24" fill="#f8fafc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#172554">
<text x="42" y="54" font-size="29" font-weight="700">70 万预算，为什么被查成了 140 万？</text>
<text x="42" y="91" font-size="20" fill="#64748b">同一个项目，预算一行，费用两行。金额单位：万元 · 合成算例</text>
<rect x="42" y="123" width="876" height="101" rx="16" fill="#e0e7ff"/>
<text x="69" y="162" font-size="22" font-weight="700">P01 预算：70</text>
<text x="69" y="197" font-size="20">一行预算事实</text>
<path d="M376 146V200" stroke="#a5b4fc" stroke-width="2"/>
<text x="415" y="162" font-size="22" font-weight="700">P01 实际：30 ＋ 47 ＝ 77</text>
<text x="415" y="197" font-size="20">两条来源费用记录</text>
<path d="M250 233V273" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M711 233V273" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="292" width="424" height="367" rx="18" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>
<rect x="494" y="292" width="424" height="367" rx="18" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
<text x="68" y="333" font-size="23" fill="#be123c" font-weight="700">直接 JOIN，再求和</text>
<text x="68" y="369" font-size="19" fill="#9f1239">预算被复制到了每条费用上</text>
<text x="520" y="333" font-size="23" fill="#047857" font-weight="700">两边先聚合，再 JOIN</text>
<text x="520" y="369" font-size="19" fill="#065f46">先让两边每个项目都只剩一行</text>
<rect x="66" y="393" width="376" height="149" rx="10" fill="#ffffff"/>
<rect x="518" y="393" width="376" height="149" rx="10" fill="#ffffff"/>
<g font-size="21"><text x="85" y="425" fill="#64748b">行</text><text x="209" y="425" fill="#64748b">预算</text><text x="334" y="425" fill="#64748b">实际</text>
<path d="M80 438H428" stroke="#e2e8f0"/>
<text x="85" y="477">第 1 行</text><text x="218" y="477" fill="#be123c">70</text><text x="343" y="477">30</text>
<text x="85" y="520">第 2 行</text><text x="218" y="520" fill="#be123c">70</text><text x="343" y="520">47</text>
<text x="537" y="425" fill="#64748b">行</text><text x="661" y="425" fill="#64748b">预算</text><text x="786" y="425" fill="#64748b">实际</text>
<path d="M532 438H880" stroke="#e2e8f0"/>
<text x="537" y="489">P01</text><text x="670" y="489">70</text><text x="795" y="489">77</text></g>
<text x="68" y="587" font-size="24" fill="#be123c" font-weight="700">77 ÷ 140 ＝ 55%</text>
<text x="68" y="626" font-size="21" fill="#9f1239">错误结论：预算还有很多余量</text>
<text x="520" y="587" font-size="24" fill="#047857" font-weight="700">77 ÷ 70 ＝ 110%</text>
<text x="520" y="626" font-size="21" fill="#065f46">正确结论：实际已经超出预算</text>
<rect x="42" y="694" width="876" height="88" rx="14" fill="#172554"/>
<text x="68" y="730" font-size="22" fill="#ffffff" font-weight="700">真正要修的是“一行代表什么”，不是金额去重。</text>
<text x="68" y="764" font-size="19" fill="#c7d2fe">SUM(DISTINCT budget) 会误删金额碰巧相同的合法预算，不能通用修复。</text>
</g></svg>
