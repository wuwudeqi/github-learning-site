<svg xmlns="http://www.w3.org/2000/svg" width="960" height="870" viewBox="0 0 960 870" role="img" aria-labelledby="title desc">
<title id="title">Text-to-SQL 查询的三道关</title>
<desc id="desc">第一关确认业务含义与有效计划；第二关递归校验 SQL 的结构和依赖；第三关在权限和资源边界内执行并核对结果。每关保留可追溯对象。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<rect width="960" height="870" rx="24" fill="#f8fafc"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#172554">
<text x="42" y="54" font-size="29" font-weight="700">查出数字之前，要过哪三道关？</text>
<text x="42" y="92" font-size="21" fill="#475569">问题：D_A 部门上半年在 P01、P02 中承担了多少费用？</text>
<rect x="42" y="123" width="876" height="175" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<circle cx="83" cy="166" r="22" fill="#2563eb"/><text x="77" y="173" font-size="21" fill="#fff">1</text>
<text x="121" y="174" font-size="25" font-weight="700" fill="#1d4ed8">业务含义：我们到底在查什么</text>
<text x="72" y="216" font-size="21">“部门”对应承担部门；期间、项目、规则、范围都明确。</text>
<text x="72" y="250" font-size="20" fill="#475569">先匹配数据说明，再由 Java 把候选校验成有效计划。</text>
<text x="72" y="281" font-size="19" fill="#1d4ed8">留下：plan_id　｜　歧义 → 澄清；缺联合分摊规则 → 不支持</text>
<path d="M480 307V340" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="358" width="876" height="175" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
<circle cx="83" cy="401" r="22" fill="#7c3aed"/><text x="77" y="408" font-size="21" fill="#fff">2</text>
<text x="121" y="409" font-size="25" font-weight="700" fill="#6d28d9">SQL 结构：实际访问了什么</text>
<text x="72" y="451" font-size="21">逐层检查表、字段、函数、CTE、子查询与 UNION 分支。</text>
<text x="72" y="485" font-size="20" fill="#475569">不能只看最外层 SELECT，也不能相信模型自报的表名。</text>
<text x="72" y="516" font-size="19" fill="#6d28d9">留下：validated_query_id　｜　违规依赖 → 拒绝整条候选</text>
<path d="M480 542V575" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="593" width="876" height="175" rx="18" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
<circle cx="83" cy="636" r="22" fill="#059669"/><text x="77" y="643" font-size="21" fill="#fff">3</text>
<text x="121" y="644" font-size="25" font-weight="700" fill="#047857">执行与核对：权限、资源和数字都对吗</text>
<text x="72" y="686" font-size="21">受限角色执行；检查范围、单位、完整性与独立数值基准。</text>
<text x="72" y="720" font-size="20" fill="#475569">正确结果：D_A 预算 52 万、实际 56 万，不是项目全额 126 万。</text>
<text x="72" y="751" font-size="19" fill="#047857">留下：result_id　｜　金额或完整性不符 → 定位，不能润色过关</text>
<text x="42" y="818" font-size="22" font-weight="700">可运行 ≠ 查对数；最终由同一 result 生成图表、Excel 和核对数据。</text>
<text x="42" y="850" font-size="18" fill="#64748b">数值为合成算例。所有修复重新走校验，不通过放宽权限换取“成功”。</text>
</g></svg>
