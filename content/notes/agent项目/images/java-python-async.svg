<svg xmlns="http://www.w3.org/2000/svg" width="940" height="870" viewBox="0 0 940 870" role="img" aria-labelledby="title desc">
<title id="title">Java提交任务与后台Agent执行是两个阶段</title><desc id="desc">页面先经Java提交请求，Python持久化后返回run_id。页面不等待整个分析，后台Agent随后向Java调用查询工具。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#78909c"/></marker></defs>
<rect width="940" height="870" rx="18" fill="#f4f7fa"/>
<g font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="30" y="45" font-size="28" fill="#24394a" font-weight="700">Java → Python → Java：谁在等谁？</text>
<text x="30" y="79" font-size="18" fill="#617789" font-weight="400">两段流程示意 · 不跨模型等待持有 Java 数据库事务</text>
<rect x="30" y="108" width="230" height="53" rx="12" fill="#eaf0f6" stroke="#dbe3e9"/>
<text x="48" y="142" font-size="22" fill="#24394a" font-weight="700">页面</text>
<rect x="330" y="108" width="250" height="53" rx="12" fill="#eaf0f6" stroke="#dbe3e9"/>
<text x="348" y="142" font-size="22" fill="#24394a" font-weight="700">Java 预算应用</text>
<rect x="670" y="108" width="240" height="53" rx="12" fill="#eaf0f6" stroke="#dbe3e9"/>
<text x="688" y="142" font-size="22" fill="#24394a" font-weight="700">Python / Agent</text>
<path d="M145 177 V759" stroke="#cad6df" stroke-width="2" stroke-dasharray="5 7"/>
<path d="M455 177 V759" stroke="#cad6df" stroke-width="2" stroke-dasharray="5 7"/>
<path d="M790 177 V759" stroke="#cad6df" stroke-width="2" stroke-dasharray="5 7"/>
<path d="M145 213 L455 213" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="167" y="199" font-size="20" fill="#24394a" font-weight="400">1  提交问题</text>
<path d="M455 283 L790 283" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="269" font-size="20" fill="#24394a" font-weight="400">2  提交 request_id</text>
<path d="M790 365 L455 365" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="485" y="351" font-size="20" fill="#24394a" font-weight="400">3  保存后返回 run_id</text>
<path d="M455 425 L145 425" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="170" y="411" font-size="20" fill="#24394a" font-weight="400">4  返回任务编号</text>
<rect x="675" y="301" width="230" height="34" rx="12" fill="#e6f3eb" stroke="#bcd8c8"/>
<text x="686" y="325" font-size="18" fill="#1a6149" font-weight="400">任务已写入数据库</text>
<rect x="30" y="461" width="880" height="52" rx="12" fill="#e6f3eb" stroke="#bcd8c8"/>
<text x="50" y="494" font-size="23" fill="#1a6149" font-weight="700">页面可以查进度；完整分析在后台继续执行</text>
<path d="M790 569 L455 569" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="554" font-size="20" fill="#24394a" font-weight="400">5  Agent 请求业务查询</text>
<rect x="333" y="591" width="245" height="52" rx="12" fill="#ffffff" stroke="#dbe3e9"/>
<text x="351" y="624" font-size="19" fill="#24394a" font-weight="400">校验权限、规则并查数</text>
<path d="M455 688 L790 688" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="486" y="673" font-size="20" fill="#24394a" font-weight="400">6  返回 result_id + 摘要</text>
<rect x="644" y="716" width="266" height="51" rx="12" fill="#ffffff" stroke="#dbe3e9"/>
<text x="660" y="748" font-size="20" fill="#24394a" font-weight="400">Agent 决定下钻或交付</text>
<text x="32" y="815" font-size="19" fill="#596f81" font-weight="400">工具只执行业务，不反过来启动 Agent。提交超时，仍用原 request_id 重试。</text>
</g></svg>