<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" role="img" aria-labelledby="title desc">
<title id="title">数字错了，先定位哪一层</title><desc id="desc">对比答案、工具结果、有效计划、版本、源数据，最后检查SQL粒度与分摊计算。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#91a4be"/></marker></defs>
<rect width="960" height="880" rx="24" fill="#f6f8fc"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="480" y="51" font-size="31" fill="#172b4d" font-weight="700" text-anchor="middle">数字错了，先定位哪一层</text>
<text x="480" y="88" font-size="20" fill="#52647e" font-weight="400" text-anchor="middle">从答案往数据源查；“否”指向优先排查的地方</text>
<rect x="30" y="127" width="470" height="82" rx="14" fill="#fff" stroke="#bed0eb" stroke-width="1.5"/>
<text x="265" y="175" font-size="22" fill="#172b4d" font-weight="700" text-anchor="middle">① 工具结果与答案数字一致？</text>
<line x1="508" y1="168" x2="593" y2="168" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="548" y="156" font-size="18" fill="#a65f09" font-weight="700" text-anchor="middle">否</text>
<rect x="610" y="126" width="320" height="84" rx="14" fill="#fff4df" stroke="#edd299" stroke-width="1.5"/>
<text x="770" y="159" font-size="23" fill="#a65f09" font-weight="700" text-anchor="middle">展示与引用层</text>
<text x="770" y="188" font-size="19" fill="#172b4d" font-weight="400" text-anchor="middle">看单位、格式和证据 ID</text>
<line x1="265" y1="209" x2="265" y2="264" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="286" y="243" font-size="18" fill="#087f78" font-weight="700" text-anchor="middle">是</text>
<rect x="30" y="272" width="470" height="82" rx="14" fill="#fff" stroke="#bed0eb" stroke-width="1.5"/>
<text x="265" y="320" font-size="22" fill="#172b4d" font-weight="700" text-anchor="middle">② 有效计划符合用户口径？</text>
<line x1="508" y1="313" x2="593" y2="313" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="548" y="301" font-size="18" fill="#a65f09" font-weight="700" text-anchor="middle">否</text>
<rect x="610" y="271" width="320" height="84" rx="14" fill="#fff4df" stroke="#edd299" stroke-width="1.5"/>
<text x="770" y="304" font-size="23" fill="#a65f09" font-weight="700" text-anchor="middle">计划与检索层</text>
<text x="770" y="333" font-size="19" fill="#172b4d" font-weight="400" text-anchor="middle">看分摊轴、指标、期间</text>
<line x1="265" y1="354" x2="265" y2="409" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="286" y="388" font-size="18" fill="#087f78" font-weight="700" text-anchor="middle">是</text>
<rect x="30" y="417" width="470" height="82" rx="14" fill="#fff" stroke="#bed0eb" stroke-width="1.5"/>
<text x="265" y="465" font-size="22" fill="#172b4d" font-weight="700" text-anchor="middle">③ 数据与规则版本都一致？</text>
<line x1="508" y1="458" x2="593" y2="458" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="548" y="446" font-size="18" fill="#a65f09" font-weight="700" text-anchor="middle">否</text>
<rect x="610" y="416" width="320" height="84" rx="14" fill="#fff4df" stroke="#edd299" stroke-width="1.5"/>
<text x="770" y="449" font-size="23" fill="#a65f09" font-weight="700" text-anchor="middle">版本绑定层</text>
<text x="770" y="478" font-size="19" fill="#172b4d" font-weight="400" text-anchor="middle">看是否再次读取“最新”</text>
<line x1="265" y1="499" x2="265" y2="554" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="286" y="533" font-size="18" fill="#087f78" font-weight="700" text-anchor="middle">是</text>
<rect x="30" y="562" width="470" height="82" rx="14" fill="#fff" stroke="#bed0eb" stroke-width="1.5"/>
<text x="265" y="610" font-size="22" fill="#172b4d" font-weight="700" text-anchor="middle">④ 源数据与独立基准一致？</text>
<line x1="508" y1="603" x2="593" y2="603" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="548" y="591" font-size="18" fill="#a65f09" font-weight="700" text-anchor="middle">否</text>
<rect x="610" y="561" width="320" height="84" rx="14" fill="#fff4df" stroke="#edd299" stroke-width="1.5"/>
<text x="770" y="594" font-size="23" fill="#a65f09" font-weight="700" text-anchor="middle">数据同步层</text>
<text x="770" y="623" font-size="19" fill="#172b4d" font-weight="400" text-anchor="middle">看重复导入、遗漏与批次</text>
<line x1="265" y1="644" x2="265" y2="700" stroke="#91a4be" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="286" y="677" font-size="18" fill="#087f78" font-weight="700" text-anchor="middle">是</text>
<rect x="30" y="710" width="900" height="91" rx="14" fill="#e7f5f2" stroke="#91cfc4" stroke-width="1.5"/>
<text x="480" y="747" font-size="22" fill="#087f78" font-weight="700" text-anchor="middle">继续查计算层：连接行数 → 事实粒度 → 分摊 → 舍入</text>
<text x="480" y="781" font-size="20" fill="#172b4d" font-weight="400" text-anchor="middle">同一份输入逐段跑，对照每个项目和每个目标的金额</text>
<text x="480" y="845" font-size="20" fill="#52647e" font-weight="400" text-anchor="middle">先保存现场再修改，避免“重新问一次碰巧对了”</text>
</g></svg>