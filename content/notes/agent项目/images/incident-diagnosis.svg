<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">从一个错误现象，找到可验证的约束</title><desc id="desc">先复现输入与错误结果，再修改边界，最后检查业务输出。70 万变成 140 万，预算与费用明细直接连接，修复：两边先聚合到共同粒度，验证：预算 70 万、实际 77 万；一段回答混入两种口径，计划变了，旧结果仍在当前集合，修复：新计划清空当前引用，验证：历史保留，当前不串数；响应丢失后重复导出，提交成功，图没有收到返回，修复：稳定意图 + 数据库唯一约束，验证：新 JVM 恢复后任务仍为 1；旧 Worker 覆盖新结果，旧计算晚到，仍尝试发布，修复：状态与执行代次一起比较，验证：旧 token 更新零行</desc><rect width="1120" height="610" rx="24" fill="#f4f6f7"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="57" font-size="30" font-weight="700" fill="#173a43">从一个错误现象，找到可验证的约束</text><text x="40" y="94" font-size="18" fill="#536b72">先复现输入与错误结果，再修改边界，最后检查业务输出</text><rect x="40" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="148" width="5" height="34" rx="2" fill="#007f86"/><text x="62" y="169" font-size="21" font-weight="700" fill="#007f86">70 万变成 140 万</text><text x="62" y="206" font-size="18" fill="#304c55">预算与费用明细直接连接</text><text x="62" y="236" font-size="18" fill="#304c55">修复：两边先聚合到共同粒度</text><text x="62" y="266" font-size="18" fill="#304c55">验证：预算 70 万、实际 77 万</text><rect x="571" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="148" width="5" height="34" rx="2" fill="#3868a5"/><text x="593" y="169" font-size="21" font-weight="700" fill="#3868a5">一段回答混入两种口径</text><text x="593" y="206" font-size="18" fill="#304c55">计划变了，旧结果仍在当前集合</text><text x="593" y="236" font-size="18" fill="#304c55">修复：新计划清空当前引用</text><text x="593" y="266" font-size="18" fill="#304c55">验证：历史保留，当前不串数</text><rect x="40" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="344" width="5" height="34" rx="2" fill="#6c58a5"/><text x="62" y="365" font-size="21" font-weight="700" fill="#6c58a5">响应丢失后重复导出</text><text x="62" y="402" font-size="18" fill="#304c55">提交成功，图没有收到返回</text><text x="62" y="432" font-size="18" fill="#304c55">修复：稳定意图 + 数据库唯一约束</text><text x="62" y="462" font-size="18" fill="#304c55">验证：新 JVM 恢复后任务仍为 1</text><rect x="571" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="344" width="5" height="34" rx="2" fill="#a46537"/><text x="593" y="365" font-size="21" font-weight="700" fill="#a46537">旧 Worker 覆盖新结果</text><text x="593" y="402" font-size="18" fill="#304c55">旧计算晚到，仍尝试发布</text><text x="593" y="432" font-size="18" fill="#304c55">修复：状态与执行代次一起比较</text><text x="593" y="462" font-size="18" fill="#304c55">验证：旧 token 更新零行</text><text x="40" y="582" font-size="17" fill="#60767e">本站原创排查图；已有 32 项 Java 检查，完整生产链路仍待验证。</text></g></svg>
