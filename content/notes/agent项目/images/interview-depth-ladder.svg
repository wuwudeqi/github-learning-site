<svg xmlns="http://www.w3.org/2000/svg" width="900" height="710" viewBox="0 0 900 710" role="img" aria-labelledby="title desc">
<title id="title">一道面试题怎样答出三层深度</title><desc id="desc">以导出响应丢失为例，先说用户遇到的问题，再说操作ID和唯一约束，最后给出故障注入证据和保证范围。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#78909c"/></marker></defs>
<rect width="900" height="710" rx="18" fill="#f4f7fa"/>
<g font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="30" y="46" font-size="28" fill="#24394a" font-weight="700">同一道题，往下回答到哪里？</text>
<text x="30" y="82" font-size="20" fill="#617789" font-weight="400">例：导出已经提交，但 Agent 没收到返回</text>
<rect x="30" y="116" width="840" height="138" rx="12" fill="#eaf2fc" stroke="#eaf2fc"/>
<text x="53" y="154" font-size="23" fill="#24394a" font-weight="700">第一层 · 说清问题</text>
<text x="53" y="194" font-size="21" fill="#24394a" font-weight="400">Java 已创建任务，Agent 超时后又调用一次。</text>
<text x="53" y="228" font-size="20" fill="#24394a" font-weight="400">如果当成新请求，就会重复生成文件。</text>
<path d="M450 254 L450 288" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="293" width="840" height="138" rx="12" fill="#e6f3eb" stroke="#e6f3eb"/>
<text x="53" y="331" font-size="23" fill="#24394a" font-weight="700">第二层 · 解释机制</text>
<text x="53" y="371" font-size="21" fill="#24394a" font-weight="400">先保存 operation_id，重试仍用同一个 ID。</text>
<text x="53" y="405" font-size="20" fill="#24394a" font-weight="400">Java 用唯一约束创建任务，并比较参数摘要。</text>
<path d="M450 431 L450 465" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="470" width="840" height="138" rx="12" fill="#f2ecf9" stroke="#f2ecf9"/>
<text x="53" y="508" font-size="23" fill="#24394a" font-weight="700">第三层 · 拿出证据和范围</text>
<text x="53" y="548" font-size="21" fill="#24394a" font-weight="400">在提交后丢弃响应，检查任务 ID 和记录数。</text>
<text x="53" y="582" font-size="20" fill="#24394a" font-weight="400">保证一个逻辑任务；不声称文件计算永远只跑一次。</text>
<text x="30" y="663" font-size="20" fill="#596f81" font-weight="400">面试前自查：你能指出“哪个 ID 不变”和“哪条数据库约束起作用”吗？</text>
</g></svg>