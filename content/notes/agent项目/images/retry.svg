<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-label="导出恢复｜响应丢失后复用同一操作">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#63748b"/></marker></defs>
<rect width="1100" height="540" fill="#f4f7fb"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif">
<text x="45" y="48" font-size="28" font-weight="700" fill="#152b43">导出恢复｜响应丢失后复用同一操作</text>
<text x="45" y="80" font-size="16" fill="#506580">检查点保存执行上下文；Java 唯一约束保证一个逻辑任务</text>
<path d="M335 175 L403 175" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M695 175 L763 175" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M910 240 L910 328" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M765 390 L697 390" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M405 390 L337 390" stroke="#63748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="120" width="290" height="120" rx="12" fill="white" stroke="#bfd0e0"/>
<rect x="45" y="120" width="5" height="120" rx="2" fill="#187d8b"/>
<text x="65" y="151" font-size="20" font-weight="600" fill="#152b43">1. 提交前持久化</text>
<text x="65" y="179" font-size="16" fill="#506580">operation_id = op-001</text>
<text x="65" y="203" font-size="16" fill="#506580">冻结计划、版本和导出格式</text>
<rect x="405" y="120" width="290" height="120" rx="12" fill="white" stroke="#bfd0e0"/>
<rect x="405" y="120" width="5" height="120" rx="2" fill="#187d8b"/>
<text x="425" y="151" font-size="20" font-weight="600" fill="#152b43">2. Java 提交任务</text>
<text x="425" y="179" font-size="16" fill="#506580">task_id = task-001</text>
<text x="425" y="203" font-size="16" fill="#506580">唯一键绑定用户与操作 ID</text>
<rect x="765" y="120" width="290" height="120" rx="12" fill="white" stroke="#bfd0e0"/>
<rect x="765" y="120" width="5" height="120" rx="2" fill="#187d8b"/>
<text x="785" y="151" font-size="20" font-weight="600" fill="#152b43">3. 响应丢失 / 进程中断</text>
<text x="785" y="179" font-size="16" fill="#506580">后端已经提交成功</text>
<text x="785" y="203" font-size="16" fill="#506580">调用方不知道执行结果</text>
<rect x="765" y="330" width="290" height="120" rx="12" fill="white" stroke="#bfd0e0"/>
<rect x="765" y="330" width="5" height="120" rx="2" fill="#187d8b"/>
<text x="785" y="361" font-size="20" font-weight="600" fill="#152b43">4. 恢复与重试</text>
<text x="785" y="389" font-size="16" fill="#506580">仍使用 op-001</text>
<text x="785" y="413" font-size="16" fill="#506580">禁止重新生成操作 ID</text>
<rect x="405" y="330" width="290" height="120" rx="12" fill="white" stroke="#bfd0e0"/>
<rect x="405" y="330" width="5" height="120" rx="2" fill="#187d8b"/>
<text x="425" y="361" font-size="20" font-weight="600" fill="#152b43">5. 返回已有任务</text>
<text x="425" y="389" font-size="16" fill="#506580">校验冻结参数保持一致</text>
<text x="425" y="413" font-size="16" fill="#506580">仍返回 task-001</text>
<rect x="45" y="330" width="290" height="120" rx="12" fill="white" stroke="#bfd0e0"/>
<rect x="45" y="330" width="5" height="120" rx="2" fill="#187d8b"/>
<text x="65" y="361" font-size="20" font-weight="600" fill="#152b43">6. 查询结果与下载</text>
<text x="65" y="389" font-size="16" fill="#506580">Worker 租约与发布校验</text>
<text x="65" y="413" font-size="16" fill="#506580">下载时再次检查权限</text>
</g></svg>