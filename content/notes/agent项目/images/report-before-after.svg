<svg xmlns="http://www.w3.org/2000/svg" width="940" height="820" viewBox="0 0 940 820" role="img" aria-labelledby="title desc">
<title id="title">一次汇报，员工要做的事情发生了什么变化</title><desc id="desc">左侧现有流程需要找入口、选择条件、导出加工；右侧目标方案由员工提出需求和核对口径，由Agent调用已有查询和制图能力。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#78909c"/></marker></defs>
<rect width="940" height="820" rx="18" fill="#f4f7fa"/>
<g font-family="PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="32" y="49" font-size="28" fill="#24394a" font-weight="700">一次汇报：把十几个项目整理成图表</text>
<text x="32" y="84" font-size="18" fill="#617789" font-weight="400">业务流程示意 · 右侧为拟实现方案</text>
<rect x="30" y="112" width="420" height="52" rx="12" fill="#eaf0f6" stroke="#eaf0f6"/>
<text x="52" y="147" font-size="23" fill="#24394a" font-weight="700">现在：员工自己组织操作</text>
<rect x="490" y="112" width="420" height="52" rx="12" fill="#e6f3eb" stroke="#e6f3eb"/>
<text x="512" y="147" font-size="23" fill="#24394a" font-weight="700">接入后：按任务调用能力</text>
<rect x="30" y="187" width="420" height="97" rx="12" fill="#ffffff" stroke="#dbe3e9"/>
<text x="52" y="224" font-size="23" fill="#24394a" font-weight="700">找页面和入口</text>
<text x="52" y="257" font-size="20" fill="#596f81" font-weight="400">先学会系统怎么用</text>
<path d="M240 284 L240 306" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="311" width="420" height="97" rx="12" fill="#ffffff" stroke="#dbe3e9"/>
<text x="52" y="348" font-size="23" fill="#24394a" font-weight="700">选择项目、期间、口径</text>
<text x="52" y="381" font-size="20" fill="#596f81" font-weight="400">确认按哪个维度分摊</text>
<path d="M240 408 L240 430" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="435" width="420" height="97" rx="12" fill="#ffffff" stroke="#dbe3e9"/>
<text x="52" y="472" font-size="23" fill="#24394a" font-weight="700">导出后再加工</text>
<text x="52" y="505" font-size="20" fill="#596f81" font-weight="400">Excel 拼表、调整图表</text>
<path d="M240 532 L240 554" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="30" y="559" width="420" height="97" rx="12" fill="#ffffff" stroke="#dbe3e9"/>
<text x="52" y="596" font-size="23" fill="#24394a" font-weight="700">不支持的卡片提需求</text>
<text x="52" y="629" font-size="20" fill="#596f81" font-weight="400">开发定制，再培训使用</text>
<rect x="490" y="187" width="420" height="97" rx="12" fill="#ffffff" stroke="#dbe3e9"/>
<text x="512" y="224" font-size="23" fill="#24394a" font-weight="700">说出这次汇报需求</text>
<text x="512" y="257" font-size="20" fill="#596f81" font-weight="400">例如：上半年按部门看</text>
<path d="M700 284 L700 306" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="490" y="311" width="420" height="97" rx="12" fill="#ffffff" stroke="#dbe3e9"/>
<text x="512" y="348" font-size="23" fill="#24394a" font-weight="700">只补问关键歧义</text>
<text x="512" y="381" font-size="20" fill="#596f81" font-weight="400">员工确认预算与分摊口径</text>
<path d="M700 408 L700 430" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="490" y="435" width="420" height="97" rx="12" fill="#ffffff" stroke="#dbe3e9"/>
<text x="512" y="472" font-size="23" fill="#24394a" font-weight="700">助手查询、下钻、制图</text>
<text x="512" y="505" font-size="20" fill="#596f81" font-weight="400">复用原系统的计算和权限</text>
<path d="M700 532 L700 554" stroke="#78909c" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="490" y="559" width="420" height="97" rx="12" fill="#ffffff" stroke="#dbe3e9"/>
<text x="512" y="596" font-size="23" fill="#24394a" font-weight="700">员工核对并采用材料</text>
<text x="512" y="629" font-size="20" fill="#596f81" font-weight="400">图表、Excel 和查询数据</text>
<rect x="30" y="700" width="880" height="85" rx="12" fill="#fff5e6" stroke="#ead6b3"/>
<text x="52" y="734" font-size="23" fill="#24394a" font-weight="700">保持不变：正式规则、数据权限和业务判断</text>
<text x="52" y="766" font-size="21" fill="#24394a" font-weight="400">减少的工作：记入口、切报表、拼表、反复制图</text>
</g></svg>