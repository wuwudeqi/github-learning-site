<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img"><title>工具执行是一条受控路径</title><desc>公共执行策略与具体工具能力各自承担职责</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#54746e" stroke-width="1.5"/></marker></defs><rect width="1000" height="740" rx="22" fill="#f5f4ee"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="42" font-size="14" letter-spacing="3" fill="#43766a">CODEX HARNESS / STUDY NOTES</text><text x="42" y="88" font-size="32" font-weight="700" fill="#173d36">工具执行是一条受控路径</text><text x="42" y="122" font-size="18" fill="#65746e">公共执行策略与具体工具能力各自承担职责</text><rect x="42" y="165" width="280" height="135" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="64" y="202" font-size="23" font-weight="650" fill="#173d36">1 / 解析与校验</text><text x="64" y="235" font-size="19" fill="#526b63">工具名称和参数</text><text x="64" y="264" font-size="19" fill="#526b63">领域约束与资源范围</text><rect x="360" y="165" width="280" height="135" rx="14" fill="#173d36" stroke="#cad8d0"/><text x="382" y="202" font-size="23" font-weight="650" fill="#ffffff">2 / 授权与审批</text><text x="382" y="235" font-size="19" fill="#d9e8df">按动作与策略判断</text><text x="382" y="264" font-size="19" fill="#d9e8df">缓存必须有正确作用域</text><rect x="678" y="165" width="280" height="135" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="700" y="202" font-size="23" font-weight="650" fill="#173d36">3 / 沙箱与执行</text><text x="700" y="235" font-size="19" fill="#526b63">落实实际资源限制</text><text x="700" y="264" font-size="19" fill="#526b63">超时、取消和输出约束</text><polyline points="322,232 358,232" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="640,232 676,232" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="370" width="280" height="150" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="64" y="407" font-size="23" font-weight="650" fill="#173d36">参数无效 / 拒绝</text><text x="64" y="440" font-size="19" fill="#526b63">修正参数或停止</text><text x="64" y="469" font-size="19" fill="#526b63">不能通过重试扩大权限</text><rect x="360" y="370" width="280" height="150" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="382" y="407" font-size="23" font-weight="650" fill="#173d36">暂时故障</text><text x="382" y="440" font-size="19" fill="#526b63">按策略限次退避</text><text x="382" y="469" font-size="19" fill="#526b63">副作用不明时先核对</text><rect x="678" y="370" width="280" height="150" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="700" y="407" font-size="23" font-weight="650" fill="#173d36">成功结果</text><text x="700" y="440" font-size="19" fill="#526b63">关联调用 ID</text><text x="700" y="469" font-size="19" fill="#526b63">返回结构化观察</text><polyline points="818,300 818,342 182,342 182,368" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="500,342 500,368" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="818,342 818,368" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="560" width="916" height="54" rx="12" fill="#e7eee5"/><text x="62" y="594" font-size="19" fill="#355b4f">工具支持并行只是资格；具体调用还要检查依赖、冲突与资源限制。</text><rect x="42" y="627" width="916" height="54" rx="12" fill="#e7eee5"/><text x="62" y="661" font-size="19" fill="#355b4f">读取数据中的指令不自动成为授权；业务权限由可信服务端判断。</text><text x="42" y="717" font-size="14" fill="#728079">教学图解 · 具体实现与保证范围见正文 · 2026-09-08</text></g></svg>