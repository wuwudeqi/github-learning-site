<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img"><title>压缩工作窗口，维护有效上下文</title><desc>区分原始材料、模型输入与程序持有的状态</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#54746e" stroke-width="1.5"/></marker></defs><rect width="1000" height="730" rx="22" fill="#f5f4ee"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="42" font-size="14" letter-spacing="3" fill="#43766a">CODEX HARNESS / STUDY NOTES</text><text x="42" y="88" font-size="32" font-weight="700" fill="#173d36">压缩工作窗口，维护有效上下文</text><text x="42" y="122" font-size="18" fill="#65746e">区分原始材料、模型输入与程序持有的状态</text><rect x="42" y="165" width="420" height="145" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="64" y="202" font-size="23" font-weight="650" fill="#173d36">原始材料与工作记录</text><text x="64" y="235" font-size="19" fill="#526b63">仓库文件、日志、工具结果</text><text x="64" y="264" font-size="19" fill="#526b63">保留定位信息与可追溯引用</text><rect x="538" y="165" width="420" height="145" rx="14" fill="#173d36" stroke="#cad8d0"/><text x="560" y="202" font-size="23" font-weight="650" fill="#ffffff">当前模型工作窗口</text><text x="560" y="235" font-size="19" fill="#d9e8df">按需选择材料与历史</text><text x="560" y="264" font-size="19" fill="#d9e8df">受输入预算和模型能力约束</text><polyline points="462,233 536,233" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="365" width="420" height="160" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="64" y="402" font-size="23" font-weight="650" fill="#173d36">宿主程序持有的状态</text><text x="64" y="435" font-size="19" fill="#526b63">实际权限、版本、操作记录</text><text x="64" y="464" font-size="19" fill="#526b63">不能仅依赖模型生成的摘要</text><text x="64" y="493" font-size="19" fill="#526b63">图中为通用教学职责划分</text><rect x="538" y="365" width="420" height="160" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="560" y="402" font-size="23" font-weight="650" fill="#173d36">压缩与重新组装</text><text x="560" y="435" font-size="19" fill="#526b63">总结历史，处理上下文基线</text><text x="560" y="464" font-size="19" fill="#526b63">保留调用 / 输出结构</text><text x="560" y="493" font-size="19" fill="#526b63">必要时重新注入初始上下文</text><polyline points="748,310 748,363" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="462,445 536,445" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="565" width="916" height="54" rx="12" fill="#e7eee5"/><text x="62" y="599" font-size="19" fill="#355b4f">体积优化：检索、截断、压缩。内存优化：共享快照与写时复制。</text><rect x="42" y="632" width="916" height="54" rx="12" fill="#e7eee5"/><text x="62" y="666" font-size="19" fill="#355b4f">检查质量：关键证据是否保留？约束是否遗漏？引用是否仍有效？</text><text x="42" y="707" font-size="14" fill="#728079">教学图解 · 具体实现与保证范围见正文 · 2026-09-08</text></g></svg>