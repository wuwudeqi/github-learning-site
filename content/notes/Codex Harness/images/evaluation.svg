<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img"><title>优化必须经过质量与代价的检验</title><desc>先验证程序不变量，再做固定条件下的模型实验</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#54746e" stroke-width="1.5"/></marker></defs><rect width="1000" height="680" rx="22" fill="#f5f4ee"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="42" font-size="14" letter-spacing="3" fill="#43766a">CODEX HARNESS / STUDY NOTES</text><text x="42" y="88" font-size="32" font-weight="700" fill="#173d36">优化必须经过质量与代价的检验</text><text x="42" y="122" font-size="18" fill="#65746e">先验证程序不变量，再做固定条件下的模型实验</text><rect x="42" y="165" width="440" height="145" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="64" y="202" font-size="23" font-weight="650" fill="#173d36">1 / 固定基线</text><text x="64" y="235" font-size="19" fill="#526b63">任务集、模型、工具与工作区</text><text x="64" y="264" font-size="19" fill="#526b63">提前定义成功、拒绝和中止标准</text><rect x="518" y="165" width="440" height="145" rx="14" fill="#173d36" stroke="#cad8d0"/><text x="540" y="202" font-size="23" font-weight="650" fill="#ffffff">2 / 改变一个变量</text><text x="540" y="235" font-size="19" fill="#d9e8df">上下文策略或并发上限</text><text x="540" y="264" font-size="19" fill="#d9e8df">不要同时更换全部配置</text><polyline points="482,235 516,235" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="518" y="360" width="440" height="145" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="540" y="397" font-size="23" font-weight="650" fill="#173d36">3 / 收集完整结果</text><text x="540" y="430" font-size="19" fill="#526b63">成功率、费用、耗时与故障</text><text x="540" y="459" font-size="19" fill="#526b63">包括失败样例和人工干预</text><polyline points="738,310 738,358" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="360" width="440" height="145" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="64" y="397" font-size="23" font-weight="650" fill="#173d36">4 / 解释因果与限制</text><text x="64" y="430" font-size="19" fill="#526b63">收益来自哪里，付出什么代价</text><text x="64" y="459" font-size="19" fill="#526b63">哪些任务与配置尚未验证</text><polyline points="518,433 484,433" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="242,360 242,312" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="560" width="916" height="54" rx="12" fill="#e7eee5"/><text x="62" y="594" font-size="19" fill="#355b4f">真实模型对照实验尚未执行；本专题不提供虚构性能提升比例。</text><text x="42" y="657" font-size="14" fill="#728079">教学图解 · 具体实现与保证范围见正文 · 2026-09-08</text></g></svg>