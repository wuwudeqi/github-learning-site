<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img"><title>历史不是直接发给模型的原始日志</title><desc>记录路径与请求视图在这里分开，再由各自规则处理</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#517669" stroke-width="1.5"/></marker></defs><rect width="1000" height="1050" rx="20" fill="#f5f4ee"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="40" font-size="14" fill="#527667">CODEX HARNESS / MECHANISM STUDY</text><text x="40" y="88" font-size="32" fill="#173d36">历史不是直接发给模型的原始日志</text><text x="40" y="125" font-size="18" fill="#60716b">记录路径与请求视图在这里分开，再由各自规则处理</text><rect x="265" y="160" width="470" height="105" rx="13" fill="#fff" stroke="#bccfc3"/><text x="285" y="195" font-size="23" fill="#173d36">准备后的工具结果</text><text x="285" y="228" font-size="19" fill="#173d36">工具层可能已经处理或裁剪过</text><polyline points="390,265 250,320" fill="none" stroke="#517669" stroke-width="2.4" marker-end="url(#a)"/><polyline points="610,265 750,320" fill="none" stroke="#517669" stroke-width="2.4" marker-end="url(#a)"/><rect x="40" y="325" width="440" height="145" rx="13" fill="#fff" stroke="#bccfc3"/><text x="60" y="360" font-size="23" fill="#173d36">内存历史 / ContextManager</text><text x="60" y="393" font-size="19" fill="#173d36">复制为 processed envelope</text><text x="60" y="422" font-size="19" fill="#173d36">对适用 payload 裁剪并记录</text><rect x="520" y="325" width="440" height="145" rx="13" fill="#fff" stroke="#bccfc3"/><text x="540" y="360" font-size="23" fill="#173d36">rollout 记录路径</text><text x="540" y="393" font-size="19" fill="#173d36">准备后的 items 交给记录组件</text><text x="540" y="422" font-size="19" fill="#173d36">不据此保证保存了原始 stdout</text><polyline points="260,470 260,525" fill="none" stroke="#517669" stroke-width="2.4" marker-end="url(#a)"/><rect x="40" y="530" width="440" height="150" rx="13" fill="#fff" stroke="#bccfc3"/><text x="60" y="565" font-size="23" fill="#173d36">clone_history → 快照</text><text x="60" y="598" font-size="19" fill="#173d36">先共享 Arc 向量</text><text x="60" y="627" font-size="19" fill="#173d36">模型输入修复不直接改原历史</text><rect x="520" y="530" width="440" height="150" rx="13" fill="#fff" stroke="#bccfc3"/><text x="540" y="565" font-size="23" fill="#173d36">写时复制的触发点</text><text x="540" y="598" font-size="19" fill="#173d36">for_prompt 调用规范化</text><text x="540" y="627" font-size="19" fill="#173d36">共享时 make_mut 可能复制</text><polyline points="480,605 518,605" fill="none" stroke="#517669" stroke-width="2.4" marker-end="url(#a)"/><polyline points="740,680 740,735" fill="none" stroke="#517669" stroke-width="2.4" marker-end="url(#a)"/><rect x="40" y="740" width="920" height="160" rx="13" fill="#fff" stroke="#bccfc3"/><text x="60" y="775" font-size="23" fill="#173d36">for_prompt / 当前请求视图</text><text x="60" y="808" font-size="19" fill="#173d36">补缺失输出、清理不适用项、适配模型输入能力</text><text x="60" y="837" font-size="19" fill="#173d36">合成输出由源 item 身份稳定派生，避免无意义 ID 变化</text><text x="60" y="866" font-size="19" fill="#173d36">形成模型可见 ResponseItem；不是所有持久化记录的直接转发</text><rect x="40" y="930" width="920" height="55" rx="10" fill="#e1eadf"/><text x="58" y="965" font-size="19" fill="#173d36">结构合法、证据完整、持久化可靠分别需要验证，不能互相推导。</text><text x="40" y="1028" font-size="14" fill="#60716b">固定版本路径的教学图解 · 具体控制分支与限制见正文</text></g></svg>