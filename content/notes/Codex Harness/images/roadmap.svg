<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img"><title>从理解机制，到可验证的工程判断</title><desc>以一个真实任务为线索，逐层建立模型与系统之间的联系</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#54746e" stroke-width="1.5"/></marker></defs><rect width="1000" height="680" rx="22" fill="#f5f4ee"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="42" font-size="14" letter-spacing="3" fill="#43766a">CODEX HARNESS / STUDY NOTES</text><text x="42" y="88" font-size="32" font-weight="700" fill="#173d36">从理解机制，到可验证的工程判断</text><text x="42" y="122" font-size="18" fill="#65746e">以一个真实任务为线索，逐层建立模型与系统之间的联系</text><rect x="42" y="165" width="280" height="160" rx="14" fill="#173d36" stroke="#cad8d0"/><text x="64" y="202" font-size="23" font-weight="650" fill="#ffffff">01 / 理解</text><text x="64" y="235" font-size="19" fill="#d9e8df">概念与执行循环</text><text x="64" y="264" font-size="19" fill="#d9e8df">上下文、工具、权限</text><text x="64" y="293" font-size="19" fill="#d9e8df">画出完整反馈链路</text><rect x="360" y="165" width="280" height="160" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="382" y="202" font-size="23" font-weight="650" fill="#173d36">02 / 验证</text><text x="382" y="235" font-size="19" fill="#526b63">固定源码版本</text><text x="382" y="264" font-size="19" fill="#526b63">追踪状态与失败分支</text><text x="382" y="293" font-size="19" fill="#526b63">实验检验关键不变量</text><rect x="678" y="165" width="280" height="160" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="700" y="202" font-size="23" font-weight="650" fill="#173d36">03 / 表达</text><text x="700" y="235" font-size="19" fill="#526b63">解释优化与代价</text><text x="700" y="264" font-size="19" fill="#526b63">迁移到自己的项目</text><text x="700" y="293" font-size="19" fill="#526b63">用证据回答连续追问</text><polyline points="322,245 358,245" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="640,245 676,245" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="375" width="440" height="155" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="64" y="412" font-size="23" font-weight="650" fill="#173d36">资料中的三种证据</text><text x="64" y="445" font-size="19" fill="#526b63">官方事实：文档确认的能力</text><text x="64" y="474" font-size="19" fill="#526b63">源码观察：固定提交的实际路径</text><text x="64" y="503" font-size="19" fill="#526b63">教学设计：示意、实验、迁移建议</text><rect x="518" y="375" width="440" height="155" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="540" y="412" font-size="23" font-weight="650" fill="#173d36">每章的掌握标准</text><text x="540" y="445" font-size="19" fill="#526b63">说清输入、状态与决策者</text><text x="540" y="474" font-size="19" fill="#526b63">推演失败、取消和恢复</text><text x="540" y="503" font-size="19" fill="#526b63">说明证据及未验证的边界</text><rect x="42" y="565" width="916" height="54" rx="12" fill="#e7eee5"/><text x="62" y="599" font-size="19" fill="#355b4f">阅读 → 闭卷解释 → 预测行为 → 实验验证 → 记录限制</text><text x="42" y="657" font-size="14" fill="#728079">教学图解 · 具体实现与保证范围见正文 · 2026-09-08</text></g></svg>