<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img"><title>一次请求，经过多次观察与行动</title><desc>一个 Turn 可以包含多次模型请求和工具执行</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#54746e" stroke-width="1.5"/></marker></defs><rect width="1000" height="740" rx="22" fill="#f5f4ee"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="42" font-size="14" letter-spacing="3" fill="#43766a">CODEX HARNESS / STUDY NOTES</text><text x="42" y="88" font-size="32" font-weight="700" fill="#173d36">一次请求，经过多次观察与行动</text><text x="42" y="122" font-size="18" fill="#65746e">一个 Turn 可以包含多次模型请求和工具执行</text><rect x="42" y="165" width="400" height="115" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="64" y="202" font-size="23" font-weight="650" fill="#173d36">1 / 组装当前上下文</text><text x="64" y="235" font-size="19" fill="#526b63">目标、约束、历史与工具结果</text><rect x="558" y="165" width="400" height="115" rx="14" fill="#173d36" stroke="#cad8d0"/><text x="580" y="202" font-size="23" font-weight="650" fill="#ffffff">2 / 请求模型</text><text x="580" y="235" font-size="19" fill="#d9e8df">接收文本或结构化工具调用</text><polyline points="442,223 556,223" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="558" y="350" width="400" height="115" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="580" y="387" font-size="23" font-weight="650" fill="#173d36">3 / 校验并执行工具</text><text x="580" y="420" font-size="19" fill="#526b63">授权、预算、执行环境与取消</text><polyline points="758,280 758,348" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="775" y="321" font-size="17" fill="#54746e">需要工具</text><rect x="42" y="350" width="400" height="115" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="64" y="387" font-size="23" font-weight="650" fill="#173d36">4 / 记录结果与观察</text><text x="64" y="420" font-size="19" fill="#526b63">对应调用 ID，保留状态和证据</text><polyline points="558,408 444,408" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="242,350 242,282" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="258" y="321" font-size="17" fill="#54746e">继续反馈</text><rect x="558" y="545" width="400" height="105" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="580" y="582" font-size="23" font-weight="650" fill="#173d36">终态 / 完成或中止</text><text x="580" y="615" font-size="19" fill="#526b63">结束轮次，并报告结果与限制</text><polyline points="958,223 979,223 979,595 960,595" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="545" width="400" height="105" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="64" y="582" font-size="23" font-weight="650" fill="#173d36">循环边界检查</text><text x="64" y="615" font-size="19" fill="#526b63">取消、预算、错误、追加输入</text><rect x="42" y="675" width="916" height="54" rx="12" fill="#e7eee5"/><text x="62" y="709" font-size="19" fill="#355b4f">协议结束 ≠ 工具成功 ≠ 用户目标通过验收。</text><text x="42" y="717" font-size="14" fill="#728079">教学图解 · 具体实现与保证范围见正文 · 2026-09-08</text></g></svg>