<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img"><title>取消到达时，先看执行已经走到哪里</title><desc>终态形成、收尾完成、外部副作用不是同一个时刻</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#517669" stroke-width="1.5"/></marker></defs><rect width="1000" height="950" rx="20" fill="#f5f4ee"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="40" font-size="14" fill="#527667">CODEX HARNESS / MECHANISM STUDY</text><text x="40" y="88" font-size="32" fill="#173d36">取消到达时，先看执行已经走到哪里</text><text x="40" y="125" font-size="18" fill="#60716b">终态形成、收尾完成、外部副作用不是同一个时刻</text><rect x="280" y="160" width="440" height="100" rx="13" fill="#fff" stroke="#bccfc3"/><text x="300" y="195" font-size="23" fill="#173d36">取消信号到达</text><text x="300" y="228" font-size="19" fill="#173d36">与任务完成可能同时发生</text><polyline points="400,260 260,325" fill="none" stroke="#517669" stroke-width="2.4" marker-end="url(#a)"/><polyline points="600,260 740,325" fill="none" stroke="#517669" stroke-width="2.4" marker-end="url(#a)"/><rect x="40" y="330" width="440" height="165" rx="13" fill="#fff" stroke="#bccfc3"/><text x="60" y="365" font-size="23" fill="#173d36">尚无 terminal outcome</text><text x="60" y="398" font-size="19" fill="#173d36">取消 dispatch task 并等待收尾</text><text x="60" y="427" font-size="19" fill="#173d36">生成中断观察与生命周期通知</text><text x="60" y="456" font-size="19" fill="#173d36">仍需处理完成竞态</text><rect x="520" y="330" width="440" height="165" rx="13" fill="#fff" stroke="#bccfc3"/><text x="540" y="365" font-size="23" fill="#173d36">终态已到达 / task 已结束</text><text x="540" y="398" font-size="19" fill="#173d36">等待已有结果与收尾</text><text x="540" y="427" font-size="19" fill="#173d36">保留已完成结果</text><text x="540" y="456" font-size="19" fill="#173d36">避免用 aborted 覆盖完成事实</text><polyline points="260,495 260,555" fill="none" stroke="#517669" stroke-width="2.4" marker-end="url(#a)"/><polyline points="740,495 740,555" fill="none" stroke="#517669" stroke-width="2.4" marker-end="url(#a)"/><rect x="40" y="560" width="440" height="135" rx="13" fill="#fff" stroke="#bccfc3"/><text x="60" y="595" font-size="23" fill="#173d36">本地任务状态</text><text x="60" y="628" font-size="19" fill="#173d36">中断结果不代表远端未提交</text><text x="60" y="657" font-size="19" fill="#173d36">执行器清理需要独立验证</text><rect x="520" y="560" width="440" height="135" rx="13" fill="#fff" stroke="#bccfc3"/><text x="540" y="595" font-size="23" fill="#173d36">已完成操作</text><text x="540" y="628" font-size="19" fill="#173d36">取消不能倒转时间</text><text x="540" y="657" font-size="19" fill="#173d36">撤销需要另外的补偿动作</text><rect x="40" y="745" width="920" height="55" rx="10" fill="#e1eadf"/><text x="58" y="780" font-size="19" fill="#173d36">可重复实验：先形成 terminal，暂停收尾，再发送取消，最后释放屏障。</text><rect x="40" y="820" width="920" height="55" rx="10" fill="#e1eadf"/><text x="58" y="855" font-size="19" fill="#173d36">不要靠随机 sleep 碰竞态；用事件屏障明确控制窗口。</text><text x="40" y="928" font-size="14" fill="#60716b">固定版本路径的教学图解 · 具体控制分支与限制见正文</text></g></svg>