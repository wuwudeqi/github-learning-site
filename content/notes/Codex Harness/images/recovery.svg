<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img"><title>超时之后，操作可能已经成功</title><desc>教学场景：同一逻辑导出在响应丢失后恢复</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#54746e" stroke-width="1.5"/></marker></defs><rect width="1000" height="730" rx="22" fill="#f5f4ee"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="42" y="42" font-size="14" letter-spacing="3" fill="#43766a">CODEX HARNESS / STUDY NOTES</text><text x="42" y="88" font-size="32" font-weight="700" fill="#173d36">超时之后，操作可能已经成功</text><text x="42" y="122" font-size="18" fill="#65746e">教学场景：同一逻辑导出在响应丢失后恢复</text><rect x="42" y="165" width="280" height="135" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="64" y="202" font-size="23" font-weight="650" fill="#173d36">发起操作</text><text x="64" y="235" font-size="19" fill="#526b63">operation_id = op-1</text><text x="64" y="264" font-size="19" fill="#526b63">绑定参数与数据版本</text><rect x="360" y="165" width="280" height="135" rx="14" fill="#173d36" stroke="#cad8d0"/><text x="382" y="202" font-size="23" font-weight="650" fill="#ffffff">提交业务结果</text><text x="382" y="235" font-size="19" fill="#d9e8df">产物与操作记录提交</text><text x="382" y="264" font-size="19" fill="#d9e8df">同库事务的教学边界</text><rect x="678" y="165" width="280" height="135" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="700" y="202" font-size="23" font-weight="650" fill="#173d36">响应尚未到达</text><text x="700" y="235" font-size="19" fill="#526b63">连接中断 / 超时</text><text x="700" y="264" font-size="19" fill="#526b63">调用方观察到结果未知</text><polyline points="322,232 358,232" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="640,232 676,232" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="538" y="380" width="420" height="150" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="560" y="417" font-size="23" font-weight="650" fill="#173d36">恢复：先查询同一操作</text><text x="560" y="450" font-size="19" fill="#526b63">结果存在 → 复用结果</text><text x="560" y="479" font-size="19" fill="#526b63">结果未知 → 核对或受控重试</text><text x="560" y="508" font-size="19" fill="#526b63">同 ID 参数变化 → 拒绝冲突</text><polyline points="818,300 818,378" fill="none" stroke="#54746e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="380" width="420" height="150" rx="14" fill="#ffffff" stroke="#cad8d0"/><text x="64" y="417" font-size="23" font-weight="650" fill="#173d36">错误方式：直接当成未执行</text><text x="64" y="450" font-size="19" fill="#526b63">生成新的副作用</text><text x="64" y="479" font-size="19" fill="#526b63">可能出现重复文件或重复提交</text><rect x="42" y="568" width="916" height="54" rx="12" fill="#e7eee5"/><text x="62" y="602" font-size="19" fill="#355b4f">调用 ID 关联一次请求；业务操作 ID 关联一次逻辑副作用。</text><rect x="42" y="635" width="916" height="54" rx="12" fill="#e7eee5"/><text x="62" y="669" font-size="19" fill="#355b4f">会话恢复不等于事务回滚；跨系统操作仍需要幂等支持与对账。</text><text x="42" y="707" font-size="14" fill="#728079">教学图解 · 具体实现与保证范围见正文 · 2026-09-08</text></g></svg>