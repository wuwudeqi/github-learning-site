<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img"><title>执行并发与结果有序，是两层约束</title><desc>假设 A、B 已以共享方式进入，C 等待独占；时长仅为示意</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#517669" stroke-width="1.5"/></marker></defs><rect width="1000" height="950" rx="20" fill="#f5f4ee"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="40" font-size="14" fill="#527667">CODEX HARNESS / MECHANISM STUDY</text><text x="40" y="88" font-size="32" fill="#173d36">执行并发与结果有序，是两层约束</text><text x="40" y="125" font-size="18" fill="#60716b">假设 A、B 已以共享方式进入，C 等待独占；时长仅为示意</text><text x="40" y="195" font-size="24" fill="#173d36">第一层：RwLock 执行准入</text><text x="40" y="263" font-size="21" fill="#173d36">A / 读锁</text><rect x="200" y="220" width="430" height="80" rx="13" fill="#dce9df" stroke="#bccfc3"/><text x="220" y="255" font-size="23" fill="#173d36">A 运行较慢</text><text x="40" y="373" font-size="21" fill="#173d36">B / 读锁</text><rect x="240" y="330" width="220" height="80" rx="13" fill="#dce9df" stroke="#bccfc3"/><text x="260" y="365" font-size="23" fill="#173d36">B 先完成</text><text x="40" y="483" font-size="21" fill="#173d36">C / 写锁</text><rect x="630" y="440" width="310" height="80" rx="13" fill="#eee3cc" stroke="#bccfc3"/><text x="650" y="475" font-size="23" fill="#173d36">A、B 退出后独占</text><path d="M630 210 V540" stroke="#bba878" stroke-dasharray="6 6" fill="none"/><text x="200" y="560" font-size="18" fill="#60716b">时间向右 →</text><text x="40" y="625" font-size="24" fill="#173d36">第二层：FuturesOrdered 收集观察</text><rect x="40" y="655" width="275" height="125" rx="13" fill="#fff" stroke="#bccfc3"/><text x="60" y="690" font-size="23" fill="#173d36">B 已完成</text><text x="60" y="723" font-size="19" fill="#173d36">但 A 仍未交付结果</text><rect x="365" y="655" width="275" height="125" rx="13" fill="#fff" stroke="#bccfc3"/><text x="385" y="690" font-size="23" fill="#173d36">等待 A 结果</text><text x="385" y="723" font-size="19" fill="#173d36">A → B 按插入顺序记录</text><rect x="690" y="655" width="270" height="125" rx="13" fill="#fff" stroke="#bccfc3"/><text x="710" y="690" font-size="23" fill="#173d36">收尾后继续推理</text><text x="710" y="723" font-size="19" fill="#173d36">使用累积的工具观察</text><polyline points="315,718 363,718" fill="none" stroke="#517669" stroke-width="2.4" marker-end="url(#a)"/><polyline points="640,718 688,718" fill="none" stroke="#517669" stroke-width="2.4" marker-end="url(#a)"/><rect x="40" y="830" width="920" height="55" rx="10" fill="#e1eadf"/><text x="58" y="865" font-size="19" fill="#173d36">有序等待不等于串行执行；工具可并行也不等于具体调用没有依赖。</text><text x="40" y="928" font-size="14" fill="#60716b">固定版本路径的教学图解 · 具体控制分支与限制见正文</text></g></svg>