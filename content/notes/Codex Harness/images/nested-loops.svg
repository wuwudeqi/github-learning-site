<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img"><title>三个循环，不是一个 while</title><desc>每一层都在“继续”，但继续的原因不同</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#517669" stroke-width="1.5"/></marker></defs><rect width="1000" height="950" rx="20" fill="#f5f4ee"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="40" font-size="14" fill="#527667">CODEX HARNESS / MECHANISM STUDY</text><text x="40" y="88" font-size="32" fill="#173d36">三个循环，不是一个 while</text><text x="40" y="125" font-size="18" fill="#60716b">每一层都在“继续”，但继续的原因不同</text><rect x="40" y="160" width="920" height="665" rx="13" fill="#e7eee5" stroke="#bccfc3"/><text x="60" y="195" font-size="23" fill="#173d36">外层 / run_turn</text><text x="60" y="228" font-size="19" fill="#173d36">接收待处理输入 → 捕获 StepContext → 生成当前 Prompt</text><rect x="80" y="270" width="840" height="415" rx="13" fill="#f5f4ee" stroke="#bccfc3"/><text x="100" y="305" font-size="23" fill="#173d36">中层 / run_sampling_request</text><text x="100" y="338" font-size="19" fill="#173d36">首次用给定输入；重试重读当前历史</text><rect x="120" y="375" width="760" height="215" rx="13" fill="#fff" stroke="#bccfc3"/><text x="140" y="410" font-size="23" fill="#173d36">内层 / try_run_sampling_request</text><text x="140" y="443" font-size="19" fill="#173d36">逐事件读取：item 完整 → 记录调用 → 启动工具</text><text x="140" y="472" font-size="19" fill="#173d36">文本 delta 用于流式显示；不是任务终态</text><text x="140" y="501" font-size="19" fill="#173d36">response Completed / 错误 → 退出流消费</text><text x="105" y="640" font-size="20" fill="#173d36">收集 in-flight 工具结果；按错误分类决定是否重试</text><text x="65" y="737" font-size="21" fill="#173d36">工具要继续？有新输入？达到窗口边界？停止钩子？</text><text x="65" y="779" font-size="21" fill="#173d36">这些条件决定：下一次采样 / 压缩 / 候选结束</text><rect x="40" y="850" width="920" height="55" rx="10" fill="#e1eadf"/><text x="58" y="885" font-size="19" fill="#173d36">模型响应结束后，工具可能仍在运行；Turn 的结束条件在外层。</text><text x="40" y="928" font-size="14" fill="#60716b">固定版本路径的教学图解 · 具体控制分支与限制见正文</text></g></svg>