<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>候选选择合成示例</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ed;color:#202c32;font-family:"PingFang SC","Noto Sans CJK SC",sans-serif}main{width:600px;padding:26px 24px}h1{font-size:31px;margin:0 0 12px}p{font-size:24px;line-height:1.6;margin:8px 0}.small{font-size:20px;color:#536269}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0;font-size:23px}.a{color:#8c6e4b}.b{color:#137e7a}.row{margin:22px 0;padding:22px;background:white;border-radius:14px}.label{font-size:27px;font-weight:650;margin-bottom:12px}.track{height:32px;background:transparent;display:flex;align-items:center;margin:10px 0;position:relative}.bar{height:100%;min-width:2px}.av{background:#b4936e}.bv{background:#268d86}.value{padding-left:12px;font-size:24px;white-space:nowrap}.foot{border-top:1px solid #c6ceca;padding-top:18px;margin-top:22px}.mono{white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,monospace;font-size:22px}</style><main><h1>候选选择与最终验证，解决不同的问题</h1><p>本机 Python 实际运行 · 四个手工构造案例 · 每个草稿 4 个词</p><div class="legend"><span class="a">■ 每个位置独立取首选</span><span class="b">■ 按前一个已选词选择</span></div><div id="rows"></div><div class="foot"><p>横条：从开头起连续匹配参考答案的词数，范围 0—4。</p><p>已知答案充当验证器；验证后四项输出均与参考一致。</p><p class="small">这不是训练出的打分器，也不模拟随机采样接受规则；不报告加速比或模型准确率。<br>数据：candidate-results.json；实现：candidate_walk.py。</p></div></main><script>const DATA={"generatedAt": "2026-10-12T14:10:22.284265+00:00", "python": "3.14.3", "platform": "macOS-27.0-arm64-arm-64bit-Mach-O", "dataType": "hand-constructed synthetic cases and scores", "scope": "illustration of candidate selection and reference fallback; no speed or model accuracy claim", "results": [{"id": "agreement", "label": "搭配可纠正", "independent": ["These", "key", "is", "missing"], "conditional": ["These", "keys", "are", "missing"], "reference": ["These", "keys", "are", "missing"], "accepted_independent": 1, "accepted_conditional": 4, "final_after_toy_verification": ["These", "keys", "are", "missing"]}, {"id": "coherent", "label": "原候选已正确", "independent": ["The", "cat", "sits", "here"], "conditional": ["The", "cat", "sits", "here"], "reference": ["The", "cat", "sits", "here"], "accepted_independent": 4, "accepted_conditional": 4, "final_after_toy_verification": ["The", "cat", "sits", "here"]}, {"id": "missing", "label": "正确候选缺失", "independent": ["These", "key", "is", "missing"], "conditional": ["These", "key", "is", "missing"], "reference": ["These", "keys", "are", "missing"], "accepted_independent": 1, "accepted_conditional": 1, "final_after_toy_verification": ["These", "keys", "are", "missing"]}, {"id": "first", "label": "首个候选错误", "independent": ["Those", "keys", "are", "missing"], "conditional": ["Those", "keys", "are", "missing"], "reference": ["These", "keys", "are", "missing"], "accepted_independent": 0, "accepted_conditional": 0, "final_after_toy_verification": ["These", "keys", "are", "missing"]}]};for(const r of DATA.results){const el=document.createElement('section');el.className='row';const title=document.createElement('div');title.className='label';title.textContent=r.label;el.append(title);for(const [k,c] of [['accepted_independent','av'],['accepted_conditional','bv']]){const tr=document.createElement('div');tr.className='track';const b=document.createElement('div');b.className='bar '+c;b.style.width=(r[k]/4*80)+'%';tr.append(b);const t=document.createElement('span');t.className='value';t.textContent=r[k]+' / 4';tr.append(t);el.append(tr)}const p=document.createElement('p');p.className='mono';p.textContent='独立：'+r.independent.join(' ')+'\n条件：'+r.conditional.join(' ');el.append(p);document.getElementById('rows').append(el)}</script></html>
