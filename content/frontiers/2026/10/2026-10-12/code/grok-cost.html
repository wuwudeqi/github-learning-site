<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Grok视频费用对比</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ed;color:#202c32;font-family:"PingFang SC","Noto Sans CJK SC",sans-serif}main{width:600px;padding:26px 24px}h1{font-size:31px;margin:0 0 12px}p{font-size:24px;line-height:1.6;margin:8px 0}.small{font-size:20px;color:#536269}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0;font-size:23px}.a{color:#8c6e4b}.b{color:#137e7a}.row{margin:22px 0;padding:22px;background:white;border-radius:14px}.label{font-size:27px;font-weight:650;margin-bottom:12px}.track{height:32px;background:transparent;display:flex;align-items:center;margin:10px 0;position:relative}.bar{height:100%;min-width:2px}.av{background:#b4936e}.bv{background:#268d86}.value{padding-left:12px;font-size:24px;white-space:nowrap}.foot{border-top:1px solid #c6ceca;padding-top:18px;margin-top:22px}.mono{font-family:ui-monospace,monospace;font-size:22px}</style><main><h1>同样生成 10 秒视频，分辨率改变多少费用？</h1><p>Grok Video 1.5 · 仅输出费用 · 美元（USD）</p><div class="legend"><span class="a">■ 完整 1.5</span><span class="b">■ 1.5 Lite</span></div><div id="rows"></div><div class="foot"><p>按官方每秒单价 × 10 秒计算；统一横轴 0—2.50 美元。</p><p class="small">不含图片输入、重试或多个候选；价格不能说明画面质量。<br>来源：docs.x.ai/developers/pricing · 2026-10-12 核验<br>HTML/JS 绘制，非产品截图；未实际付费调用。</p></div></main><script>const DATA={"observedDate": "2026-10-12", "source": "https://docs.x.ai/developers/pricing", "seconds": 10, "currency": "USD", "scope": "output-only; excludes image input, retries and multiple candidates", "pricesPerSecond": [{"resolution": "480p", "lite": 0.02, "full": 0.08}, {"resolution": "720p", "lite": 0.03, "full": 0.14}, {"resolution": "1080p", "lite": 0.14, "full": 0.25}]};for(const r of DATA.pricesPerSecond){const el=document.createElement('section');el.className='row';const h=document.createElement('div');h.className='label';h.textContent=r.resolution;el.append(h);for(const [k,c] of [['full','av'],['lite','bv']]){const cost=r[k]*DATA.seconds;const tr=document.createElement('div');tr.className='track';const b=document.createElement('div');b.className='bar '+c;b.style.width=(cost/2.5*80)+'%';tr.append(b);const t=document.createElement('span');t.className='value';t.textContent='$'+cost.toFixed(2);tr.append(t);el.append(tr)}document.getElementById('rows').append(el)}</script></html>
