<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教师一致率与真实准确率</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#172d2b;font-family:system-ui,-apple-system,'PingFang SC',sans-serif}.chart{padding:42px;width:1100px}h1{font-size:36px;margin:0 0 12px}.sub{font-size:21px;color:#48635e;margin-bottom:30px}.legend{display:flex;gap:32px;font-size:20px;margin:20px 0}.dot{display:inline-block;width:16px;height:16px;margin-right:10px}.agree{background:#417d80}.accuracy{background:#c27937}.row{display:grid;grid-template-columns:210px 1fr;gap:22px;margin:27px 0}.name{font-size:23px;font-weight:600;align-self:center}.bars{border-left:1px solid #8aa39c}.track{height:38px;background:#e2e4db;margin:10px 0;position:relative}.bar{height:100%;padding:4px 10px;color:white;text-align:right;font-size:21px;font-weight:700}.axis{display:flex;justify-content:space-between;margin-left:232px;font-size:18px}.foot{border-top:1px solid #b9c8bd;margin-top:26px;padding-top:19px;font-size:19px;line-height:1.65}strong{color:#7c4024}</style><main class="chart" id="chart"><h1>相同的 99% 教师一致率，可能更准，也可能更差</h1><div class="sub">本机执行的合成标签实验 · 三组各 1,000 项 · 教师真实准确率 80%</div><div class="legend"><span><i class="dot agree"></i>与教师一致</span><span><i class="dot accuracy"></i>符合真实标签</span></div><div id="rows"></div><div class="axis"><span>0%</span><span>50%</span><span>100%</span></div><div class="foot">所有样本都由学生回答：覆盖率固定 100%。<br><strong>一致率衡量复刻；准确率衡量对错。</strong>这不是任何真实模型或服务的实测成绩。<br>数据：agreement_audit.py 的确定性输出；Python 3.14.3 / macOS arm64 / 仅 CPU。</div></main><script>
fetch('agreement-results.json').then(r=>r.json()).then(data=>{const names={copy:'完全复制教师',repair_10:'修正 10 个教师错误',damage_10:'额外弄错 10 个答案'};for(const r of data.rows){const e=document.createElement('div');e.className='row';e.innerHTML=`<div class="name">${names[r.scenario]}</div><div class="bars"><div class="track"><div class="bar agree" style="width:${r.agreement_pct}%">${r.agreement_pct}%</div></div><div class="track"><div class="bar accuracy" style="width:${r.accuracy_pct}%">${r.accuracy_pct}%</div></div></div>`;document.getElementById('rows').append(e)}document.body.dataset.ready='true'});
</script></html>
