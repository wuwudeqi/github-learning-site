<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>阳性对照实验</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#163b35;font-family:Arial,"PingFang SC",sans-serif}main{width:1100px;padding:52px}small{letter-spacing:3px;color:#65756d}h1{font-size:38px;margin:16px 0 10px}p{font-size:21px;line-height:1.5}table{border-collapse:collapse;width:100%;margin:30px 0;background:#fffdf6;font-size:23px}th,td{padding:23px 17px;text-align:left;border-bottom:1px solid #d6ded6}th{font-size:19px;color:#5d7166}td:last-child{font-weight:bold}.pass{color:#147449}.fail{color:#ae4930}footer{font-size:17px;color:#647568;line-height:1.7}</style>
<main id="figure"><small>LOCAL SYNTHETIC EXPERIMENT · 2026-10-16</small><h1>拒绝得多，不代表工具做得对</h1><p>先确认允许的操作能完成，再检查禁止的操作被阻止。</p><table><thead><tr><th>实现策略</th><th>正常读取</th><th>禁止样本通过</th><th>联合判断</th></tr></thead><tbody></tbody></table><footer>本机真实输出；1 个正常样本 + 2 个禁止样本（父目录、符号链接）。<br>全部使用临时合成文件；不是攻击成功率，也不是生产沙箱认证。</footer></main><script>
fetch('./positive-control-results.json').then(r=>r.json()).then(data=>{const names={deny_all:'全部拒绝',bounded:'解析路径并限制边界',allow_all:'全部放行'};for(const r of data.results){const tr=document.createElement('tr');const vals=[names[r.strategy],r.allowed_control_passed?'通过':'失败',r.negative_passed+'/'+r.negative_total,r.joint_pass?'通过':'未通过'];vals.forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(i===1)td.className=r.allowed_control_passed?'pass':'fail';if(i===3)td.className=r.joint_pass?'pass':'fail';tr.append(td)});document.querySelector('tbody').append(tr)}document.body.dataset.ready='true';});</script></html>
