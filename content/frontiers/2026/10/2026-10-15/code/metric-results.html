<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>分母决定指标含义</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f3ea;color:#173344;font:24px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:50px}main{width:1100px}small{color:#5f6f78;font-size:19px}h1{font-size:42px;margin:10px 0 32px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}section{background:white;padding:28px;border-radius:16px}table{border-collapse:collapse;width:100%;font-size:22px}td,th{padding:15px 8px;text-align:left;border-bottom:1px solid #dde4e7}h2{font-size:24px;margin:0 0 24px}.bar{height:24px;background:#e5ecee;margin:12px 0 24px;border-radius:6px}.fill{height:100%;background:#187b87;border-radius:6px}.orange{background:#bc5e32}.metric{display:flex;justify-content:space-between;gap:15px;font-size:22px}footer{margin:28px 0;font-size:21px;line-height:1.7;color:#42545f}</style>
<main><small>前沿 · 2026-10-15 · 本机 Python 输出 / 手工合成数据</small><h1>98% 的步骤正确，只有 50% 的任务成功</h1><div class="grid"><section><h2>同一批四个任务</h2><table><thead><tr><th>任务</th><th>正确 / 总步骤</th><th>最终验收</th></tr></thead><tbody id="rows"></tbody></table></section><section><h2>同一份记录，三种分母</h2><div id="metrics"></div></section></div><footer>步骤微平均：98 / 100；步骤宏平均：四个任务各自比例的平均；任务成功：2 / 4。<br>合成反例只解释指标含义，不代表任何模型或论文的真实成绩。</footer></main>
<script type="module">const d=await (await fetch('./metric-results.json')).json();document.getElementById('rows').innerHTML=d.rows.map(r=>`<tr><td>${r.task}</td><td>${r.correct_steps} / ${r.total_steps}</td><td>${r.task_success?'通过':'未通过'}</td></tr>`).join('');const defs=[['micro_step_accuracy','步骤微平均'],['macro_step_accuracy','步骤宏平均'],['task_success_rate','任务成功率']];document.getElementById('metrics').innerHTML=defs.map(([k,n])=>`<div class="metric"><span>${n}</span><b>${+(d.metrics[k].rate*100).toFixed(2)}%</b></div><div class="bar"><div class="fill ${k==='task_success_rate'?'orange':''}" style="width:${d.metrics[k].rate*100}%"></div></div>`).join('');document.body.dataset.ready='true';</script></html>
