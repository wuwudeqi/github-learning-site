<!doctype html><html lang="zh"><meta charset="utf-8"><title>幂等回执：实际运行结果</title><style>*{box-sizing:border-box}body{max-width:1080px;margin:0;padding:40px;font-family:system-ui,'PingFang SC',sans-serif;color:#172b38;background:#f2f5f2}h1{font-size:32px;margin:0 0 12px}.sub{font-size:18px;color:#48616b;line-height:1.7}table{width:100%;border-collapse:collapse;background:white;font-size:20px;margin:26px 0}th,td{padding:16px;text-align:left;border-bottom:1px solid #d6e3de}th{background:#dfebe4}.count{font-weight:750;color:#24664b}.note{font-size:19px;line-height:1.7;background:#e5ece6;padding:20px;border-left:5px solid #438065}footer{font-size:15px;color:#53656c;margin-top:20px}</style><body><h1>请求可以重试，业务记录只增加一次</h1><div class="sub">Python + SQLite 本机运行 · 人造订单数据 · 子进程真实退出<br>只验证同一数据库内的业务写入与回执原子提交。</div><table><thead><tr><th>执行场景</th><th>调用结果</th><th>累计订单</th></tr></thead><tbody id="rows"></tbody></table><div class="note">提交前退出：重试重新执行。<br>提交后响应丢失：重试读取已存回执，不再新增订单。<br>同一 key 换参数：拒绝；不能把它误当作成功重试。</div><footer id="env"></footer><script>fetch('./idempotency-results.json').then(r=>r.json()).then(d=>{for(const r of d.cases){let tr=document.createElement('tr');let outcome=r.responses?'created + replayed':r.response?r.response.status:'无响应（进程退出 '+r.exitCode+'）';for(const v of [r.case,outcome,r.ordersAfter]){let td=document.createElement('td');td.textContent=v;tr.append(td)}tr.lastChild.className='count';rows.append(tr)}env.textContent='数据：idempotency-results.json · '+d.environment.platform+' '+d.environment.machine+' · Python '+d.environment.python+' / SQLite '+d.environment.sqlite+' · '+d.observedAt;document.body.dataset.ready='true'});</script></body></html>
