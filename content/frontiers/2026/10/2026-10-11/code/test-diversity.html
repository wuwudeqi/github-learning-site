<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>三种测试的真实运行结果</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f5;color:#17323a;font:20px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{width:1200px;padding:42px 46px}small{font-size:18px;color:#526666}h1{font-size:36px;line-height:1.2;margin:12px 0}p{margin:14px 0 26px}table{width:100%;border-collapse:collapse;background:white;font-size:21px}th,td{padding:14px;border-bottom:1px solid #d9e1df;text-align:center}th{background:#e8eeeb;font-size:19px}td:first-child,th:first-child{text-align:left}.good{color:#146347;background:#e9f4ed}.bad{color:#9d3f24;background:#fff0e9}tfoot{font-size:19px;font-weight:600}footer{margin-top:20px;color:#526666;font-size:17px}.legend{font-size:18px;margin-bottom:12px}.tag{font-size:16px;border:1px solid #ccd8d3;border-radius:4px;padding:2px 7px;margin-left:8px}code{font-size:17px}</style><main><small>前沿 · 2026-10-11 / 本机合成教学实验</small><h1>测试通过，不一定说明测试有效</h1><p>同一个去重任务：既要接受不同的正确写法，也要拦住违反合同的实现。</p><div class="legend">绿色＝判断符合合同　橙色＝误杀或漏检　每格均来自实际 Python 运行</div><table><thead><tr><th>被测实现</th></tr></thead><tbody></tbody><tfoot></tfoot></table><footer>只有一个合成任务、2个正确变体、4个错误变体；不是论文复现、模型评测或正确性证明。<br>数据：test-diversity-results.json；Python 3.14.3 / Darwin arm64；通过表示该套测试接受此实现。</footer></main><script>const d={"scope": "One synthetic task; not TestPrism reproduction or LLM evaluation", "python": "3.14.3", "system": "Darwin", "machine": "arm64", "cases": [[["b", "a", "b", "", "a"], ["b", "a", ""]], [[], []], [["", ""], [""]], [["b", "a"], ["b", "a"]], [["x"], ["x"]]], "rows": [{"id": "loop_unique", "label": "循环去重", "validByContract": true, "passes": {"weak_example": true, "source_style": true, "contract_examples": true}}, {"id": "dict_unique", "label": "字典去重", "validByContract": true, "passes": {"weak_example": true, "source_style": false, "contract_examples": true}}, {"id": "sorted_unique", "label": "排序后去重", "validByContract": false, "passes": {"weak_example": true, "source_style": false, "contract_examples": false}}, {"id": "identity", "label": "保留全部元素", "validByContract": false, "passes": {"weak_example": false, "source_style": false, "contract_examples": false}}, {"id": "drop_empty", "label": "错误丢弃空串", "validByContract": false, "passes": {"weak_example": true, "source_style": true, "contract_examples": false}}, {"id": "keep_last", "label": "保留末次顺序", "validByContract": false, "passes": {"weak_example": false, "source_style": false, "contract_examples": false}}], "suites": [{"id": "weak_example", "label": "单一样例", "validAccepted": 2, "validTotal": 2, "invalidRejected": 2, "invalidTotal": 4}, {"id": "source_style", "label": "样例＋源码样式", "validAccepted": 1, "validTotal": 2, "invalidRejected": 3, "invalidTotal": 4}, {"id": "contract_examples", "label": "五组合同行为样例", "validAccepted": 2, "validTotal": 2, "invalidRejected": 4, "invalidTotal": 4}]};const head=document.querySelector('thead tr');for(const s of d.suites){const th=document.createElement('th');th.textContent=s.label;head.append(th)}const body=document.querySelector('tbody');for(const r of d.rows){const tr=document.createElement('tr');const td=document.createElement('td');td.textContent=r.label;const tag=document.createElement('span');tag.className='tag';tag.textContent=r.validByContract?'正确':'错误';td.append(tag);tr.append(td);for(const s of d.suites){const p=r.passes[s.id],match=p===r.validByContract;const c=document.createElement('td');c.className=match?'good':'bad';c.textContent=p?(match?'通过':'通过 · 漏检'):(match?'拦下':'拦下 · 误杀');tr.append(c)}body.append(tr)}for(const [key,label,total] of [['validAccepted','正确实现被接受',2],['invalidRejected','错误实现被拦下',4]]){const tr=document.createElement('tr');const td=document.createElement('td');td.textContent=label;tr.append(td);for(const s of d.suites){const c=document.createElement('td');c.textContent=s[key]+' / '+total;tr.append(c)}document.querySelector('tfoot').append(tr)}</script></html>
