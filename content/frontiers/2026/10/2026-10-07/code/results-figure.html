<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>合成评测：分母改变排序</title><style>body{margin:0;background:#eef1f5;color:#142939;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}#figure{width:1080px;box-sizing:border-box;padding:48px;background:white}h1{font-size:34px;margin:0 0 10px}p{font-size:19px;color:#526473;line-height:1.5}#grid{display:grid;grid-template-columns:1fr 1fr;gap:30px}section{border:1px solid #dce4e9;padding:22px;border-radius:12px}h2{font-size:23px;margin:0 0 20px}.row{display:flex;align-items:center;gap:12px;margin:18px 0;font-size:21px}.bar{height:24px;border-radius:3px}.track{flex:1;background:#f0f3f5}b{width:90px;text-align:right;font-variant-numeric:tabular-nums}.note{font-size:16px;border-top:1px solid #dce4e9;padding-top:20px;margin-top:30px}small{font-size:17px;color:#526473}</style><main id="figure"><h1>总分领先，也可能漏掉全部稀少任务</h1><p>合成数据：常见任务 980 条、稀少任务 20 条；A、B 是虚拟系统。</p><div id="grid"></div><p class="note">数据来自 evaluate.py 的实际输出 results.json。每条横条的满量程均为 100%。<br>宏平均给两类各 50% 权重；假设稀少任务占 20% 时，A 为 79.18%，B 为 91.73%。</p></main><script>fetch('results.json').then(x=>x.json()).then(d=>{const defs=[['micro','总体准确率','按这 1000 条样本计算'],['rare','稀少任务准确率','单独查看 20 条'],['common','常见任务准确率','单独查看 980 条'],['macro','两类宏平均','每类各占一半权重']];document.querySelector('#grid').innerHTML=defs.map(([k,t,n])=>`<section><h2>${t}</h2><small>${n}</small>${['A','B'].map(m=>{let v=d.scores[m][k]??d.scores[m].by_stratum[k];return `<div class="row"><span>${m}</span><div class="track"><div class="bar" style="width:${v*100}%;background:${m==='A'?'#b77730':'#168179'}"></div></div><b>${(v*100).toFixed(2)}%</b></div>`}).join('')}</section>`).join('');window.figureReady=true})</script></html>
