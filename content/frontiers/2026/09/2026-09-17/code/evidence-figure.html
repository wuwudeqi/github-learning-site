<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>证据评分实验结果</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0e7;color:#173a33;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}#figure{width:840px;padding:42px}h1{font-size:40px;line-height:1.4;margin:12px 0}p{font-size:23px;line-height:1.6}.eyebrow{font-size:18px;letter-spacing:2px;color:#5a776d}section{padding:24px;background:#fffef9;border-radius:16px;border:1px solid #ccd8d0;margin:24px 0}h2{font-size:29px;margin:0 0 10px}.input{font-family:monospace;background:#edf1eb;padding:12px;border-radius:5px}.grid{display:grid;grid-template-columns:1fr 110px 110px;gap:12px;align-items:center;padding:15px 0;border-top:1px solid #d9ded4;font-size:23px}.head{font-size:20px;color:#566c62;border:0}.score{text-align:center;font-size:30px;font-weight:650}.good{color:#216953}.bad{color:#a35238}.footer{font-size:21px;color:#596e64;border-top:1px solid #bdcbc1;padding-top:20px;line-height:1.65}</style><main id="figure"><div class="eyebrow">本站实际运行 · 标准库小实验</div><h1>有数字、有引用，<br>仍可能没有足够证据</h1><p>相同答案，分别按表现形式与证据边界评分。<br>分数来自手写规则，不是模型能力成绩。</p><div id="results"></div><div class="footer">形式分：数字 40 + 引用 30 + 明确断言 30。<br>证据分：字段齐全时正确求和；缺数据时保留未知，<br>并正确给出已知小计与对应引用。<br>答案与输入为人工构造；HTML / JS 直接读取本机运行 JSON。</div></main><script type="module">const d=await fetch('./evidence-results.json.txt').then(r=>r.json());document.getElementById('results').innerHTML=d.cases.map(x=>`<section><h2>${x.case}</h2><p class="input">${Object.entries(x.rows).map(([k,v])=>k+' = '+(v===null?'缺失':v)).join('　')}</p><div class="grid head"><span>答案</span><span>形式分</span><span>证据分</span></div>${x.scores.map(s=>`<div class="grid"><span>${s.answer}</span><span class="score">${s.styleScore}</span><span class="score ${s.evidenceScore?'good':'bad'}">${s.evidenceScore}</span></div>`).join('')}</section>`).join('');document.body.dataset.ready='true';</script></html>
