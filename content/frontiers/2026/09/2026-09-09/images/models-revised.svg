<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-label="输出不同，评测也不同"><style>text{font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif;fill:#173533}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526b67}.head{font-size:25px;font-weight:650}.body{font-size:22px}.small{font-size:19px;fill:#526b67}.number{font-size:35px;font-weight:700;fill:#0f766e}</style><rect width="960" height="530" rx="24" fill="#eef5f0"/><text x="40" y="55" class="title">输出不同，评测也不同</text><text x="40" y="92" class="sub">生成一段回答，和找到一页资料，是两种任务。</text><text x="40" y="145" class="head">MiniCPM5-2B</text><rect x="40" y="165" width="250" height="72" rx="16" fill="#fff" stroke="#cee0d7"/><text x="60" y="210" class="body">指令 / 上下文</text><rect x="350" y="165" width="250" height="72" rx="16" fill="#fff" stroke="#cee0d7"/><text x="370" y="210" class="body">因果语言模型</text><rect x="660" y="165" width="250" height="72" rx="16" fill="#fff" stroke="#cee0d7"/><text x="680" y="210" class="body">生成 token</text><path d="M296 201 L340 201" fill="none" stroke="#478779" stroke-width="3"/><path d="M332 194 L340 201 L332 208" fill="none" stroke="#478779" stroke-width="3"/><path d="M606 201 L650 201" fill="none" stroke="#478779" stroke-width="3"/><path d="M642 194 L650 201 L642 208" fill="none" stroke="#478779" stroke-width="3"/><text x="40" y="271" class="small">验证：格式正确 + 任务正确 + 完整耗时</text><text x="40" y="335" class="head">NeoMME Retriever</text><rect x="40" y="355" width="250" height="72" rx="16" fill="#fff" stroke="#cee0d7"/><text x="60" y="400" class="body">查询 / 文档页</text><rect x="350" y="355" width="250" height="72" rx="16" fill="#fff" stroke="#cee0d7"/><text x="370" y="400" class="body">共享编码器</text><rect x="660" y="355" width="250" height="72" rx="16" fill="#fff" stroke="#cee0d7"/><text x="680" y="400" class="body">稠密 / 多向量</text><path d="M296 391 L340 391" fill="none" stroke="#478779" stroke-width="3"/><path d="M332 384 L340 391 L332 398" fill="n