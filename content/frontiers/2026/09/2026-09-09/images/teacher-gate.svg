<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 525" role="img" aria-label="Verify Before You Distill"><style>text{font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif;fill:#173533}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526b67}.head{font-size:25px;font-weight:650}.body{font-size:22px}.small{font-size:19px;fill:#526b67}.number{font-size:35px;font-weight:700;fill:#0f766e}</style><rect width="960" height="525" rx="24" fill="#eef5f0"/><text x="40" y="55" class="title">Verify Before You Distill</text><text x="40" y="92" class="sub">先用可验证的结果，判断教师在当前问题上是否可靠。</text><rect x="40" y="145" width="250" height="140" rx="16" fill="#fff" stroke="#cee0d7"/><text x="62" y="187" class="head">同一训练问题</text><text x="62" y="227" class="body">教师采样 3 次</text><text x="62" y="262" class="body">验证最终结果</text><path d="M297 215 L360 215" fill="none" stroke="#478779" stroke-width="3"/><path d="M352 208 L360 215 L352 222" fill="none" stroke="#478779" stroke-width="3"/><rect x="370" y="145" width="245" height="140" rx="16" fill="#fff" stroke="#cee0d7"/><text x="393" y="187" class="head">至少 2 次通过？</text><text x="393" y="229" class="body">可靠性门控</text><rect x="675" y="128" width="245" height="120" rx="16" fill="#fff" stroke="#cee0d7"/><text x="695" y="169" class="head">通过 → OPD</text><text x="695" y="212" class="body">采用教师监督</text><rect x="675" y="285" width="245" height="120" rx="16" fill="#fff" stroke="#cee0d7"/><text x="695" y="327" class="head">未通过 → GRPO</text><text x="695" y="370" class="body">采用结果奖励</text><path d="M620 194 L665 194" fill="none" stroke="#478779" stroke-width="3"/><path d="M657 187 L665 194 L657 201" fill="none" stroke="#478779" stroke-width="3"/><path d="M620 230 L643 230 L643 345 L665 345" fill="none" stroke="#478779" stroke-width="3"/><text x="40" y="450" class="head">每题只走一条监督路径；不是把两种信号混合。</text><text x="40" y="490" class="small">原文方法示意；本站未训练。组内奖励全相同会得到零 GRPO 优势。</text></svg>