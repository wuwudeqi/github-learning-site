<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-label="09.09 阅读地图"><style>text{font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif;fill:#173533}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526b67}.head{font-size:25px;font-weight:650}.body{font-size:22px}.small{font-size:19px;fill:#526b67}.number{font-size:35px;font-weight:700;fill:#0f766e}</style><rect width="960" height="500" rx="24" fill="#eef5f0"/><text x="40" y="55" class="title">09.09 阅读地图</text><text x="40" y="92" class="sub">从重要消息出发，沿着证据走向可运行的实验。</text><rect x="35" y="130" width="285" height="150" rx="16" fill="#fff" stroke="#cee0d7"/><text x="55" y="172" class="head">15 条重要动态</text><text x="55" y="215" class="body">先看重大发布</text><text x="55" y="249" class="small">12 条公司 + 3 条项目</text><rect x="335" y="130" width="285" height="150" rx="16" fill="#fff" stroke="#cee0d7"/><text x="355" y="172" class="head">2 组开源模型</text><text x="355" y="215" class="body">区分生成与检索</text><text x="355" y="249" class="small">先建立任务基线</text><rect x="635" y="130" width="285" height="150" rx="16" fill="#fff" stroke="#cee0d7"/><text x="655" y="172" class="head">2 篇论文</text><text x="655" y="215" class="body">验证该放在哪里</text><text x="655" y="249" class="small">看方法，也看回退</text><rect x="35" y="300" width="285" height="150" rx="16" fill="#fff" stroke="#cee0d7"/><text x="55" y="342" class="head">3 个热门项目</text><text x="55" y="385" class="body">关注增长有依据</text><text x="55" y="419" class="small">读用途，再看限制</text><rect x="335" y="300" width="285" height="150" rx="16" fill="#fff" stroke="#cee0d7"/><text x="355" y="342" class="head">1 篇运行实践</text><text x="355" y="385" class="body">核算完整工作流</text><text x="355" y="419" class="small">正确率 / 成本 / 延迟</text><rect x="635" y="300" width="285" height="150" rx="16" fill="#fff" stroke="#cee0d7"/><text x="655" y="342" class="head">阅读原则</text><text x="655" y="385" class="body">日期、来源、边界</text><text x="655" y="419" class="small">结果与建议分开</text></svg>