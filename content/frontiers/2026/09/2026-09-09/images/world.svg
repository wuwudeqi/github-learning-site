<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><title>Puffin-World：一个视角，三种世界信息</title><rect width="960" height="580" rx="22" fill="#f2f6f6"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="38" y="52" font-size="30" font-weight="700" fill="#153b3a">Puffin-World：一个视角，三种世界信息</text><text x="38" y="88" font-size="18" fill="#536c70">依据原文绘制的概念图；不展示生成样例或真实点云</text><rect x="32" y="112" width="896" height="94" rx="12" fill="white"/><text x="53" y="147" font-size="24" font-weight="600" fill="#177c70">输入：初始视图 + 相机运动</text><text x="53" y="181" font-size="19" fill="#405b66">既描述相对移动，也把相机朝向与物理世界联系起来</text><rect x="32" y="222" width="896" height="94" rx="12" fill="white"/><text x="53" y="257" font-size="24" font-weight="600" fill="#177c70">物理：重力与纬度图</text><text x="53" y="291" font-size="19" fill="#405b66">给视角提供物理参照；“物理”不等于任意物体动力学</text><rect x="32" y="332" width="896" height="94" rx="12" fill="white"/><text x="53" y="367" font-size="24" font-weight="600" fill="#177c70">几何：深度    外观：RGB</text><text x="53" y="401" font-size="19" fill="#405b66">联合生成后续视图与深度，再连接到三维重建</text><rect x="32" y="442" width="896" height="94" rx="12" fill="white"/><text x="53" y="477" font-size="24" font-weight="600" fill="#177c70">验证：分开检查三类结果</text><text x="53" y="511" font-size="19" fill="#405b66">相机参数误差 / 视图一致性 / 重建；动态场景仍有限制</text></g></svg>