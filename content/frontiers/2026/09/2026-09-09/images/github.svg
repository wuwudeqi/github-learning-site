<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><title>工程工具：从任务到可复查证据</title><rect width="960" height="470" rx="22" fill="#f2f6f6"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="38" y="52" font-size="30" font-weight="700" fill="#153b3a">工程工具：从任务到可复查证据</text><text x="38" y="88" font-size="18" fill="#536c70">项目职责示意；不是三者已集成或已部署的声明</text><rect x="32" y="112" width="896" height="94" rx="12" fill="white"/><text x="53" y="147" font-size="24" font-weight="600" fill="#177c70">promptfoo → 应用回归</text><text x="53" y="181" font-size="19" fill="#405b66">固定提示、测试案例与断言，比较不同配置的输出</text><rect x="32" y="222" width="896" height="94" rx="12" fill="white"/><text x="53" y="257" font-size="24" font-weight="600" fill="#177c70">lm-evaluation-harness → 模型基准</text><text x="53" y="291" font-size="19" fill="#405b66">固定数据集、提示模板与推理参数，保存逐题结果</text><rect x="32" y="332" width="896" height="94" rx="12" fill="white"/><text x="53" y="367" font-size="24" font-weight="600" fill="#177c70">funes → 实验过程记忆</text><text x="53" y="401" font-size="19" fill="#405b66">检索旧会话并回到原始轮次，找回当时的决策理由</text></g></svg>