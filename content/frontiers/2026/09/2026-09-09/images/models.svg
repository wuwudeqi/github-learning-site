<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><title>生成器与编码器：输出不同</title><rect width="960" height="580" rx="22" fill="#f2f6f6"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="38" y="52" font-size="30" font-weight="700" fill="#153b3a">生成器与编码器：输出不同</text><text x="38" y="88" font-size="18" fill="#536c70">依据两组官方模型卡绘制；不是完整网络层结构</text><rect x="32" y="112" width="896" height="94" rx="12" fill="white"/><text x="53" y="147" font-size="24" font-weight="600" fill="#177c70">MiniCPM5-2B</text><text x="53" y="181" font-size="19" fill="#405b66">文本上下文 → 因果语言模型 → 后续文本 / 工具调用</text><rect x="32" y="222" width="896" height="94" rx="12" fill="white"/><text x="53" y="257" font-size="24" font-weight="600" fill="#177c70">NeoMME</text><text x="53" y="291" font-size="19" fill="#405b66">文本 token + 图像 patch → 同一个双向 Transformer</text><rect x="32" y="332" width="896" height="94" rx="12" fill="white"/><text x="53" y="367" font-size="24" font-weight="600" fill="#177c70">NeoMME 下游需要任务头</text><text x="53" y="401" font-size="19" fill="#405b66">预训练骨干 → 检索微调 → 稠密向量 + 多向量</text><rect x="32" y="442" width="896" height="94" rx="12" fill="white"/><text x="53" y="477" font-size="24" font-weight="600" fill="#177c70">选择的第一步</text><text x="53" y="511" font-size="19" fill="#405b66">要生成答案，还是先找到相关页？两个任务分别评测</text></g></svg>