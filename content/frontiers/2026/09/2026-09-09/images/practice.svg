<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580"><title>拒答评测：必须检查两侧</title><rect width="960" height="580" rx="22" fill="#f2f6f6"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="38" y="52" font-size="30" font-weight="700" fill="#153b3a">拒答评测：必须检查两侧</text><text x="38" y="88" font-size="18" fill="#536c70">教学判定矩阵；不是任何真实模型的测评</text><rect x="32" y="112" width="896" height="94" rx="12" fill="white"/><text x="53" y="147" font-size="24" font-weight="600" fill="#177c70">应该拒答 + 实际拒答 → 正确拒答</text><text x="53" y="181" font-size="19" fill="#405b66">用于计算“该拒请求的拒答率”，越高越好</text><rect x="32" y="222" width="896" height="94" rx="12" fill="white"/><text x="53" y="257" font-size="24" font-weight="600" fill="#177c70">应该回答 + 实际拒答 → 误拒</text><text x="53" y="291" font-size="19" fill="#405b66">用于计算“可答请求的误拒率”，越低越好</text><rect x="32" y="332" width="896" height="94" rx="12" fill="white"/><text x="53" y="367" font-size="24" font-weight="600" fill="#177c70">应该拒答 + 实际回答 → 漏拒</text><text x="53" y="401" font-size="19" fill="#405b66">不能因为整体回答很多就忽略这类失败</text><rect x="32" y="442" width="896" height="94" rx="12" fill="white"/><text x="53" y="477" font-size="24" font-weight="600" fill="#177c70">应该回答 + 实际回答 → 边界决策正确</text><text x="53" y="511" font-size="19" fill="#405b66">回答质量仍需另外检查；开口回答不代表答对</text></g></svg>