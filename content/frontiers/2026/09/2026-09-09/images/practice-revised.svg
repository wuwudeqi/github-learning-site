<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 525" role="img" aria-label="一次任务，三种指标"><style>text{font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif;fill:#173533}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526b67}.head{font-size:25px;font-weight:650}.body{font-size:22px}.small{font-size:19px;fill:#526b67}.number{font-size:35px;font-weight:700;fill:#0f766e}</style><rect width="960" height="525" rx="24" fill="#eef5f0"/><text x="40" y="55" class="title">一次任务，三种指标</text><text x="40" y="92" class="sub">教学流程；不表示任何产品的真实路由或性能。</text><rect x="35" y="145" width="260" height="125" rx="16" fill="#fff" stroke="#cee0d7"/><text x="55" y="190" class="head">草拟</text><text x="55" y="234" class="body">第一笔调用成本</text><rect x="350" y="145" width="260" height="125" rx="16" fill="#fff" stroke="#cee0d7"/><text x="370" y="190" class="head">检查 / 升级</text><text x="370" y="234" class="body">计入失败与重试</text><rect x="665" y="145" width="260" height="125" rx="16" fill="#fff" stroke="#cee0d7"/><text x="685" y="190" class="head">完成任务</text><text x="685" y="234" class="body">记录最终成功与否</text><path d="M300 207 L340 207" fill="none" stroke="#478779" stroke-width="3"/><path d="M332 200 L340 207 L332 214" fill="none" stroke="#478779" stroke-width="3"/><path d="M615 207 L655 207" fill="none" stroke="#478779" stroke-width="3"/><path d="M647 200 L655 207 L647 214" fill="none" stroke="#478779" stroke-width="3"/><rect x="35" y="315" width="890" height="170" rx="16" fill="#dfede3" stroke="#cee0d7"/><text x="60" y="357" class="head">以 task_id 汇总完整链路</text><text x="60" y="401" class="body">质量：成功数 / 任务数       成本：所有调用之和</text><text x="60" y="442" class="body">延迟：任务结束 − 任务开始；并行调用不可直接相加</text></svg>