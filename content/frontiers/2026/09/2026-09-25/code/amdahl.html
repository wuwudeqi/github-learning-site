<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>解码三倍，整体几倍</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f0;color:#182d36;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{width:1100px;padding:48px 58px}small{font-size:19px;color:#527079}h1{font-size:38px;margin:12px 0 18px}p{font-size:23px;margin:12px 0}.legend{display:flex;gap:30px;margin:26px 0;font-size:20px}.dot{display:inline-block;width:20px;height:20px;border-radius:4px;vertical-align:middle;margin-right:8px}.row{background:white;border:1px solid #dce3e2;border-radius:16px;padding:24px;margin:18px 0}.top{display:flex;justify-content:space-between;font-size:25px;font-weight:650}.label{width:90px;font-size:18px}.barline{display:flex;align-items:center;gap:16px;margin-top:16px}.track{width:700px;display:flex;height:38px}.fixed,.decode{display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:18px}.fixed{background:#ccd8dc;color:#203640}.decode{background:#157b80;color:white}.caption{font-size:17px;color:#587078;margin:17px 0 0}footer{margin-top:28px;font-size:18px;line-height:1.6;color:#49626a}
</style><main><small>前沿 · 2026.09.25　／　可复算的合成例子</small><h1>解码快 3 倍，整次请求能快多少？</h1><p>原本都耗时 100 ms，只加速其中的解码阶段。</p><div class="legend"><span><i class="dot" style="background:#ccd8dc"></i>其它阶段：保持不变</span><span><i class="dot" style="background:#157b80"></i>解码：耗时变为 1/3</span></div><div id="rows"></div><footer>数据：同目录 amdahl.py 实际运行生成；时间为合成设定，并非模型测速。<br>假设各阶段串行、其它工作不变、无新增草稿开销；真实系统须另测排队、预填充与验证。</footer></main><script>
fetch('amdahl-results.txt').then(r=>r.json()).then(d=>{document.querySelector('#rows').innerHTML=d.rows.map(r=>`<section class="row"><div class="top"><span>原始解码占比 ${r.decode_share*100}%</span><span>整体 ${r.overall_speedup.toFixed(2)} 倍</span></div><div class="barline"><span class="label">优化前</span><div class="track"><span class="fixed" style="width:${r.fixed_ms*7}px">${r.fixed_ms} ms</span><span class="decode" style="width:${r.decode_before_ms*7}px">${r.decode_before_ms} ms</span></div><span>100 ms</span></div><div class="barline"><span class="label">优化后</span><div class="track"><span class="fixed" style="width:${r.fixed_ms*7}px">${r.fixed_ms} ms</span><span class="decode" style="width:${r.decode_after_ms*7}px"></span></div><span>${r.total_after_ms.toFixed(1)} ms</span></div><div class="caption">解码缩短为 ${r.decode_after_ms.toFixed(1)} ms；即使解码无限快，整体上限也只有 ${r.infinite_decode_limit.toFixed(2)} 倍。</div></section>`).join('');document.documentElement.dataset.ready='true'});
</script></html>
