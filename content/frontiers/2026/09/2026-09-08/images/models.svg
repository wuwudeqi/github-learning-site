<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img"><title>三类模型，解决三类问题</title><rect width="960" height="490" rx="24" fill="#f3f6fa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="55" font-size="30" font-weight="700" fill="#12283e">三类模型，解决三类问题</text><text x="40" y="91" font-size="18" fill="#506477">任务不同，不能放进同一张“总分排行榜”</text><rect x="32" y="120" width="896" height="92" rx="14" fill="white"/><rect x="32" y="120" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="154" font-size="24" font-weight="600" fill="#17475a">EVIE · 文档视觉检索</text><text x="57" y="187" font-size="19" fill="#4d6070">查询与页面 → 多个向量 → 局部最佳匹配 → 页面排序</text><rect x="32" y="230" width="896" height="92" rx="14" fill="white"/><rect x="32" y="230" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="264" font-size="24" font-weight="600" fill="#17475a">Qwen-Drive · 驾驶感知与规划</text><text x="57" y="297" font-size="19" fill="#4d6070">视觉语言骨干 + BEV 感知头 + 规划专家 → 轨迹</text><rect x="32" y="340" width="896" height="92" rx="14" fill="white"/><rect x="32" y="340" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="374" font-size="24" font-weight="600" fill="#17475a">K2 Horizon · 通用语言模型家族</text><text x="57" y="407" font-size="19" fill="#4d6070">不同参数规模 → 按任务、内存和开放资源选择版本</text></g></svg>