<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>本周 AI 进展：看四种变化</title><rect width="960" height="600" rx="24" fill="#f3f6fa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="55" font-size="30" font-weight="700" fill="#12283e">本周 AI 进展：看四种变化</text><text x="40" y="91" font-size="18" fill="#506477">编辑归纳示意；不表示事件规模、市场份额或性能排序</text><rect x="32" y="120" width="896" height="92" rx="14" fill="white"/><rect x="32" y="120" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="154" font-size="24" font-weight="600" fill="#17475a">研究流程</text><text x="57" y="187" font-size="19" fill="#4d6070">代码与实验可以加速，但选题、验证和判断仍需单独评估</text><rect x="32" y="230" width="896" height="92" rx="14" fill="white"/><rect x="32" y="230" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="264" font-size="24" font-weight="600" fill="#17475a">产品与基础设施</text><text x="57" y="297" font-size="19" fill="#4d6070">通用模型、受限安全模型，以及开放模型平台的产业变化</text><rect x="32" y="340" width="896" height="92" rx="14" fill="white"/><rect x="32" y="340" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="374" font-size="24" font-weight="600" fill="#17475a">数据与科学应用</text><text x="57" y="407" font-size="19" fill="#4d6070">语音对话、网页检索、实时卫星观测进入不同任务</text><rect x="32" y="450" width="896" height="92" rx="14" fill="white"/><rect x="32" y="450" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="484" font-size="24" font-weight="600" fill="#17475a">端侧计算</text><text x="57" y="517" font-size="19" fill="#4d6070">WebGPU 内核把一部分推理工作移到浏览器和本地设备</text></g></svg>