<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>MaxSim：每个查询向量找一次最佳匹配</title><rect width="960" height="600" rx="24" fill="#f3f6fa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="55" font-size="30" font-weight="700" fill="#12283e">MaxSim：每个查询向量找一次最佳匹配</text><text x="40" y="91" font-size="18" fill="#506477">教学用二维单位向量；真实模型会学习高维表示</text><rect x="32" y="120" width="896" height="92" rx="14" fill="white"/><rect x="32" y="120" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="154" font-size="24" font-weight="600" fill="#17475a">查询 Q = [(1, 0), (0, 1)]</text><text x="57" y="187" font-size="19" fill="#4d6070">可以直观理解为“同时关心两个方面”，不是实际词向量</text><rect x="32" y="230" width="896" height="92" rx="14" fill="white"/><rect x="32" y="230" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="264" font-size="24" font-weight="600" fill="#17475a">文档 A = [(1, 0), (0, 1)]</text><text x="57" y="297" font-size="19" fill="#4d6070">第一个查询最大相似度 1，第二个也是 1 → 总分 2.00</text><rect x="32" y="340" width="896" height="92" rx="14" fill="white"/><rect x="32" y="340" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="374" font-size="24" font-weight="600" fill="#17475a">文档 C = [(0.6, 0.8)]</text><text x="57" y="407" font-size="19" fill="#4d6070">两个查询的最大相似度分别为 0.6 和 0.8 → 总分 1.40</text><rect x="32" y="450" width="896" height="92" rx="14" fill="white"/><rect x="32" y="450" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="484" font-size="24" font-weight="600" fill="#17475a">文档 B = [(1, 0), (1, 0)]</text><text x="57" y="517" font-size="19" fill="#4d6070">重复覆盖第一个方面，第二个仍是 0 → 总分 1.00</text></g></svg>