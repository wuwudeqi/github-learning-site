<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img"><title>一个科研应用的工程链路</title><rect width="960" height="490" rx="24" fill="#f3f6fa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="55" font-size="30" font-weight="700" fill="#12283e">一个科研应用的工程链路</text><text x="40" y="91" font-size="18" fill="#506477">职责示意；三个项目彼此独立，并非官方集成架构</text><rect x="32" y="120" width="896" height="92" rx="14" fill="white"/><rect x="32" y="120" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="154" font-size="24" font-weight="600" fill="#17475a">获取资料 · Firecrawl</text><text x="57" y="187" font-size="19" fill="#4d6070">网页内容 → 可处理文本；采集质量与许可需自行检查</text><rect x="32" y="230" width="896" height="92" rx="14" fill="white"/><rect x="32" y="230" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="264" font-size="24" font-weight="600" fill="#17475a">本地试验 · Ollama</text><text x="57" y="297" font-size="19" fill="#4d6070">本机运行模型 → 建立任务基线；模型许可单独核对</text><rect x="32" y="340" width="896" height="92" rx="14" fill="white"/><rect x="32" y="340" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="374" font-size="24" font-weight="600" fill="#17475a">提供服务 · vLLM</text><text x="57" y="407" font-size="19" fill="#4d6070">模型服务 → 并发与吞吐评估；测量显存、延迟和失败率</text></g></svg>