<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img"><title>两个研究问题：好结果从哪里来？</title><rect width="960" height="490" rx="24" fill="#f3f6fa"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="55" font-size="30" font-weight="700" fill="#12283e">两个研究问题：好结果从哪里来？</text><text x="40" y="91" font-size="18" fill="#506477">基于原论文的编辑图解；非作者原图，非实验结果</text><rect x="32" y="120" width="896" height="92" rx="14" fill="white"/><rect x="32" y="120" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="154" font-size="24" font-weight="600" fill="#17475a">TailRL：生成更值得挑选的候选</text><text x="57" y="187" font-size="19" fill="#4d6070">奖励阈值 → 超过阈值的概率 → 重分配训练优势权重</text><rect x="32" y="230" width="896" height="92" rx="14" fill="white"/><rect x="32" y="230" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="264" font-size="24" font-weight="600" fill="#17475a">SAGE：在不确定时请求示范</text><text x="57" y="297" font-size="19" fill="#4d6070">策略熵高 → 请求 VLM 老师 → 单独的模仿学习分支</text><rect x="32" y="340" width="896" height="92" rx="14" fill="white"/><rect x="32" y="340" width="7" height="92" rx="3" fill="#16877e"/><text x="57" y="374" font-size="24" font-weight="600" fill="#17475a">共同的复现要求</text><text x="57" y="407" font-size="19" fill="#4d6070">记录采样与查询预算；报告失败案例，不能只展示最好结果</text></g></svg>