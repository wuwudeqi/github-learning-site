<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>合成矩阵量化实验</title><style>body{margin:0;background:#f4f7fb;color:#18324c;font-family:system-ui,"PingFang SC",sans-serif}main{width:1100px;padding:48px}h1{font-size:34px;margin:0 0 12px}p{font-size:21px;margin:12px 0}svg{background:white;border-radius:20px}small{font-size:18px} .note{padding:14px 0;font-size:20px}</style><main><h1>全精度等价，量化误差不同</h1><p>本机CPU · 合成32×8矩阵 · 每行对称4bit舍入 · 64例验证 / 64例测试</p><svg id="plot" width="1100" height="540" viewBox="0 0 1100 540"></svg><p class="note">验证集选 t=1；测试 KL：0.023809 → 0.001060。此结果不代表真实模型收益。</p><small>全精度最大概率差：3.33×10⁻¹⁶（浮点误差） · seed=20260929 · 2026-09-29实测</small></main><script>
const data=[{"t": 0, "validationKL": 0.018124101034364473, "testKL": 0.023809214297036002}, {"t": 0.5, "validationKL": 0.006116972386494429, "testKL": 0.00721482835504493}, {"t": 1, "validationKL": 0.0009956764187628048, "testKL": 0.0010599961793918912}, {"t": 1.5, "validationKL": 0.006556991677071941, "testKL": 0.00780810713964112}, {"t": 2, "validationKL": 0.021145559796478614, "testKL": 0.025414081882334568}, {"t": 4, "validationKL": 0.1602962117528859, "testKL": 0.18563419367599518}];const svg=document.querySelector('svg');
const put=(name,attrs,text='')=>{const e=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));e.textContent=text;svg.appendChild(e);};
const x=i=>100+i*174,y=v=>430-v/0.2*340;
for(const v of [0,.05,.1,.15,.2]){put('line',{x1:85,x2:1000,y1:y(v),y2:y(v),stroke:'#dce4ed'});put('text',{x:70,y:y(v)+6,'text-anchor':'end','font-size':18,fill:'#53687c'},v.toFixed(2));}
put('text',{x:80,y:40,'font-size':22,fill:'#18324c'},'平均 KL（越小越接近原始概率）');
[['validationKL','#718cad','验证集'],['testKL','#007f7c','测试集']].forEach(([key,color,label],n)=>{put('polyline',{points:data.map((d,i)=>`${x(i)},${y(d[key])}`).join(' '),fill:'none',stroke:color,'stroke-width':4,'stroke-dasharray':n?'':'8 5'});data.forEach((d,i)=>put('circle',{cx:x(i),cy:y(d[key]),r:5,fill:color}));put('text',{x:730+n*160,y:80,'font-size':20,fill:color},label);});
data.forEach((d,i)=>put('text',{x:x(i),y:468,'text-anchor':'middle','font-size':21,fill:'#18324c'},'t='+d.t));
put('text',{x:450,y:517,'font-size':21,fill:'#53687c'},'权重共同偏移的倍数 t');
</script></html>
