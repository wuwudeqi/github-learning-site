<svg viewBox="0 0 800 722" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"><title id="title">前台继续听说，后台继续处理任务</title><desc id="desc">纵向只表示先后顺序，间距不是延迟测量</desc><style>text{font-family:&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"></path></marker></defs><rect width="800" height="722" fill="#faf8f2"></rect><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">前台继续听说，后台继续处理任务</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">纵向只表示先后顺序，间距不是延迟测量</text><text x="101" y="135" font-size="26" fill="#14796e" font-weight="600" text-anchor="middle">用户</text><line x1="101" y1="159" x2="101" y2="639" stroke="#d3dcd8" stroke-width="2" stroke-dasharray="6 6"></line><text x="390" y="135" font-size="26" fill="#14796e" font-weight="600" text-anchor="middle">GPT-Live-1</text><line x1="390" y1="159" x2="390" y2="639" stroke="#d3dcd8" stroke-width="2" stroke-dasharray="6 6"></line><text x="674" y="135" font-size="26" fill="#14796e" font-weight="600" text-anchor="middle">后台任务</text><line x1="674" y1="159" x2="674" y2="639" stroke="#d3dcd8" stroke-width="2" stroke-dasharray="6 6"></line><line x1="109" y1="209" x2="378" y2="209" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"></line><text x="245.5" y="196" font-size="24" fill="#14796e" font-weight="400" text-anchor="middle">提出问题</text><line x1="398" y1="279" x2="662" y2="279" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"></line><text x="532.0" y="266" font-size="24" fill="#14796e" font-weight="400" text-anchor="middle">委派推理 / 工具</text><rect x="656" y="287" width="36" height="290" rx="3" fill="#e5edf3" stroke="#28638a" stroke-width="2"></rect><line x1="382" y1="354" x2="113" y2="354" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"></line><text x="245.5" y="341" font-size="24" fill="#14796e" font-weight="400" text-anchor="middle">口头回应</text><line x1="109" y1="422" x2="378" y2="422" stroke="#b4563e" stroke-width="3" marker-end="url(#arrow)"></line><text x="245.5" y="409" font-size="24" fill="#b4563e" font-weight="400" text-anchor="middle">用户插话</text><text x="390" y="471" font-size="24" fill="#b4563e" font-weight="600" text-anchor="middle">停下当前发言</text><text x="674" y="467" font-size="23" fill="#28638a" font-weight="400" text-anchor="middle">仍在执行</text><line x1="666" y1="569" x2="402" y2="569" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"></line><text x="532.0" y="556" font-size="24" fill="#14796e" font-weight="400" text-anchor="middle">任务结果</text><line x1="382" y1="632" x2="113" y2="632" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"></line><text x="245.5" y="619" font-size="24" fill="#14796e" font-weight="400" text-anchor="middle">结合结果回答</text><text x="32" y="698" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">示例交互顺序；前台语音和后台模型 / 工具分别承担工作。</text></svg>
