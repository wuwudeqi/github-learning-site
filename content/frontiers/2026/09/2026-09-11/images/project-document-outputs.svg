<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 698" role="img" aria-labelledby="title desc"><title id="title">归档扫描件与解析论文，输出结构不同</title><desc id="desc">按需要的结果选工具；两条路线不是同一条必经流水线</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="698" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">归档扫描件与解析论文，输出结构不同</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">按需要的结果选工具；两条路线不是同一条必经流水线</text><text x="32" y="139" font-size="26" fill="#14796e" font-weight="600" text-anchor="start">扫描件 / 普通文档</text><rect x="112" y="159" width="174" height="144" rx="3" fill="white" stroke="#d3dcd8" stroke-width="2"/><line x1="131" y1="186" x2="267" y2="186" stroke="#14796e" stroke-width="3"/><line x1="131" y1="208" x2="235" y2="208" stroke="#14796e" stroke-width="3"/><line x1="131" y1="230" x2="267" y2="230" stroke="#14796e" stroke-width="3"/><line x1="131" y1="252" x2="235" y2="252" stroke="#14796e" stroke-width="3"/><line x1="131" y1="274" x2="267" y2="274" stroke="#14796e" stroke-width="3"/><line x1="199" y1="310" x2="199" y2="351" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><text x="416" y="139" font-size="26" fill="#28638a" font-weight="600" text-anchor="start">含文本的论文 PDF</text><rect x="496" y="159" width="174" height="144" rx="3" fill="white" stroke="#d3dcd8" stroke-width="2"/><line x1="515" y1="186" x2="651" y2="186" stroke="#28638a" stroke-width="3"/><line x1="515" y1="208" x2="619" y2="208" stroke="#28638a" stroke-width="3"/><line x1="515" y1="230" x2="651" y2="230" stroke="#28638a" stroke-width="3"/><line x1="515" y1="252" x2="619" y2="252" stroke="#28638a" stroke-width="3"/><line x1="515" y1="274" x2="651" y2="274" stroke="#28638a" stroke-width="3"/><line x1="583" y1="310" x2="583" y2="351" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="364" width="352" height="73" rx="10" fill="#e8f2ec" stroke="#d3dcd8" stroke-width="2"/><text x="208.0" y="409.5" font-size="26" fill="#14796e" font-weight="600" text-anchor="middle">Paperless-ngx</text><rect x="416" y="364" width="352" height="73" rx="10" fill="#e5edf3" stroke="#d3dcd8" stroke-width="2"/><text x="592.0" y="409.5" font-size="26" fill="#28638a" font-weight="600" text-anchor="middle">GROBID</text><line x1="208" y1="444" x2="208" y2="483" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><line x1="592" y1="444" x2="592" y2="483" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="495" width="352" height="134" rx="10" fill="white" stroke="#14796e" stroke-width="2"/><text x="53" y="534" font-size="28" fill="#14796e" font-weight="600" text-anchor="start">可检索档案</text><text x="53" y="575" font-size="26" fill="#20343b" font-weight="400" text-anchor="start">OCR 文本 / 标签</text><text x="53" y="611" font-size="24" fill="#20343b" font-weight="400" text-anchor="start">原始文件与归档记录</text><rect x="416" y="495" width="352" height="134" rx="10" fill="white" stroke="#28638a" stroke-width="2"/><text x="437" y="534" font-size="28" fill="#28638a" font-weight="600" text-anchor="start">TEI XML 结构</text><text x="437" y="575" font-size="26" fill="#20343b" font-weight="400" text-anchor="start">标题 / 作者 / 章节</text><text x="437" y="611" font-size="24" fill="#20343b" font-weight="400" text-anchor="start">参考文献及其字段</text><text x="32" y="674" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">GROBID 不是扫描件 OCR 的替代；复杂表格和公式都需抽查。</text></svg>
