<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 795" role="img" aria-labelledby="title desc"><title id="title">AgentGrad：用干预找出该改谁的提示</title><desc id="desc">训练时用参考答案或约束构造提示；部署时移除提示</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="795" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">AgentGrad：用干预找出该改谁的提示</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">训练时用参考答案或约束构造提示；部署时移除提示</text><text x="32" y="143" font-size="26" fill="#28638a" font-weight="600" text-anchor="start">先运行，找到失败样本</text><rect x="32" y="163" width="213" height="76" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="138.5" y="210.0" font-size="26" fill="#20343b" font-weight="600" text-anchor="middle">Agent A</text><line x1="251" y1="201" x2="272" y2="201" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><rect x="279" y="163" width="213" height="76" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="385.5" y="210.0" font-size="26" fill="#20343b" font-weight="600" text-anchor="middle">Agent B</text><line x1="498" y1="201" x2="519" y2="201" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><rect x="526" y="163" width="213" height="76" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="632.5" y="210.0" font-size="26" fill="#20343b" font-weight="600" text-anchor="middle">Agent C</text><text x="580" y="282" font-size="25" fill="#b4563e" font-weight="600" text-anchor="start">最终失败</text><path d="M631 297 H140" fill="none" stroke="#b4563e" stroke-width="3" marker-end="url(#arrow)"/><text x="76" y="338" font-size="26" fill="#b4563e" font-weight="400" text-anchor="start">按 C → B → A，一次只干预一个 Agent</text><rect x="32" y="373" width="325" height="102" rx="10" fill="#f5e3d8" stroke="#d3dcd8" stroke-width="2"/><text x="194.5" y="407" font-size="25" fill="#b4563e" font-weight="600" text-anchor="middle">注入训练提示</text><text x="194.5" y="440" font-size="23" fill="#596c73" font-weight="400" text-anchor="middle">引导该步产生修正输出</text><line x1="363" y1="424" x2="414" y2="424" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><rect x="427" y="373" width="341" height="102" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="597.5" y="407" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">重跑并检查最终结果</text><text x="597.5" y="440" font-size="23" fill="#596c73" font-weight="400" text-anchor="middle">仍失败：尝试前一个 Agent</text><line x1="594" y1="482" x2="594" y2="531" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><text x="613" y="520" font-size="24" fill="#14796e" font-weight="400" text-anchor="start">若成功</text><rect x="32" y="543" width="736" height="93" rx="10" fill="#e8f2ec" stroke="#d3dcd8" stroke-width="2"/><text x="400.0" y="577" font-size="27" fill="#14796e" font-weight="600" text-anchor="middle">该步原输出 ↔ 修正输出（伪标签）</text><text x="400.0" y="610" font-size="23" fill="#596c73" font-weight="400" text-anchor="middle">让反馈指向具体行为差异</text><line x1="400" y1="641" x2="400" y2="673" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><text x="400" y="710" font-size="27" fill="#14796e" font-weight="600" text-anchor="middle">反馈按语义归并 → 更新提示词 → 验证</text><text x="32" y="771" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">这里优化的是提示词；“文本梯度”是自然语言修改建议。</text></svg>
