<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 687" role="img" aria-labelledby="title desc"><title id="title">YuE：可编辑的乐谱夹在文字和声音之间</title><desc id="desc">音符与和弦为本站虚构示例，只解释操作位置</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="687" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">YuE：可编辑的乐谱夹在文字和声音之间</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">音符与和弦为本站虚构示例，只解释操作位置</text><rect x="32" y="120" width="736" height="78" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="400.0" y="168.0" font-size="26" fill="#20343b" font-weight="600" text-anchor="middle">歌词 + 风格提示</text><line x1="400" y1="205" x2="400" y2="250" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="260" width="736" height="196" rx="10" fill="white" stroke="#14796e" stroke-width="2"/><text x="54" y="300" font-size="27" fill="#14796e" font-weight="600" text-anchor="start">符号规划：旋律 / 和弦</text><line x1="60" y1="335" x2="734" y2="335" stroke="#d3dcd8" stroke-width="2"/><line x1="60" y1="350" x2="734" y2="350" stroke="#d3dcd8" stroke-width="2"/><line x1="60" y1="365" x2="734" y2="365" stroke="#d3dcd8" stroke-width="2"/><line x1="60" y1="380" x2="734" y2="380" stroke="#d3dcd8" stroke-width="2"/><line x1="60" y1="395" x2="734" y2="395" stroke="#d3dcd8" stroke-width="2"/><circle cx="90" cy="350" r="7" fill="#28638a" stroke="#28638a" stroke-width="2"/><line x1="96" y1="350" x2="96" y2="313" stroke="#28638a" stroke-width="2"/><circle cx="177" cy="380" r="7" fill="#28638a" stroke="#28638a" stroke-width="2"/><line x1="183" y1="380" x2="183" y2="343" stroke="#28638a" stroke-width="2"/><circle cx="264" cy="365" r="7" fill="#28638a" stroke="#28638a" stroke-width="2"/><line x1="270" y1="365" x2="270" y2="328" stroke="#28638a" stroke-width="2"/><circle cx="351" cy="395" r="7" fill="#b4563e" stroke="#b4563e" stroke-width="2"/><line x1="357" y1="395" x2="357" y2="358" stroke="#b4563e" stroke-width="2"/><circle cx="438" cy="335" r="7" fill="#28638a" stroke="#28638a" stroke-width="2"/><line x1="444" y1="335" x2="444" y2="298" stroke="#28638a" stroke-width="2"/><circle cx="525" cy="365" r="7" fill="#28638a" stroke="#28638a" stroke-width="2"/><line x1="531" y1="365" x2="531" y2="328" stroke="#28638a" stroke-width="2"/><circle cx="612" cy="380" r="7" fill="#28638a" stroke="#28638a" stroke-width="2"/><line x1="618" y1="380" x2="618" y2="343" stroke="#28638a" stroke-width="2"/><circle cx="699" cy="350" r="7" fill="#28638a" stroke="#28638a" stroke-width="2"/><line x1="705" y1="350" x2="705" y2="313" stroke="#28638a" stroke-width="2"/><text x="75" y="433" font-size="25" fill="#28638a" font-weight="400" text-anchor="start">C</text><text x="300" y="433" font-size="25" fill="#b4563e" font-weight="600" text-anchor="start">Am → F</text><text x="625" y="433" font-size="25" fill="#28638a" font-weight="400" text-anchor="start">G</text><text x="456" y="493" font-size="26" fill="#b4563e" font-weight="400" text-anchor="start">在这里修改，再合成</text><path d="M745 397 H784 V508 H718 V460" fill="none" stroke="#b4563e" stroke-width="3" marker-end="url(#arrow)"/><line x1="400" y1="460" x2="400" y2="529" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="542" width="736" height="85" rx="10" fill="#e8f2ec" stroke="#d3dcd8" stroke-width="2"/><text x="400.0" y="593.5" font-size="26" fill="#14796e" font-weight="600" text-anchor="middle">歌曲合成 → 人声与伴奏</text><text x="32" y="663" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">图中展示控制点，不代表模型已成功生成所示音乐。</text></svg>
