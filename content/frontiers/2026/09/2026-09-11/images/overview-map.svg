<svg viewBox="0 0 1000 580" role="img" aria-label="09.11 阅读地图" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif}</style><rect width="1000" height="580" fill="#f5f2eb"></rect><text x="42" y="59" fill="#182b3a" font-size="33" font-weight="650">09.11 阅读地图</text><text x="42" y="96" fill="#596a75" font-size="19" font-weight="400">按正在做的事情选入口；模型与项目的使用条件见正文。</text><rect x="42" y="132" width="445" height="118" rx="14" fill="#ffffff" stroke="#d4dcd9"></rect><text x="62" y="166" fill="#236580" font-size="24" font-weight="600">15 条 AI 动态</text><text x="62" y="199" fill="#182b3a" font-size="22" font-weight="400">先看升级与开放范围</text><text x="62" y="228" fill="#596a75" font-size="18" font-weight="400">5 条详解 + 10 条速读</text><rect x="507" y="132" width="445" height="118" rx="14" fill="#ffffff" stroke="#d4dcd9"></rect><text x="527" y="166" fill="#236580" font-size="24" font-weight="600">6 项开放模型</text><text x="527" y="199" fill="#182b3a" font-size="22" font-weight="400">先核对许可和硬件</text><text x="527" y="228" fill="#596a75" font-size="18" font-weight="400">音乐 / 图像 / 语音 / 视觉</text><rect x="42" y="269" width="445" height="118" rx="14" fill="#ffffff" stroke="#d4dcd9"></rect><text x="62" y="303" fill="#236580" font-size="24" font-weight="600">6 篇论文</text><text x="62" y="336" fill="#182b3a" font-size="22" font-weight="400">从方法走到实验条件</text><text x="62" y="365" fill="#596a75" font-size="18" font-weight="400">提示 / 阅读 / 训练 / 评测</text><rect x="507" y="269" width="445" height="118" rx="14" fill="#ffffff" stroke="#d4dcd9"></rect><text x="527" y="303" fill="#236580" font-size="24" font-weight="600">10 个开源项目</text><text x="527" y="336" fill="#182b3a" font-size="22" font-weight="400">解决资料与应用问题</text><text x="527" y="365" fill="#596a75" font-size="18" font-weight="400">归档 / RAG / 创作 / 开发</text><rect x="42" y="406" width="445" height="118" rx="14" fill="#ffffff" stroke="#d4dcd9"></rect><text x="62" y="440" fill="#236580" font-size="24" font-weight="600">1 个本地实验</text><text x="62" y="473" fill="#182b3a" font-size="22" font-weight="400">配对比较两次运行</text><text x="62" y="502" fill="#596a75" font-size="18" font-weight="400">均分提升，也要回看退步</text><rect x="507" y="406" width="445" height="118" rx="14" fill="#ffffff" stroke="#d4dcd9"></rect><text x="527" y="440" fill="#236580" font-size="24" font-weight="600">每个结论都有边界</text><text x="527" y="473" fill="#182b3a" font-size="22" font-weight="400">公告、论文与本站运行分开</text><text x="527" y="502" fill="#596a75" font-size="18" font-weight="400">原始链接 + 站内阅读卡</text><text x="42" y="567" fill="#596a75" font-size="16" font-weight="400">原创阅读示意 · 前沿编辑</text></svg>
