<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 782" role="img" aria-labelledby="title desc"><title id="title">评测改造：隔离答案，再修正不一致的题</title><desc id="desc">两个改变分别影响分数，不能把它们混成模型能力变化</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="782" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">评测改造：隔离答案，再修正不一致的题</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">两个改变分别影响分数，不能把它们混成模型能力变化</text><rect x="32" y="122" width="736" height="154" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="56" y="159" font-size="26" fill="#28638a" font-weight="600" text-anchor="start">正常工作区</text><rect x="56" y="181" width="326" height="67" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="219.0" y="223.5" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">仓库代码 / 正常依赖</text><line x1="389" y1="215" x2="456" y2="215" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><rect x="466" y="181" width="278" height="67" rx="10" fill="#e8f2ec" stroke="#d3dcd8" stroke-width="2"/><text x="605.0" y="223.5" font-size="26" fill="#14796e" font-weight="600" text-anchor="middle">代码 Agent</text><rect x="32" y="339" width="736" height="146" rx="10" fill="#f6ece5" stroke="#b4563e" stroke-width="2" stroke-dasharray="7 6"/><text x="56" y="379" font-size="27" fill="#b4563e" font-weight="600" text-anchor="start">隐藏区：答案 / 隐藏评测信息</text><text x="56" y="427" font-size="26" fill="#b4563e" font-weight="400" text-anchor="start">限制文件与网络泄漏通道</text><path d="M602 337 V282" fill="none" stroke="#b4563e" stroke-width="3" marker-end="url(#arrow)"/><line x1="579" y1="295" x2="625" y2="329" stroke="#b4563e" stroke-width="4"/><line x1="579" y1="329" x2="625" y2="295" stroke="#b4563e" stroke-width="4"/><text x="80" y="315" font-size="24" fill="#28638a" font-weight="400" text-anchor="start">保留正常工程能力</text><line x1="400" y1="495" x2="400" y2="540" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="551" width="736" height="138" rx="10" fill="white" stroke="#14796e" stroke-width="2"/><text x="56" y="591" font-size="27" fill="#14796e" font-weight="600" text-anchor="start">另做题目审查：题意 ↔ 接口 ↔ 测试</text><text x="56" y="633" font-size="26" fill="#20343b" font-weight="400" text-anchor="start">修正矛盾后，在隔离环境中重新评测</text><text x="32" y="758" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">比较原始 / 隔离 / 修订三种设置；图中不混用汇总分。</text></svg>
