<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 732" role="img" aria-labelledby="title desc"><title id="title">Opik：从最终错答回到出错的调用</title><desc id="desc">虚构排查示例，不是本站运行日志或产品截图</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="732" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">Opik：从最终错答回到出错的调用</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">虚构排查示例，不是本站运行日志或产品截图</text><rect x="32" y="120" width="736" height="349" rx="10" fill="white" stroke="#28638a" stroke-width="2"/><text x="55" y="160" font-size="29" fill="#28638a" font-weight="600" text-anchor="start">一次问答 trace</text><line x1="88" y1="194" x2="88" y2="426" stroke="#d3dcd8" stroke-width="3"/><circle cx="88" cy="207" r="8" fill="#b4563e" stroke="#b4563e" stroke-width="2"/><line x1="102" y1="207" x2="145" y2="207" stroke="#b4563e" stroke-width="3" marker-end="url(#arrow)"/><text x="159" y="217" font-size="27" fill="#b4563e" font-weight="500" text-anchor="start">检索：没有取回文档 2</text><circle cx="88" cy="303" r="8" fill="#28638a" stroke="#28638a" stroke-width="2"/><line x1="102" y1="303" x2="145" y2="303" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><text x="159" y="313" font-size="27" fill="#28638a" font-weight="500" text-anchor="start">生成：只看见文档 1</text><circle cx="88" cy="399" r="8" fill="#b4563e" stroke="#b4563e" stroke-width="2"/><line x1="102" y1="399" x2="145" y2="399" stroke="#b4563e" stroke-width="3" marker-end="url(#arrow)"/><text x="159" y="409" font-size="27" fill="#b4563e" font-weight="500" text-anchor="start">评分：依赖链回答不完整</text><path d="M695 403 H781 V209 H743" fill="none" stroke="#b4563e" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="510" font-size="28" fill="#14796e" font-weight="600" text-anchor="start">先修检索，再检查答案是否恢复。</text><line x1="399" y1="524" x2="399" y2="566" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="580" width="736" height="93" rx="10" fill="#e8f2ec" stroke="#d3dcd8" stroke-width="2"/><text x="400.0" y="614" font-size="27" fill="#14796e" font-weight="600" text-anchor="middle">把失败样本加入评测数据集</text><text x="400.0" y="647" font-size="23" fill="#596c73" font-weight="400" text-anchor="middle">固定 case id，再比较新旧实验</text><text x="32" y="708" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">调用链帮助定位线索；自动评分与提取到的证据仍需复核。</text></svg>
