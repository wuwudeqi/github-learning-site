<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 775" role="img" aria-labelledby="title desc"><title id="title">Agents API：执行循环和环境分开选</title><desc id="desc">箭头表示一次工具调用；长任务会重复这一循环</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="775" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">Agents API：执行循环和环境分开选</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">箭头表示一次工具调用；长任务会重复这一循环</text><rect x="32" y="118" width="192" height="80" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="128.0" y="167.0" font-size="26" fill="#20343b" font-weight="600" text-anchor="middle">任务 / 文件</text><line x1="229" y1="158" x2="290" y2="158" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><rect x="304" y="111" width="464" height="364" rx="10" fill="#e8f2ec" stroke="#14796e" stroke-width="2" stroke-dasharray="7 6"/><text x="326" y="150" font-size="26" fill="#14796e" font-weight="600" text-anchor="start">OpenAI 托管的执行框架</text><rect x="330" y="185" width="412" height="83" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="536.0" y="219" font-size="26" fill="#20343b" font-weight="600" text-anchor="middle">模型决定下一步</text><text x="536.0" y="252" font-size="23" fill="#596c73" font-weight="400" text-anchor="middle">继续调用工具，或给出结果</text><line x1="534" y1="273" x2="534" y2="316" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="324" width="412" height="113" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="536.0" y="358" font-size="26" fill="#20343b" font-weight="600" text-anchor="middle">会话状态持续保留</text><text x="536.0" y="391" font-size="23" fill="#596c73" font-weight="400" text-anchor="middle">工具结果 / 上下文压缩 / 产物</text><path d="M325 381 H279 V230 H324" fill="none" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="347" font-size="25" fill="#14796e" font-weight="400" text-anchor="start">结果返回</text><text x="48" y="380" font-size="25" fill="#14796e" font-weight="400" text-anchor="start">继续推理</text><path d="M747 222 H783 V521 H409 V546" fill="none" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><text x="484" y="509" font-size="25" fill="#28638a" font-weight="400" text-anchor="start">发出工具操作</text><rect x="32" y="554" width="736" height="142" rx="10" fill="white" stroke="#28638a" stroke-width="2"/><text x="55" y="592" font-size="26" fill="#28638a" font-weight="600" text-anchor="start">执行环境：按任务选择</text><text x="55" y="632" font-size="26" fill="#20343b" font-weight="400" text-anchor="start">OpenAI 托管 / 自有环境 / 合作伙伴</text><text x="55" y="671" font-size="25" fill="#20343b" font-weight="400" text-anchor="start">代码、浏览器或其他工具在所选环境里运行</text><path d="M80 552 V508 H284 V411 H324" fill="none" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><text x="33" y="738" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">边界示意；接入自有环境不等于自托管整套执行框架。</text></svg>
