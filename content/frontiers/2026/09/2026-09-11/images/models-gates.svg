<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" role="img" aria-label="六项权重的使用条件"><style>text{font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif}</style><rect width="1000" height="625" fill="#f5f2eb"/><text x="42" y="59" fill="#182b3a" font-size="33" font-weight="650">六项权重的使用条件</text><text x="42" y="96" fill="#596a75" font-size="19" font-weight="400">表中硬件来自官方参考配置；未在本站安装或测速。</text><rect x="42" y="123" width="915" height="55" rx="14" fill="#236580" stroke="#236580"/><text x="60" y="159" fill="#ffffff" font-size="22" font-weight="600">模型</text><text x="402" y="159" fill="#ffffff" font-size="22" font-weight="600">许可范围</text><text x="695" y="159" fill="#ffffff" font-size="22" font-weight="600">运行条件</text><rect x="42" y="188" width="915" height="53" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="60" y="223" fill="#182b3a" font-size="20" font-weight="400">YuE2-3B</text><text x="402" y="223" fill="#236580" font-size="19" font-weight="400">非商业 · CC BY-NC</text><text x="695" y="223" fill="#182b3a" font-size="17" font-weight="400">24 GB NVIDIA GPU</text><rect x="42" y="251" width="915" height="53" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="60" y="286" fill="#182b3a" font-size="20" font-weight="400">LingBot-World 2.0</text><text x="402" y="286" fill="#236580" font-size="19" font-weight="400">非商业 · CC BY-NC-SA</text><text x="695" y="286" fill="#182b3a" font-size="17" font-weight="400">小模型参考脚本：4 GPU</text><rect x="42" y="314" width="915" height="53" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="60" y="349" fill="#182b3a" font-size="20" font-weight="400">North Small Translate</text><text x="402" y="349" fill="#236580" font-size="19" font-weight="400">非商业 · CC BY-NC</text><text x="695" y="349" fill="#182b3a" font-size="17" font-weight="400">BF16 示例：8 × H100</text><rect x="42" y="377" width="915" height="53" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="60" y="412" fill="#182b3a" font-size="20" font-weight="400">LLaDA-Image</text><text x="402" y="412" fill="#236580" font-size="19" font-weight="400">Apache-2.0</text><text x="695" y="412" fill="#182b3a" font-size="17" font-weight="400">CUDA；最低显存未核实</text><rect x="42" y="440" width="915" height="53" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="60" y="475" fill="#182b3a" font-size="20" font-weight="400">Breeze TTS 2</text><text x="402" y="475" fill="#236580" font-size="19" font-weight="400">研究 / 非商业专用许可</text><text x="695" y="475" fill="#182b3a" font-size="17" font-weight="400">eager 最低建议 12 GB</text><rect x="42" y="503" width="915" height="53" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="60" y="538" fill="#182b3a" font-size="20" font-weight="400">Ling-3.0-flash-VL</text><text x="402" y="538" fill="#236580" font-size="19" font-weight="400">MIT</text><text x="695" y="538" fill="#182b3a" font-size="17" font-weight="400">参考：4 × 141 GB 级 GPU</text><text x="42" y="600" fill="#596a75" font-size="20" font-weight="400">激活参数影响计算量，不能代替完整权重与缓存的显存估算。</text></svg>
