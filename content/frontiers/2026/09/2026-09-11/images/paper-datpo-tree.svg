<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 799" role="img" aria-labelledby="title desc"><title id="title">DATPO：把训练探索留给更需要分叉的题</title><desc id="desc">共享前缀；从高熵句子的起点分叉，比较同级分支差异</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="799" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">DATPO：把训练探索留给更需要分叉的题</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">共享前缀；从高熵句子的起点分叉，比较同级分支差异</text><text x="32" y="139" font-size="26" fill="#28638a" font-weight="600" text-anchor="start">容易题：较少探索</text><text x="417" y="139" font-size="26" fill="#14796e" font-weight="600" text-anchor="start">困难题：更多探索</text><line x1="32" y1="162" x2="768" y2="162" stroke="#d3dcd8" stroke-width="2"/><circle cx="202" cy="203" r="10" fill="#28638a" stroke="#28638a" stroke-width="2"/><line x1="202" y1="215" x2="202" y2="293" stroke="#28638a" stroke-width="4"/><circle cx="202" cy="305" r="10" fill="#28638a" stroke="#28638a" stroke-width="2"/><line x1="202" y1="318" x2="119" y2="398" stroke="#28638a" stroke-width="3"/><circle cx="119" cy="410" r="9" fill="#28638a" stroke="#28638a" stroke-width="2"/><line x1="202" y1="318" x2="285" y2="398" stroke="#28638a" stroke-width="3"/><circle cx="285" cy="410" r="9" fill="#28638a" stroke="#28638a" stroke-width="2"/><circle cx="578" cy="203" r="10" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="578" y1="215" x2="578" y2="293" stroke="#14796e" stroke-width="4"/><circle cx="578" cy="305" r="10" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="578" y1="318" x2="444" y2="398" stroke="#14796e" stroke-width="3"/><circle cx="444" cy="410" r="9" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="444" y1="422" x2="410" y2="491" stroke="#14796e" stroke-width="2"/><circle cx="410" cy="501" r="6" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="444" y1="422" x2="478" y2="491" stroke="#14796e" stroke-width="2"/><circle cx="478" cy="501" r="6" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="578" y1="318" x2="578" y2="398" stroke="#14796e" stroke-width="3"/><circle cx="578" cy="410" r="9" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="578" y1="422" x2="544" y2="491" stroke="#14796e" stroke-width="2"/><circle cx="544" cy="501" r="6" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="578" y1="422" x2="612" y2="491" stroke="#14796e" stroke-width="2"/><circle cx="612" cy="501" r="6" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="578" y1="318" x2="712" y2="398" stroke="#14796e" stroke-width="3"/><circle cx="712" cy="410" r="9" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="712" y1="422" x2="678" y2="491" stroke="#14796e" stroke-width="2"/><circle cx="678" cy="501" r="6" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="712" y1="422" x2="746" y2="491" stroke="#14796e" stroke-width="2"/><circle cx="746" cy="501" r="6" fill="#14796e" stroke="#14796e" stroke-width="2"/><text x="48" y="264" font-size="24" fill="#28638a" font-weight="400" text-anchor="start">共享前缀</text><text x="420" y="263" font-size="24" fill="#14796e" font-weight="400" text-anchor="start">共享前缀</text><text x="32" y="558" font-size="24" fill="#596c73" font-weight="400" text-anchor="start">分支数量仅作概念示意，不是论文的固定超参数。</text><rect x="32" y="590" width="736" height="129" rx="10" fill="white" stroke="#14796e" stroke-width="2"/><text x="55" y="629" font-size="27" fill="#14796e" font-weight="600" text-anchor="start">同一分叉点的后续：看语义是否不同</text><text x="55" y="675" font-size="26" fill="#20343b" font-weight="400" text-anchor="start">可验证奖励 + 分支差异 → 调整训练信号</text><text x="32" y="775" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">总预算受控；避免把同一句话的近义改写当成新的解法。</text></svg>
