<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 759" role="img" aria-labelledby="title desc"><title id="title">文件行序可以变，样本身份不能变</title><desc id="desc">先校验，再按 id 配对；示意行取自本期六条合成样本</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="759" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">文件行序可以变，样本身份不能变</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">先校验，再按 id 配对；示意行取自本期六条合成样本</text><text x="32" y="140" font-size="27" fill="#28638a" font-weight="600" text-anchor="start">before.jsonl</text><text x="490" y="140" font-size="27" fill="#14796e" font-weight="600" text-anchor="start">after.jsonl</text><rect x="32" y="170" width="262" height="64" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="163.0" y="211.0" font-size="25" fill="#b4563e" font-weight="600" text-anchor="middle">old-tool</text><rect x="32" y="258" width="262" height="64" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="163.0" y="299.0" font-size="25" fill="#14796e" font-weight="600" text-anchor="middle">new-tool</text><rect x="32" y="346" width="262" height="64" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="163.0" y="387.0" font-size="25" fill="#28638a" font-weight="600" text-anchor="middle">long-input</text><rect x="506" y="170" width="262" height="64" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="637.0" y="211.0" font-size="25" fill="#28638a" font-weight="600" text-anchor="middle">long-input</text><rect x="506" y="258" width="262" height="64" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="637.0" y="299.0" font-size="25" fill="#b4563e" font-weight="600" text-anchor="middle">old-tool</text><rect x="506" y="346" width="262" height="64" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="637.0" y="387.0" font-size="25" fill="#14796e" font-weight="600" text-anchor="middle">new-tool</text><line x1="300" y1="202" x2="497" y2="290" stroke="#b4563e" stroke-width="3" marker-end="url(#arrow)"/><line x1="300" y1="290" x2="497" y2="378" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><line x1="300" y1="378" x2="497" y2="202" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="463" font-size="28" fill="#14796e" font-weight="600" text-anchor="start">连线按 id，不能按第几行直接 zip。</text><rect x="32" y="494" width="736" height="89" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="400.0" y="547.5" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">唯一 id / 布尔结果 / 有效时延 / 相同样本集</text><path d="M401 590 V627 H278 V650" fill="none" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><path d="M401 627 H650 V650" fill="none" stroke="#b4563e" stroke-width="3" marker-end="url(#arrow)"/><text x="278" y="692" font-size="25" fill="#14796e" font-weight="600" text-anchor="middle">通过 → 统计四种转移</text><text x="650" y="692" font-size="25" fill="#b4563e" font-weight="600" text-anchor="middle">异常 → 报错</text><text x="32" y="735" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">配对正确之后，再计算通过率、时延与具体退步样本。</text></svg>
