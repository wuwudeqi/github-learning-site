<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 785" role="img" aria-labelledby="title desc"><title id="title">Φ-Bench：任务范围和尝试次数同时变化</title><desc id="desc">统一资源：8 CPU 核 / 32 GiB 内存 / 1 张 H20</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="785" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">Φ-Bench：任务范围和尝试次数同时变化</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">统一资源：8 CPU 核 / 32 GiB 内存 / 1 张 H20</text><rect x="32" y="128" width="736" height="417" rx="10" fill="#e7eff4" stroke="#28638a" stroke-width="2"/><text x="55" y="169" font-size="28" fill="#28638a" font-weight="600" text-anchor="start">E2EO：整仓库优化</text><text x="744" y="213" font-size="25" fill="#28638a" font-weight="400" text-anchor="end">最多 16 候选，取最佳</text><rect x="71" y="238" width="658" height="267" rx="10" fill="#eef4ee" stroke="#14796e" stroke-width="2"/><text x="94" y="279" font-size="28" fill="#14796e" font-weight="600" text-anchor="start">LHI：跨文件长程实现</text><text x="705" y="320" font-size="25" fill="#14796e" font-weight="400" text-anchor="end">最多 16 候选，取最佳</text><rect x="110" y="344" width="581" height="117" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="133" y="385" font-size="28" fill="#20343b" font-weight="600" text-anchor="start">KFC：单文件内核补全</text><text x="665" y="427" font-size="26" fill="#20343b" font-weight="400" text-anchor="end">1 个候选</text><line x1="400" y1="553" x2="400" y2="592" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="605" width="337" height="86" rx="10" fill="#e8f2ec" stroke="#d3dcd8" stroke-width="2"/><text x="200.5" y="657.0" font-size="26" fill="#14796e" font-weight="600" text-anchor="middle">先验证功能正确</text><line x1="375" y1="648" x2="429" y2="648" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><rect x="439" y="605" width="329" height="86" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="603.5" y="657.0" font-size="26" fill="#28638a" font-weight="600" text-anchor="middle">再评性能</text><text x="32" y="761" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">嵌套表示修改范围扩大；三类任务与执行框架仍需分别比较。</text></svg>
