<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-label="长任务应用，分开看四个环节"><style>text{font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif}</style><rect width="1000" height="580" fill="#f5f2eb"/><text x="42" y="59" fill="#182b3a" font-size="33" font-weight="650">长任务应用，分开看四个环节</text><text x="42" y="96" fill="#596a75" font-size="19" font-weight="400">声音自然、模型强、环境可靠、结果正确，需要分别验证。</text><rect x="42" y="130" width="905" height="84" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="63" y="164" fill="#236580" font-size="24" font-weight="600">交互入口</text><text x="259" y="164" fill="#182b3a" font-size="25" font-weight="400">GPT-Live-1</text><text x="259" y="193" fill="#596a75" font-size="20" font-weight="400">插话、停顿、前台听说</text><rect x="42" y="232" width="905" height="84" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="63" y="266" fill="#236580" font-size="24" font-weight="600">执行框架</text><text x="259" y="266" fill="#182b3a" font-size="25" font-weight="400">Agents API</text><text x="259" y="295" fill="#596a75" font-size="20" font-weight="400">会话、工具、文件与环境</text><rect x="42" y="334" width="905" height="84" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="63" y="368" fill="#236580" font-size="24" font-weight="600">模型与数据</text><text x="259" y="368" fill="#182b3a" font-size="25" font-weight="400">推理模型 / 企业资料</text><text x="259" y="397" fill="#596a75" font-size="20" font-weight="400">能力、版本、权限与指标口径</text><rect x="42" y="436" width="905" height="84" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="63" y="470" fill="#236580" font-size="24" font-weight="600">结果检查</text><text x="259" y="470" fill="#182b3a" font-size="25" font-weight="400">应用自己的验收</text><text x="259" y="499" fill="#596a75" font-size="20" font-weight="400">产物、引用、回归与发布证据</text><text x="42" y="565" fill="#596a75" font-size="17" font-weight="400">结构示意，不是某家产品的完整架构图。</text></svg>
