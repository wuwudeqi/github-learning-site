<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">PARSER：文档不挪走，问题往返于阅读器</title><desc id="desc">阅读器固定负责各自文档块；只训练主 Agent</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="720" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">PARSER：文档不挪走，问题往返于阅读器</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">阅读器固定负责各自文档块；只训练主 Agent</text><rect x="32" y="127" width="736" height="76" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="400.0" y="174.0" font-size="26" fill="#20343b" font-weight="600" text-anchor="middle">一份长文 → 切成多块，分给冻结的阅读器</text><rect x="32" y="288" width="217" height="126" rx="10" fill="#e8f2ec" stroke="#d3dcd8" stroke-width="2"/><text x="140.5" y="322" font-size="26" fill="#14796e" font-weight="600" text-anchor="middle">主 Agent</text><text x="140.5" y="355" font-size="23" fill="#596c73" font-weight="400" text-anchor="middle">每轮提出问题</text><rect x="488" y="251" width="280" height="84" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="628.0" y="302.0" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">阅读器：块 1</text><path d="M254 327 H386 V278 H482" fill="none" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><path d="M485 311 H429 V626 H143 V420" fill="none" stroke="#28638a" stroke-width="2" marker-end="url(#arrow)"/><rect x="488" y="375" width="280" height="84" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="628.0" y="426.0" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">阅读器：块 2</text><path d="M254 327 H386 V402 H482" fill="none" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><path d="M485 435 H429 V626 H143 V420" fill="none" stroke="#28638a" stroke-width="2" marker-end="url(#arrow)"/><rect x="488" y="499" width="280" height="84" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="628.0" y="550.0" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">阅读器：块 3</text><path d="M254 327 H386 V526 H482" fill="none" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><path d="M485 559 H429 V626 H143 V420" fill="none" stroke="#28638a" stroke-width="2" marker-end="url(#arrow)"/><text x="296" y="232" font-size="25" fill="#14796e" font-weight="600" text-anchor="start">并行问</text><text x="344" y="665" font-size="26" fill="#28638a" font-weight="600" text-anchor="middle">汇总证据 → 决定追问或作答</text><text x="32" y="696" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">多轮重复这条回路；并行省等待，也增加同时运行的资源。</text></svg>
