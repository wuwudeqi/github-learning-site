<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 977" role="img" aria-labelledby="title desc"><title id="title">ComfyUI：沿连线辨认数据是什么</title><desc id="desc">以 SD 1.5 基础文生图为例；不是所有模型的通用节点图</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="977" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">ComfyUI：沿连线辨认数据是什么</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">以 SD 1.5 基础文生图为例；不是所有模型的通用节点图</text><rect x="32" y="116" width="736" height="78" rx="10" fill="#e5edf3" stroke="#d3dcd8" stroke-width="2"/><text x="400.0" y="164.0" font-size="26" fill="#28638a" font-weight="600" text-anchor="middle">Load Checkpoint → MODEL / CLIP / VAE</text><path d="M167 198 V306" fill="none" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><text x="54" y="259" font-size="25" fill="#28638a" font-weight="400" text-anchor="start">CLIP + 文字</text><rect x="32" y="316" width="336" height="96" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="200.0" y="350" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">CLIP Text Encode</text><text x="200.0" y="383" font-size="23" fill="#596c73" font-weight="400" text-anchor="middle">正向 / 负向提示分别编码</text><path d="M400 198 V468" fill="none" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><text x="416" y="262" font-size="24" fill="#28638a" font-weight="400" text-anchor="start">MODEL</text><path d="M715 198 V701 H601 V744" fill="none" stroke="#c3952b" stroke-width="3" marker-end="url(#arrow)"/><text x="724" y="667" font-size="24" fill="#c3952b" font-weight="400" text-anchor="middle">VAE</text><rect x="425" y="317" width="270" height="95" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="560.0" y="351" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">Empty Latent</text><text x="560.0" y="384" font-size="23" fill="#596c73" font-weight="400" text-anchor="middle">设定宽高</text><path d="M200 415 V445 H305 V470" fill="none" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><text x="34" y="465" font-size="22" fill="#14796e" font-weight="400" text-anchor="start">CONDITIONING</text><path d="M560 415 V470" fill="none" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><rect x="243" y="484" width="420" height="119" rx="10" fill="#e8f2ec" stroke="#d3dcd8" stroke-width="2"/><text x="453.0" y="518" font-size="28" fill="#14796e" font-weight="600" text-anchor="middle">KSampler</text><text x="453.0" y="551" font-size="23" fill="#596c73" font-weight="400" text-anchor="middle">按 seed 加噪声，迭代去噪</text><line x1="452" y1="610" x2="452" y2="744" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><text x="190" y="672" font-size="26" fill="#14796e" font-weight="400" text-anchor="start">输出仍是 LATENT</text><rect x="244" y="758" width="419" height="72" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="453.5" y="803.0" font-size="27" fill="#28638a" font-weight="600" text-anchor="middle">VAE Decode</text><line x1="452" y1="835" x2="452" y2="874" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><text x="206" y="865" font-size="24" fill="#28638a" font-weight="400" text-anchor="start">IMAGE</text><text x="453" y="917" font-size="28" fill="#14796e" font-weight="600" text-anchor="middle">Save Image → 图片文件</text><text x="32" y="953" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">编码条件 ≠ 像素；KSampler 的输出要经 VAE 解码才能看。</text></svg>
