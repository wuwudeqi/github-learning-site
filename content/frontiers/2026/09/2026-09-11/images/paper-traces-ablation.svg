<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 671" role="img" aria-labelledby="title desc"><title id="title">轨迹消融：只改变训练时保留哪些片段</title><desc id="desc">色块表示保留；空白表示删除，长度比例仅作示意</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="671" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">轨迹消融：只改变训练时保留哪些片段</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">色块表示保留；空白表示删除，长度比例仅作示意</text><text x="284" y="142" font-size="25" fill="#14796e" font-weight="400" text-anchor="start">开头</text><text x="479" y="142" font-size="25" fill="#596c73" font-weight="400" text-anchor="start">中间</text><text x="670" y="142" font-size="25" fill="#14796e" font-weight="400" text-anchor="start">结尾</text><text x="32" y="217" font-size="26" fill="#20343b" font-weight="600" text-anchor="start">完整</text><rect x="235" y="172" width="168" height="69" rx="3" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="252" y1="190" x2="378" y2="190" stroke="#d8eee4" stroke-width="3"/><line x1="252" y1="205" x2="378" y2="205" stroke="#d8eee4" stroke-width="3"/><line x1="252" y1="220" x2="378" y2="220" stroke="#d8eee4" stroke-width="3"/><rect x="415" y="172" width="168" height="69" rx="3" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="432" y1="190" x2="558" y2="190" stroke="#d8eee4" stroke-width="3"/><line x1="432" y1="205" x2="558" y2="205" stroke="#d8eee4" stroke-width="3"/><line x1="432" y1="220" x2="558" y2="220" stroke="#d8eee4" stroke-width="3"/><rect x="595" y="172" width="168" height="69" rx="3" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="612" y1="190" x2="738" y2="190" stroke="#d8eee4" stroke-width="3"/><line x1="612" y1="205" x2="738" y2="205" stroke="#d8eee4" stroke-width="3"/><line x1="612" y1="220" x2="738" y2="220" stroke="#d8eee4" stroke-width="3"/><text x="32" y="319" font-size="26" fill="#20343b" font-weight="600" text-anchor="start">只留开头</text><rect x="235" y="274" width="168" height="69" rx="3" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="252" y1="292" x2="378" y2="292" stroke="#d8eee4" stroke-width="3"/><line x1="252" y1="307" x2="378" y2="307" stroke="#d8eee4" stroke-width="3"/><line x1="252" y1="322" x2="378" y2="322" stroke="#d8eee4" stroke-width="3"/><rect x="415" y="274" width="168" height="69" rx="3" fill="white" stroke="#d3dcd8" stroke-width="2" stroke-dasharray="7 6"/><rect x="595" y="274" width="168" height="69" rx="3" fill="white" stroke="#d3dcd8" stroke-width="2" stroke-dasharray="7 6"/><text x="32" y="421" font-size="26" fill="#20343b" font-weight="600" text-anchor="start">只留结尾</text><rect x="235" y="376" width="168" height="69" rx="3" fill="white" stroke="#d3dcd8" stroke-width="2" stroke-dasharray="7 6"/><rect x="415" y="376" width="168" height="69" rx="3" fill="white" stroke="#d3dcd8" stroke-width="2" stroke-dasharray="7 6"/><rect x="595" y="376" width="168" height="69" rx="3" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="612" y1="394" x2="738" y2="394" stroke="#d8eee4" stroke-width="3"/><line x1="612" y1="409" x2="738" y2="409" stroke="#d8eee4" stroke-width="3"/><line x1="612" y1="424" x2="738" y2="424" stroke="#d8eee4" stroke-width="3"/><text x="32" y="523" font-size="26" fill="#20343b" font-weight="600" text-anchor="start">保留两端</text><rect x="235" y="478" width="168" height="69" rx="3" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="252" y1="496" x2="378" y2="496" stroke="#d8eee4" stroke-width="3"/><line x1="252" y1="511" x2="378" y2="511" stroke="#d8eee4" stroke-width="3"/><line x1="252" y1="526" x2="378" y2="526" stroke="#d8eee4" stroke-width="3"/><rect x="415" y="478" width="168" height="69" rx="3" fill="white" stroke="#d3dcd8" stroke-width="2" stroke-dasharray="7 6"/><rect x="595" y="478" width="168" height="69" rx="3" fill="#14796e" stroke="#14796e" stroke-width="2"/><line x1="612" y1="496" x2="738" y2="496" stroke="#d8eee4" stroke-width="3"/><line x1="612" y1="511" x2="738" y2="511" stroke="#d8eee4" stroke-width="3"/><line x1="612" y1="526" x2="738" y2="526" stroke="#d8eee4" stroke-width="3"/><text x="32" y="603" font-size="26" fill="#14796e" font-weight="600" text-anchor="start">相同任务与主干下，看删片段是否改变学习结果。</text><text x="32" y="647" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">删除训练材料的对照，不能推出“所有推理过程都无用”。</text></svg>
