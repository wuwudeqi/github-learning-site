<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 685" role="img" aria-labelledby="title desc"><title id="title">1.3B 权重包只是完整推理的一部分</title><desc id="desc">实线为信息流；虚线区域标出组件来自哪个包</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="685" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">1.3B 权重包只是完整推理的一部分</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">实线为信息流；虚线区域标出组件来自哪个包</text><rect x="29" y="112" width="741" height="154" rx="10" fill="white" stroke="#28638a" stroke-width="2" stroke-dasharray="7 6"/><text x="49" y="151" font-size="26" fill="#28638a" font-weight="600" text-anchor="start">14B 发布包共享资源（assets_dir）</text><rect x="49" y="179" width="369" height="64" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="233.5" y="220.0" font-size="24" fill="#20343b" font-weight="600" text-anchor="middle">分词器 + T5 文本编码</text><rect x="468" y="179" width="280" height="64" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="608.0" y="220.0" font-size="24" fill="#20343b" font-weight="600" text-anchor="middle">VAE 编码 / 解码</text><text x="33" y="320" font-size="25" fill="#20343b" font-weight="400" text-anchor="start">文字提示</text><line x1="137" y1="310" x2="137" y2="251" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><text x="488" y="320" font-size="25" fill="#20343b" font-weight="400" text-anchor="start">起始帧</text><line x1="566" y1="306" x2="566" y2="251" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><rect x="164" y="365" width="473" height="125" rx="10" fill="#e8f2ec" stroke="#14796e" stroke-width="2" stroke-dasharray="7 6"/><text x="400" y="402" font-size="28" fill="#14796e" font-weight="600" text-anchor="middle">1.3B 包：DiT 主体</text><text x="400" y="448" font-size="24" fill="#20343b" font-weight="400" text-anchor="middle">动作条件 + 缓存 → 逐块生成</text><path d="M261 248 V359" fill="none" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 248 V343 H540 V359" fill="none" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="433" font-size="24" fill="#20343b" font-weight="400" text-anchor="start">动作</text><line x1="90" y1="427" x2="157" y2="427" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 427 H725 V530 H402 V551" fill="none" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><rect x="165" y="561" width="472" height="70" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="401.0" y="605.0" font-size="24" fill="#20343b" font-weight="600" text-anchor="middle">经共享 VAE 解码 → 后续视频帧</text><text x="32" y="661" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">参考脚本：480P、4 张 GPU；不能直接据此推断单卡帧率。</text></svg>
