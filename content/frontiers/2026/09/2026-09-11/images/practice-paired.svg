<svg viewBox="0 0 1000 580" role="img" aria-label="总平均分上升，仍然存在退步" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif}</style><rect width="1000" height="580" fill="#f5f2eb"></rect><text x="42" y="59" fill="#182b3a" font-size="33" font-weight="650">总平均分上升，仍然存在退步</text><text x="42" y="96" fill="#596a75" font-size="19" font-weight="400">六条合成样本，按 id 配对；数字来自本期已运行的 CPU 脚本。</text><text x="278" y="147" fill="#247557" font-size="22" font-weight="600">新版通过</text><text x="644" y="147" fill="#a94938" font-size="22" font-weight="600">新版失败</text><text x="43" y="255" fill="#182b3a" font-size="22" font-weight="400">旧版通过</text><text x="43" y="403" fill="#182b3a" font-size="22" font-weight="400">旧版失败</text><rect x="240" y="173" width="335" height="126" rx="14" fill="#ffffff" stroke="#d4dcd9"></rect><text x="265" y="229" fill="#247557" font-size="44" font-weight="650">3</text><text x="335" y="229" fill="#247557" font-size="22" font-weight="400">继续通过</text><text x="265" y="271" fill="#596a75" font-size="18" font-weight="400">保留样本列表，逐项复核</text><rect x="600" y="173" width="335" height="126" rx="14" fill="#ffffff" stroke="#d4dcd9"></rect><text x="625" y="229" fill="#a94938" font-size="44" font-weight="650">1</text><text x="695" y="229" fill="#a94938" font-size="22" font-weight="400">退步：old-tool</text><text x="625" y="271" fill="#596a75" font-size="18" font-weight="400">保留样本列表，逐项复核</text><rect x="240" y="323" width="335" height="126" rx="14" fill="#ffffff" stroke="#d4dcd9"></rect><text x="265" y="379" fill="#236580" font-size="44" font-weight="650">2</text><text x="335" y="379" fill="#236580" font-size="22" font-weight="400">由错变对</text><text x="265" y="421" fill="#596a75" font-size="18" font-weight="400">保留样本列表，逐项复核</text><rect x="600" y="323" width="335" height="126" rx="14" fill="#ffffff" stroke="#d4dcd9"></rect><text x="625" y="379" fill="#596a75" font-size="44" font-weight="650">0</text><text x="695" y="379" fill="#596a75" font-size="22" font-weight="400">继续失败</text><text x="625" y="421" fill="#596a75" font-size="18" font-weight="400">保留样本列表，逐项复核</text><text x="43" y="503" fill="#236580" font-size="26" font-weight="600">总通过率：4 / 6 → 5 / 6</text><text x="43" y="544" fill="#596a75" font-size="21" font-weight="400">差值 +16.667 个百分点；不能据此判断所有能力都改善。</text></svg>
