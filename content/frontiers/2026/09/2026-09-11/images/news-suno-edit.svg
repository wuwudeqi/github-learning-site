<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 566" role="img" aria-labelledby="title desc"><title id="title">局部改歌：把修改范围放在时间线上</title><desc id="desc">抽象段落示意；色块不表示实测音频或精确时长</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="566" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">局部改歌：把修改范围放在时间线上</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">抽象段落示意；色块不表示实测音频或精确时长</text><text x="32" y="141" font-size="26" fill="#28638a" font-weight="600" text-anchor="start">原歌曲</text><rect x="32" y="164" width="218" height="94" rx="10" fill="#e9eef3" stroke="#d3dcd8" stroke-width="2"/><text x="141.0" y="220.0" font-size="26" fill="#28638a" font-weight="600" text-anchor="middle">主歌</text><rect x="261" y="164" width="278" height="94" rx="10" fill="#f5e3d8" stroke="#d3dcd8" stroke-width="2"/><text x="400.0" y="220.0" font-size="26" fill="#b4563e" font-weight="600" text-anchor="middle">副歌</text><rect x="550" y="164" width="218" height="94" rx="10" fill="#e9eef3" stroke="#d3dcd8" stroke-width="2"/><text x="659.0" y="220.0" font-size="26" fill="#28638a" font-weight="600" text-anchor="middle">尾段</text><line x1="400" y1="265" x2="400" y2="347" stroke="#b4563e" stroke-width="3" marker-end="url(#arrow)"/><text x="419" y="309" font-size="25" fill="#b4563e" font-weight="400" text-anchor="start">只选中这一段</text><text x="32" y="374" font-size="26" fill="#14796e" font-weight="600" text-anchor="start">修改后，再听衔接</text><rect x="32" y="397" width="218" height="94" rx="10" fill="#e9eef3" stroke="#d3dcd8" stroke-width="2"/><text x="141.0" y="453.0" font-size="26" fill="#28638a" font-weight="600" text-anchor="middle">保留主歌</text><rect x="261" y="397" width="278" height="94" rx="10" fill="#e8f2ec" stroke="#d3dcd8" stroke-width="2"/><text x="400.0" y="453.0" font-size="26" fill="#14796e" font-weight="600" text-anchor="middle">新副歌</text><rect x="550" y="397" width="218" height="94" rx="10" fill="#e9eef3" stroke="#d3dcd8" stroke-width="2"/><text x="659.0" y="453.0" font-size="26" fill="#28638a" font-weight="600" text-anchor="middle">保留尾段</text><text x="32" y="542" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">可改歌词、乐器等；仍需检查接缝与未选区域是否符合预期。</text></svg>
