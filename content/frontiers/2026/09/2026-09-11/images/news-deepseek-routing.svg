<svg viewBox="0 0 800 680" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"><title id="title">同一个 API 名称，可能换了实际模型</title><desc id="desc">迁移时间均按北京时间；新调用优先使用 deepseek-flash</desc><style>text{font-family:&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"></path></marker></defs><rect width="800" height="680" fill="#faf8f2"></rect><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">同一个 API 名称，可能换了实际模型</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">迁移时间均按北京时间；新调用优先使用 deepseek-flash</text><line x1="66" y1="139" x2="730" y2="139" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"></line><circle cx="96" cy="139" r="7" fill="#14796e" stroke="#14796e" stroke-width="2"></circle><circle cx="527" cy="139" r="7" fill="#b4563e" stroke="#b4563e" stroke-width="2"></circle><text x="96" y="121" font-size="25" fill="#14796e" font-weight="400" text-anchor="start">9 月 11 日：现在</text><text x="496" y="184" font-size="25" fill="#b4563e" font-weight="400" text-anchor="start">9 月 14 日 12:00</text><text x="32" y="231" font-size="25" fill="#14796e" font-weight="600" text-anchor="start">已经切换</text><rect x="32" y="255" width="440" height="108" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"></rect><text x="252.0" y="289" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">deepseek-v4-flash</text><text x="252.0" y="322" font-size="23" fill="#596c73" font-weight="400" text-anchor="middle">deepseek-v4-flash-vision-exp</text><line x1="477" y1="310" x2="548" y2="310" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"></line><rect x="555" y="255" width="213" height="108" rx="10" fill="#e8f2ec" stroke="#d3dcd8" stroke-width="2"></rect><text x="661.5" y="289" font-size="26" fill="#14796e" font-weight="600" text-anchor="middle">V4.1 Flash</text><text x="661.5" y="322" font-size="23" fill="#596c73" font-weight="400" text-anchor="middle">当前路由</text><text x="32" y="417" font-size="25" fill="#b4563e" font-weight="600" text-anchor="start">尚未切换</text><rect x="32" y="440" width="306" height="82" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"></rect><text x="185.0" y="490.0" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">deepseek-v4-pro</text><line x1="343" y1="481" x2="395" y2="481" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"></line><rect x="405" y="440" width="363" height="82" rx="10" fill="#edf1f7" stroke="#d3dcd8" stroke-width="2"></rect><text x="586.5" y="490.0" font-size="26" fill="#28638a" font-weight="600" text-anchor="middle">旧 V4 Pro（现在）</text><path d="M186 526 V578 H540" fill="none" stroke="#b4563e" stroke-width="3" marker-end="url(#arrow)"></path><text x="198" y="564" font-size="24" fill="#b4563e" font-weight="400" text-anchor="start">到上述时刻后</text><text x="557" y="587" font-size="25" fill="#b4563e" font-weight="600" text-anchor="start">V4.1 Flash</text><text x="32" y="656" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">旧别名仍可用，但复现实验要保存实际版本与调用日期。</text></svg>
