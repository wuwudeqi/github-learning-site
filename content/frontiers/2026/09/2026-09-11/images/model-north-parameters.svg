<svg viewBox="0 0 800 582" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg"><title id="title">激活参数少，完整权重仍然要存</title><desc id="desc">North Small Translate：218B 总参数，约 25B 每步激活</desc><style>text{font-family:&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"></path></marker></defs><rect width="800" height="582" fill="#faf8f2"></rect><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">激活参数少，完整权重仍然要存</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">North Small Translate：218B 总参数，约 25B 每步激活</text><text x="32" y="143" font-size="27" fill="#28638a" font-weight="600" text-anchor="start">需要保存的完整权重</text><rect x="32" y="166" width="736" height="116" rx="0" fill="#e5eaf1" stroke="#28638a" stroke-width="2"></rect><rect x="32" y="166" width="84.40366972477064" height="116" rx="0" fill="#14796e" stroke="#14796e" stroke-width="2"></rect><text x="436" y="234" font-size="34" fill="#28638a" font-weight="650" text-anchor="middle">218B 总参数</text><line x1="74" y1="288" x2="74" y2="330" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"></line><text x="32" y="364" font-size="28" fill="#14796e" font-weight="600" text-anchor="start">绿色：本次计算约激活 25B</text><text x="32" y="408" font-size="25" fill="#20343b" font-weight="400" text-anchor="start">下一步可能选择不同专家，不能只加载绿色部分。</text><rect x="32" y="445" width="736" height="71" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"></rect><text x="54" y="490" font-size="25" fill="#28638a" font-weight="600" text-anchor="start">仅 BF16 权重估算：218B × 2 字节 ≈ 436 GB</text><text x="32" y="558" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">十进制容量估算；运行还需缓存、临时张量和其他开销。</text></svg>
