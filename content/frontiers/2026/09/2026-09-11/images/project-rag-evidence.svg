<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 858" role="img" aria-labelledby="title desc"><title id="title">从段落与关系两条路径找证据</title><desc id="desc">示例材料：文档 1 说 A 使用 B；文档 2 说 B 依赖 C</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"/></marker></defs><rect width="800" height="858" fill="#faf8f2"/><text x="32" y="49" font-size="32" fill="#20343b" font-weight="650" text-anchor="start">从段落与关系两条路径找证据</text><text x="32" y="86" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">示例材料：文档 1 说 A 使用 B；文档 2 说 B 依赖 C</text><rect x="32" y="118" width="736" height="78" rx="10" fill="#e8f2ec" stroke="#d3dcd8" stroke-width="2"/><text x="400.0" y="166.0" font-size="27" fill="#14796e" font-weight="600" text-anchor="middle">问题：A 的依赖链里是否出现 C？</text><text x="32" y="242" font-size="27" fill="#28638a" font-weight="600" text-anchor="start">Haystack：可编排的组件管线</text><rect x="32" y="270" width="217" height="74" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="140.5" y="316.0" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">检索段落</text><line x1="255" y1="307" x2="288" y2="307" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><rect x="299" y="270" width="218" height="74" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="408.0" y="316.0" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">排序 / 组装</text><line x1="523" y1="307" x2="556" y2="307" stroke="#28638a" stroke-width="3" marker-end="url(#arrow)"/><rect x="568" y="270" width="200" height="74" rx="10" fill="white" stroke="#d3dcd8" stroke-width="2"/><text x="668.0" y="316.0" font-size="25" fill="#20343b" font-weight="600" text-anchor="middle">带引用回答</text><text x="32" y="390" font-size="25" fill="#28638a" font-weight="400" text-anchor="start">先检查给生成器的段落，能否支持这条依赖链。</text><line x1="32" y1="421" x2="768" y2="421" stroke="#d3dcd8" stroke-width="2"/><text x="32" y="465" font-size="27" fill="#14796e" font-weight="600" text-anchor="start">LightRAG：实体关系 + 文本证据</text><circle cx="116" cy="547" r="39" fill="#e8f2ec" stroke="#14796e" stroke-width="2"/><text x="116" y="557" font-size="30" fill="#14796e" font-weight="650" text-anchor="middle">A</text><circle cx="400" cy="547" r="39" fill="#e8f2ec" stroke="#14796e" stroke-width="2"/><text x="400" y="557" font-size="30" fill="#14796e" font-weight="650" text-anchor="middle">B</text><circle cx="684" cy="547" r="39" fill="#e8f2ec" stroke="#14796e" stroke-width="2"/><text x="684" y="557" font-size="30" fill="#14796e" font-weight="650" text-anchor="middle">C</text><line x1="162" y1="547" x2="352" y2="547" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><line x1="447" y1="547" x2="636" y2="547" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><text x="253" y="526" font-size="25" fill="#14796e" font-weight="400" text-anchor="middle">使用</text><text x="542" y="526" font-size="25" fill="#14796e" font-weight="400" text-anchor="middle">依赖</text><text x="252" y="607" font-size="25" fill="#28638a" font-weight="400" text-anchor="middle">文档 1</text><text x="542" y="607" font-size="25" fill="#28638a" font-weight="400" text-anchor="middle">文档 2</text><path d="M253 620 V655 H400 V684" fill="none" stroke="#14796e" stroke-width="3" marker-end="url(#arrow)"/><path d="M542 620 V655 H400" fill="none" stroke="#14796e" stroke-width="3"/><rect x="32" y="697" width="736" height="79" rx="10" fill="#e8f2ec" stroke="#d3dcd8" stroke-width="2"/><text x="400.0" y="745.5" font-size="27" fill="#14796e" font-weight="600" text-anchor="middle">用关系找到连接，再回查两份原文</text><text x="32" y="834" font-size="23" fill="#596c73" font-weight="400" text-anchor="start">概念对照；Haystack 也可扩展多跳检索，图中的边仍需核实。</text></svg>
