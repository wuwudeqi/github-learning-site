<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-label="从材料走到可检查的应用"><style>text{font-family:PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif}</style><rect width="1000" height="580" fill="#f5f2eb"/><text x="42" y="59" fill="#182b3a" font-size="33" font-weight="650">从材料走到可检查的应用</text><text x="42" y="96" fill="#596a75" font-size="19" font-weight="400">先选一个任务，再增加工具；这些项目不需要一次全部安装。</text><rect x="42" y="126" width="915" height="66" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="60" y="166" fill="#236580" font-size="23" font-weight="600">整理材料</text><text x="276" y="156" fill="#182b3a" font-size="23" font-weight="400">Paperless-ngx / GROBID</text><text x="276" y="181" fill="#596a75" font-size="18" font-weight="400">扫描归档 / 论文结构</text><rect x="42" y="206" width="915" height="66" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="60" y="246" fill="#236580" font-size="23" font-weight="600">组织知识</text><text x="276" y="236" fill="#182b3a" font-size="23" font-weight="400">Haystack / LightRAG</text><text x="276" y="261" fill="#596a75" font-size="18" font-weight="400">组件管线 / 实体关系</text><rect x="42" y="286" width="915" height="66" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="60" y="326" fill="#236580" font-size="23" font-weight="600">接入模型与页面</text><text x="276" y="316" fill="#182b3a" font-size="23" font-weight="400">LiteLLM / Chainlit</text><text x="276" y="341" fill="#596a75" font-size="18" font-weight="400">统一接口 / Python 交互</text><rect x="42" y="366" width="915" height="66" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="60" y="406" fill="#236580" font-size="23" font-weight="600">创作与开发</text><text x="276" y="396" fill="#182b3a" font-size="23" font-weight="400">ComfyUI / Cline</text><text x="276" y="421" fill="#596a75" font-size="18" font-weight="400">节点工作流 / 代码修改</text><rect x="42" y="446" width="915" height="66" rx="14" fill="#ffffff" stroke="#d4dcd9"/><text x="60" y="486" fill="#236580" font-size="23" font-weight="600">协调并追踪</text><text x="276" y="476" fill="#182b3a" font-size="23" font-weight="400">CrewAI / Opik</text><text x="276" y="501" fill="#596a75" font-size="18" font-weight="400">执行流程 / 评测记录</text><text x="42" y="561" fill="#596a75" font-size="18" font-weight="400">原创工具路径 · 模型、外部服务和企业扩展的许可须另行核对。</text></svg>
