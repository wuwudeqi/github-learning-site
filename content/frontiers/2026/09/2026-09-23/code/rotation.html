<!doctype html><html lang="zh"><meta charset="utf-8"><title>两次反射的实际计算</title>
<style>body{margin:0;background:#f5f5f0;color:#172f30;font-family:Arial,'PingFang SC',sans-serif}main{box-sizing:border-box;width:1200px;padding:42px}h1{font-size:34px;margin:0 0 12px}p{font-size:20px;line-height:1.5;margin:10px 0}.panels{display:flex;gap:28px}section{background:#fff;border:1px solid #cfdbd8;border-radius:16px;padding:22px;width:50%}h2{margin:0;font-size:23px}svg{width:100%;height:350px}small{font-size:17px;color:#46605d}.math{font-family:monospace}</style>
<main><h1>两次反射，合成一次 30° 旋转</h1><p>Python 实际输出 · 二维合成例子 · 无训练、无模型性能测量</p><div class="panels"><section><h2>① 一步里发生了什么</h2><svg id="step" viewBox="0 0 470 350"></svg><p>起点 (1, 0) → D 反射 → (−1, 0)<br>再经 H 反射 → (0.8660, 0.5000)</p></section><section><h2>② 连做 12 步，回到起点</h2><svg id="cycle" viewBox="0 0 470 350"></svg><p>每步转 30°；点仍落在单位圆上。<br>一次 H 连做两遍只会回到原点位。</p></section></div><p class="math" id="errors"></p><small>数据：rotation.py → rotation-results.json；HTML / JS 按实际坐标绘制。直觉参考 Complex KDA（arXiv:2609.24797），此图为本站独立数值演示。</small></main>
<script src="rotation-results.js"></script><script>
const d=window.rotationData,ns='http://www.w3.org/2000/svg';
function el(s,t,a,txt){let e=document.createElementNS(ns,t);for(let[k,v]of Object.entries(a))e.setAttribute(k,v);if(txt)e.textContent=txt;s.appendChild(e);return e}
function pos(p){return[235+p[0]*135,180-p[1]*135]}
function grid(s){el(s,'circle',{cx:235,cy:180,r:135,fill:'none',stroke:'#ccd9d5','stroke-width':2});el(s,'path',{d:'M65 180H410M235 20V340',stroke:'#b8c7c3',fill:'none'});el(s,'text',{x:411,y:174,'font-size':18},'x');el(s,'text',{x:246,y:28,'font-size':18},'y')}
let s=document.querySelector('#step');grid(s);for(let[p,c,label,dy]of [[[1,0],'#e48b26','起点',-16],[[-1,0],'#6d6fb3','D 后',-16],[d.points[1],'#128578','H·D 后',-16]]){let[x,y]=pos(p);el(s,'line',{x1:235,y1:180,x2:x,y2:y,stroke:c,'stroke-width':4});el(s,'circle',{cx:x,cy:y,r:7,fill:c});el(s,'text',{x:x-22,y:y+dy,fill:c,'font-size':21},label)}
s=document.querySelector('#cycle');grid(s);el(s,'polyline',{points:d.points.map(p=>pos(p).join(',')).join(' '),fill:'none',stroke:'#128578','stroke-width':3});d.points.slice(0,12).forEach((p,i)=>{let[x,y]=pos(p);el(s,'circle',{cx:x,cy:y,r:i?5:8,fill:i?'#128578':'#e48b26'});let[tx,ty]=pos(p.map(v=>v*1.14));el(s,'text',{x:tx,y:ty+6,'text-anchor':'middle','font-size':18},i===0?'0 / 12':String(i))});
document.querySelector('#errors').textContent='矩阵误差 '+d.matrixError.toExponential(2)+'  |  长度误差 '+d.normError.toExponential(2)+'  |  闭环误差 '+d.closureError.toExponential(2);
</script></html>
