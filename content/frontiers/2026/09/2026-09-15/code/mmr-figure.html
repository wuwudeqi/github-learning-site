<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMR：相关与重复的取舍</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#172c39;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}.page{width:1200px;padding:42px 54px;background:#f9f7f1}header{display:flex;justify-content:space-between;align-items:center;border-top:5px solid #1e5868;padding-top:22px}.eyebrow{font-size:15px;letter-spacing:2px;color:#426b76}h1{font-size:34px;line-height:1.3;margin:10px 0 12px}p{font-size:18px;line-height:1.6;margin:0 0 20px}.badge{font-size:15px;background:#e2eae7;padding:9px 14px;border-radius:5px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:23px 0 26px}.card{border:1px solid #c4cecc;padding:18px 20px;background:#fff}.card h2{font-size:20px;margin:0 0 10px}.ids{font-size:29px;font-weight:700;letter-spacing:6px}.note{font-size:15px;color:#4e646b;margin-top:9px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:40px}.chart h3{font-size:19px;margin:4px 0 12px}.scale{margin:0 52px 8px 82px;display:flex;justify-content:space-between;font-size:12px;color:#62777d}.barrow{display:grid;grid-template-columns:72px 1fr 47px;align-items:center;gap:10px;margin:13px 0;font-size:15px}.track{height:25px;background:repeating-linear-gradient(90deg,#e4e9e6 0,#e4e9e6 calc(25% - 1px),#acbcb8 calc(25% - 1px),#acbcb8 25%)}.bar{height:25px;background:var(--c)}.number{font-variant-numeric:tabular-nums;font-size:16px}.callout{margin-top:29px;background:#e6edeb;border-left:4px solid #245c69;padding:17px 20px;font-size:18px;line-height:1.65}footer{margin-top:23px;border-top:1px solid #b9c6c4;padding-top:15px;display:flex;justify-content:space-between;font-size:13px;color:#526d75}.red{color:#a55334}</style>
<main class="page"><header><div><div class="eyebrow">前沿实验室 · 2026 / 09 / 15</div><h1>相关的三段文字，可能只说了一件事</h1></div><span class="badge">合成向量 · Python 实际运行</span></header><p>MMR 每次选一段，兼顾与问题的相关度、与已选内容的重复程度。</p><section class="cards" id="cards"></section><section class="charts"><div class="chart"><h3>与问题的平均相似度</h3><div class="scale"><span>0</span><span>.25</span><span>.50</span><span>.75</span><span>1</span></div><div id="relevance"></div></div><div class="chart"><h3>段落之间的平均相似度（重复程度代理）</h3><div class="scale"><span>0</span><span>.25</span><span>.50</span><span>.75</span><span>1</span></div><div id="redundancy"></div></div></section><div class="callout"><strong>先过滤，再求多样：</strong>λ = 0.35、相关度门槛 = 0.70 时，保留 A、D、E。<br>移除门槛会选进偏题的 F；更“不一样”，并不自动更有用。</div><footer><span>六个手工三维向量；不是语义模型输出，也不是检索质量基准。</span><span id="run"></span></footer></main>
<script type="module">
const r=await (await fetch('./mmr-results.json.txt')).json();
const groups=[{key:'topK',name:'只按相关度',short:'Top-K',color:'#607a83',note:'A / B / C：三个近似角度'}, {key:'mmr',name:'MMR + 相关度门槛',short:'MMR',color:'#267b7d',note:'A / D / E：加入不同角度'}, {key:'withoutThreshold',name:'MMR，无门槛',short:'无门槛',color:'#b87954',note:'A / F / D：偏题材料也入选'}];
document.querySelector('#cards').innerHTML=groups.map(g=>`<article class="card" style="border-top:4px solid ${g.color}"><h2>${g.name}</h2><div class="ids">${r[g.key].ids.join(' · ')}</div><div class="note">${g.note}</div></article>`).join('');
for(const [id,metric] of [['relevance','meanRelevance'],['redundancy','meanPairwiseSimilarity']])document.getElementById(id).innerHTML=groups.map(g=>`<div class="barrow"><span>${g.short}</span><div class="track"><div class="bar" style="--c:${g.color};width:${r[g.key][metric]*100}%"></div></div><span class="number">${r[g.key][metric].toFixed(3)}</span></div>`).join('');
document.querySelector('#run').textContent=`Python ${r.python} · ${r.runAt.slice(11,19)} 运行`;
window.figureData=r;window.figureReady=true;
</script></html>
