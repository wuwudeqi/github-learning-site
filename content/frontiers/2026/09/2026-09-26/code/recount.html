<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>先核对分母</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#182d2d;font-family:system-ui,"PingFang SC",sans-serif}main{width:1100px;padding:50px 60px}h1{font-size:40px;margin:0 0 10px}p{font-size:20px;line-height:1.6;margin:10px 0 26px;color:#425a59}.row{display:grid;grid-template-columns:190px 430px 220px;align-items:center;gap:25px;padding:32px 0;border-top:1px solid #c9d3cc}.label{font-size:25px;font-weight:650}.grid{display:grid;grid-template-columns:repeat(10,24px);gap:10px}.dot{width:24px;height:24px;background:#d5e3da;border-radius:4px}.bad{background:#c6553d}.numbers{font-size:38px;font-weight:700}.numbers small{display:block;font-size:19px;font-weight:400;margin-top:8px}.legend{display:flex;gap:22px;align-items:center;font-size:19px}.legend i{display:inline-block;width:17px;height:17px;margin-right:8px}.note{padding:20px 24px;background:#e9eee8;border-radius:12px;margin-top:28px;font-size:21px;line-height:1.6}footer{font-size:15px;color:#5b6c68;margin-top:24px;line-height:1.5}</style>
<main id="figure"><h1>12/40 与 2/34：分母也变了</h1><p>Microsoft账单支持示例 · 本机Python复算原文汇总数字</p><div id="rows"></div><div class="legend"><span><i style="background:#c6553d"></i>观察到违规的适用对话</span><span><i style="background:#d5e3da"></i>未观察到违规的适用对话</span></div><div class="note" id="note"></div><footer>每个小格是一条适用对话，两组不代表相同的适用子集。<br>来源：Microsoft run-assert-eval，2026-09-24；图为HTML/JS按实际计算结果绘制，非模型实测。</footer></main>
<script type="module">
const data=await fetch('./recount-results.txt').then(r=>r.json());
for(const r of data.rows){const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="label">${r.label}</div><div class="grid">${Array.from({length:r.applicable},(_,i)=>`<i class="dot ${i<r.violations?'bad':''}"></i>`).join('')}</div><div class="numbers">${(100*r.rate).toFixed(1)}%<small>${r.violations} / ${r.applicable} 条适用对话</small></div>`;document.querySelector('#rows').append(row)}
document.querySelector('#note').textContent=`占比下降 ${data.percentage_point_drop.toFixed(2)} 个百分点。\n仅凭这两组汇总数，不能推出所有用户的风险下降幅度。`;
document.documentElement.dataset.ready='true';
</script></html>
