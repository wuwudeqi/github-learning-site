<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="有能力，还需要能交付的流程"><title>有能力，还需要能交付的流程</title><desc>一次任务的四个组成部分：每一层都需要自己的依据。；概念示意：箭头表达工作关系，不是任何厂商的架构或评测结果。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#26776d" stroke-width="1.5"/></marker></defs><rect width="1200" height="680" fill="#f5f8f7"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="18" fill="#26776d" font-weight="650">FRONTIERS  /  2026.09.10</text><text x="48" y="117" font-size="37" fill="#182b36" font-weight="700">有能力，还需要能交付的流程</text><text x="48" y="158" font-size="24" fill="#506471" font-weight="400">一次任务的四个组成部分：每一层都需要自己的依据。</text><rect x="48" y="222" width="246" height="274" rx="16" fill="#ffffff" stroke="#d7e1e4" stroke-width="2"/><text x="72" y="269" font-size="28" fill="#182b36" font-weight="650">模型能力</text><text x="72" y="316" font-size="24" fill="#506471" font-weight="400">理解目标</text><text x="72" y="355" font-size="24" fill="#506471" font-weight="400">提出下一步</text><text x="72" y="394" font-size="24" fill="#506471" font-weight="400">识别当前限制</text><rect x="329" y="222" width="246" height="274" rx="16" fill="#ffffff" stroke="#d7e1e4" stroke-width="2"/><text x="353" y="269" font-size="28" fill="#182b36" font-weight="650">应用与工具</text><text x="353" y="316" font-size="24" fill="#506471" font-weight="400">读取具体材料</text><text x="353" y="355" font-size="24" fill="#506471" font-weight="400">调用业务动作</text><text x="353" y="394" font-size="24" fill="#506471" font-weight="400">遵守访问范围</text><rect x="610" y="222" width="246" height="274" rx="16" fill="#ffffff" stroke="#d7e1e4" stroke-width="2"/><text x="634" y="269" font-size="28" fill="#182b36" font-weight="650">持久状态</text><text x="634" y="316" font-size="24" fill="#506471" font-weight="400">记录目标日期</text><text x="634" y="355" font-size="24" fill="#506471" font-weight="400">保存当前阶段</text><text x="634" y="394" font-size="24" fill="#506471" font-weight="400">中断以后恢复</text><rect x="891" y="222" width="246" height="274" rx="16" fill="#e5f2ed" stroke="#91bfb1" stroke-width="2"/><text x="915" y="269" font-size="28" fill="#182b36" font-weight="650">结果核验</text><text x="915" y="316" font-size="24" fill="#506471" font-weight="400">检查目标产物</text><text x="915" y="355" font-size="24" fill="#506471" font-weight="400">比对实际内容</text><text x="915" y="394" font-size="24" fill="#506471" font-weight="400">确认交付可读</text><path d="M 300 359 L 321 359" fill="none" stroke="#26776d" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 581 359 L 602 359" fill="none" stroke="#26776d" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 862 359 L 883 359" fill="none" stroke="#26776d" stroke-width="3"  marker-end="url(#arrow)"/><text x="48" y="555" font-size="26" fill="#182b36" font-weight="400">执行过某个动作，并不能单独证明最后的任务已经完成。</text><line x1="48" y1="605" x2="1152" y2="605" stroke="#d7e1e4" stroke-width="2"/><text x="48" y="642" font-size="22" fill="#506471" font-weight="400">概念示意：箭头表达工作关系，不是任何厂商的架构或评测结果。</text></g></svg>
