<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 806" role="img" aria-labelledby="title desc"><title id="title">十个开源项目，从眼前的问题开始</title><desc id="desc">前三项补入 DVC、BentoML、Ragas；新闻中的三个项目不在这里重复。数据与服务，DVC：固定数据与流水线版本，BentoML：把推理脚本接成服务，先用小样本验证整条路径；效果与接口，Ragas：建立可比较的评测，Pydantic AI：约束模型输出结构，分数、类型都不能代替事实核对；文档与网页，Docling：还原文档结构，Crawl4AI：采集与转换网页，抽查表格、顺序和正文完整性；字段与关系，LangExtract：抽取并保留原句，Graphiti：记录带时间的关系，保留来源与纠错入口；分析与创作，marimo：按依赖更新分析，Pascal Editor：编辑三维空间，结果要能运行、修改和检查；试用前看三件事，代码许可与模型许可是否不同，本地环境和外部服务需要什么，近期版本还是成熟工具推荐</desc><rect width="1120" height="806" rx="24" fill="#f4f6f7"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="57" font-size="30" font-weight="700" fill="#173a43">十个开源项目，从眼前的问题开始</text><text x="40" y="94" font-size="18" fill="#536b72">前三项补入 DVC、BentoML、Ragas；新闻中的三个项目不在这里重复</text><rect x="40" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="148" width="5" height="34" rx="2" fill="#007f86"/><text x="62" y="169" font-size="21" font-weight="700" fill="#007f86">数据与服务</text><text x="62" y="206" font-size="18" fill="#304c55">DVC：固定数据与流水线版本</text><text x="62" y="236" font-size="18" fill="#304c55">BentoML：把推理脚本接成服务</text><text x="62" y="266" font-size="18" fill="#304c55">先用小样本验证整条路径</text><rect x="571" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="148" width="5" height="34" rx="2" fill="#3868a5"/><text x="593" y="169" font-size="21" font-weight="700" fill="#3868a5">效果与接口</text><text x="593" y="206" font-size="18" fill="#304c55">Ragas：建立可比较的评测</text><text x="593" y="236" font-size="18" fill="#304c55">Pydantic AI：约束模型输出结构</text><text x="593" y="266" font-size="18" fill="#304c55">分数、类型都不能代替事实核对</text><rect x="40" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="344" width="5" height="34" rx="2" fill="#6c58a5"/><text x="62" y="365" font-size="21" font-weight="700" fill="#6c58a5">文档与网页</text><text x="62" y="402" font-size="18" fill="#304c55">Docling：还原文档结构</text><text x="62" y="432" font-size="18" fill="#304c55">Crawl4AI：采集与转换网页</text><text x="62" y="462" font-size="18" fill="#304c55">抽查表格、顺序和正文完整性</text><rect x="571" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="344" width="5" height="34" rx="2" fill="#a46537"/><text x="593" y="365" font-size="21" font-weight="700" fill="#a46537">字段与关系</text><text x="593" y="402" font-size="18" fill="#304c55">LangExtract：抽取并保留原句</text><text x="593" y="432" font-size="18" fill="#304c55">Graphiti：记录带时间的关系</text><text x="593" y="462" font-size="18" fill="#304c55">保留来源与纠错入口</text><rect x="40" y="522" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="540" width="5" height="34" rx="2" fill="#4b7b51"/><text x="62" y="561" font-size="21" font-weight="700" fill="#4b7b51">分析与创作</text><text x="62" y="598" font-size="18" fill="#304c55">marimo：按依赖更新分析</text><text x="62" y="628" font-size="18" fill="#304c55">Pascal Editor：编辑三维空间</text><text x="62" y="658" font-size="18" fill="#304c55">结果要能运行、修改和检查</text><rect x="571" y="522" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="540" width="5" height="34" rx="2" fill="#a65463"/><text x="593" y="561" font-size="21" font-weight="700" fill="#a65463">试用前看三件事</text><text x="593" y="598" font-size="18" fill="#304c55">代码许可与模型许可是否不同</text><text x="593" y="628" font-size="18" fill="#304c55">本地环境和外部服务需要什么</text><text x="593" y="658" font-size="18" fill="#304c55">近期版本还是成熟工具推荐</text><text x="40" y="778" font-size="17" fill="#60767e">本站原创任务地图；未逐项安装运行。</text></g></svg>
