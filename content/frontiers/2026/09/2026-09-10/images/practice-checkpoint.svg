<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="完成状态也需要重新核验"><title>完成状态也需要重新核验</title><desc>Python 本地实验：固定材料、持久进度、内容摘要。；仅演示单进程本地任务；摘要一致不等于内容正确，也不等于远程发布成功。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#26776d" stroke-width="1.5"/></marker></defs><rect width="1200" height="680" fill="#f5f8f7"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="18" fill="#26776d" font-weight="650">FRONTIERS  /  2026.09.10</text><text x="48" y="117" font-size="37" fill="#182b36" font-weight="700">完成状态也需要重新核验</text><text x="48" y="158" font-size="24" fill="#506471" font-weight="400">Python 本地实验：固定材料、持久进度、内容摘要。</text><rect x="48" y="224" width="246" height="219" rx="16" fill="#ffffff" stroke="#d7e1e4" stroke-width="2"/><text x="72" y="271" font-size="28" fill="#182b36" font-weight="650">PREPARING</text><text x="72" y="318" font-size="24" fill="#506471" font-weight="400">准备目标日期</text><text x="72" y="357" font-size="24" fill="#506471" font-weight="400">原子写入进度</text><rect x="329" y="224" width="246" height="219" rx="16" fill="#ffffff" stroke="#d7e1e4" stroke-width="2"/><text x="353" y="271" font-size="28" fill="#182b36" font-weight="650">DRAFTED</text><text x="353" y="318" font-size="24" fill="#506471" font-weight="400">材料已经保存</text><text x="353" y="357" font-size="24" fill="#506471" font-weight="400">允许模拟中断</text><rect x="610" y="224" width="246" height="219" rx="16" fill="#e5f2ed" stroke="#91bfb1" stroke-width="2"/><text x="634" y="271" font-size="28" fill="#182b36" font-weight="650">VERIFY</text><text x="634" y="318" font-size="24" fill="#506471" font-weight="400">日期与文件齐全</text><text x="634" y="357" font-size="24" fill="#506471" font-weight="400">摘要是否仍匹配</text><rect x="891" y="224" width="246" height="219" rx="16" fill="#ffffff" stroke="#d7e1e4" stroke-width="2"/><text x="915" y="271" font-size="28" fill="#182b36" font-weight="650">COMPLETE</text><text x="915" y="318" font-size="24" fill="#506471" font-weight="400">生成核验回执</text><text x="915" y="357" font-size="24" fill="#506471" font-weight="400">重跑时再次检查</text><path d="M 300 334 L 321 334" fill="none" stroke="#26776d" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 581 334 L 602 334" fill="none" stroke="#26776d" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 862 334 L 883 334" fill="none" stroke="#26776d" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 1008 458 L 1008 521 L 730 521 L 730 458" fill="none" stroke="#26776d" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><text x="49" y="500" font-size="26" fill="#182b36" font-weight="400">检查失败：保留错误，不能沿用旧结果。</text><text x="832" y="565" font-size="22" fill="#26776d" font-weight="400">重新运行</text><line x1="48" y1="605" x2="1152" y2="605" stroke="#d7e1e4" stroke-width="2"/><text x="48" y="642" font-size="22" fill="#506471" font-weight="400">仅演示单进程本地任务；摘要一致不等于内容正确，也不等于远程发布成功。</text></g></svg>
