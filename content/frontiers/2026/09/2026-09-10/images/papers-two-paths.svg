<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="把执行依据和学习信号分开看"><title>把执行依据和学习信号分开看</title><desc>上：过程图指导下一步；下：OPRD 调整学习更新。；编辑概念图：省略数学细节；不表示两种研究方法已被组合或复现。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#26776d" stroke-width="1.5"/></marker></defs><rect width="1200" height="680" fill="#f5f8f7"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="18" fill="#26776d" font-weight="650">FRONTIERS  /  2026.09.10</text><text x="48" y="117" font-size="37" fill="#182b36" font-weight="700">把执行依据和学习信号分开看</text><text x="48" y="158" font-size="24" fill="#506471" font-weight="400">上：过程图指导下一步；下：OPRD 调整学习更新。</text><text x="48" y="221" font-size="19" fill="#26776d" font-weight="650">PROCEDURAL GRAPHS</text><rect x="48" y="242" width="246" height="135" rx="16" fill="#ffffff" stroke="#d7e1e4" stroke-width="2"/><text x="72" y="289" font-size="28" fill="#182b36" font-weight="650">当前步骤</text><text x="72" y="336" font-size="24" fill="#506471" font-weight="400">最近执行轨迹</text><rect x="329" y="242" width="246" height="135" rx="16" fill="#e5f2ed" stroke="#91bfb1" stroke-width="2"/><text x="353" y="289" font-size="28" fill="#182b36" font-weight="650">附近过程图</text><text x="353" y="336" font-size="24" fill="#506471" font-weight="400">条件与可行关系</text><rect x="610" y="242" width="246" height="135" rx="16" fill="#ffffff" stroke="#d7e1e4" stroke-width="2"/><text x="634" y="289" font-size="28" fill="#182b36" font-weight="650">生成指导</text><text x="634" y="336" font-size="24" fill="#506471" font-weight="400">转成当前建议</text><rect x="891" y="242" width="246" height="135" rx="16" fill="#ffffff" stroke="#d7e1e4" stroke-width="2"/><text x="915" y="289" font-size="28" fill="#182b36" font-weight="650">执行并反馈</text><text x="915" y="336" font-size="24" fill="#506471" font-weight="400">离线再修订图</text><path d="M 300 306 L 321 306" fill="none" stroke="#26776d" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 581 306 L 602 306" fill="none" stroke="#26776d" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 862 306 L 883 306" fill="none" stroke="#26776d" stroke-width="3"  marker-end="url(#arrow)"/><text x="48" y="424" font-size="19" fill="#26776d" font-weight="650">ON-POLICY REVERSE DISTILLATION</text><rect x="48" y="445" width="246" height="135" rx="16" fill="#ffffff" stroke="#d7e1e4" stroke-width="2"/><text x="72" y="492" font-size="28" fill="#182b36" font-weight="650">学生轨迹</text><text x="72" y="539" font-size="24" fill="#506471" font-weight="400">学生自己生成</text><rect x="329" y="445" width="246" height="135" rx="16" fill="#ffffff" stroke="#d7e1e4" stroke-width="2"/><text x="353" y="492" font-size="28" fill="#182b36" font-weight="650">教师变化</text><text x="353" y="539" font-size="24" fill="#506471" font-weight="400">相对参考策略</text><rect x="610" y="445" width="246" height="135" rx="16" fill="#e5f2ed" stroke="#91bfb1" stroke-width="2"/><text x="634" y="492" font-size="28" fill="#182b36" font-weight="650">验证器梯度</text><text x="634" y="539" font-size="24" fill="#506471" font-weight="400">提供有效信号</text><rect x="891" y="445" width="246" height="135" rx="16" fill="#ffffff" stroke="#d7e1e4" stroke-width="2"/><text x="915" y="492" font-size="28" fill="#182b36" font-weight="650">缩放更新</text><text x="915" y="539" font-size="24" fill="#506471" font-weight="400">利用方向信息</text><path d="M 300 509 L 321 509" fill="none" stroke="#26776d" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 581 509 L 602 509" fill="none" stroke="#26776d" stroke-width="3"  marker-end="url(#arrow)"/><path d="M 862 509 L 883 509" fill="none" stroke="#26776d" stroke-width="3"  marker-end="url(#arrow)"/><line x1="48" y1="605" x2="1152" y2="605" stroke="#d7e1e4" stroke-width="2"/><text x="48" y="642" font-size="22" fill="#506471" font-weight="400">编辑概念图：省略数学细节；不表示两种研究方法已被组合或复现。</text></g></svg>
