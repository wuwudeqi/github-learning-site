<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 806" role="img" aria-labelledby="title desc"><title id="title">六篇论文，六个具体问题</title><desc id="desc">按 arXiv v1 版本阅读；实验数字必须连同模型、数据与条件一起看。Procedural Graphs，长任务怎样少走重复路线？，把步骤条件与依赖留下来，09-08 · 执行结构；OPRD，弱教师能给强学生什么？，利用学习方向，仍依赖验证信号，09-08 · 蒸馏与强化学习；BeaconKV，历史缓存该保留哪一部分？，用代表查询照顾未来回看，09-04 · 推理时缓存压缩；Kalman Delta Networks，新信息到来，旧记忆改多少？，用不确定性调节状态写入，09-07 · 序列模型；Environments as Scaffold，训练环境能否多给一点帮助？，行动指导逐步转为观察补充，09-08 · 长任务训练；EVOHARNESSBENCH，加了新工具，旧任务还会吗？，分开测旧能力保留与新任务适应，09-03 · Agent 回归评测</desc><rect width="1120" height="806" rx="24" fill="#f4f6f7"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="57" font-size="30" font-weight="700" fill="#173a43">六篇论文，六个具体问题</text><text x="40" y="94" font-size="18" fill="#536b72">按 arXiv v1 版本阅读；实验数字必须连同模型、数据与条件一起看</text><rect x="40" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="148" width="5" height="34" rx="2" fill="#007f86"/><text x="62" y="169" font-size="21" font-weight="700" fill="#007f86">Procedural Graphs</text><text x="62" y="206" font-size="18" fill="#304c55">长任务怎样少走重复路线？</text><text x="62" y="236" font-size="18" fill="#304c55">把步骤条件与依赖留下来</text><text x="62" y="266" font-size="18" fill="#304c55">09-08 · 执行结构</text><rect x="571" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="148" width="5" height="34" rx="2" fill="#3868a5"/><text x="593" y="169" font-size="21" font-weight="700" fill="#3868a5">OPRD</text><text x="593" y="206" font-size="18" fill="#304c55">弱教师能给强学生什么？</text><text x="593" y="236" font-size="18" fill="#304c55">利用学习方向，仍依赖验证信号</text><text x="593" y="266" font-size="18" fill="#304c55">09-08 · 蒸馏与强化学习</text><rect x="40" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="344" width="5" height="34" rx="2" fill="#6c58a5"/><text x="62" y="365" font-size="21" font-weight="700" fill="#6c58a5">BeaconKV</text><text x="62" y="402" font-size="18" fill="#304c55">历史缓存该保留哪一部分？</text><text x="62" y="432" font-size="18" fill="#304c55">用代表查询照顾未来回看</text><text x="62" y="462" font-size="18" fill="#304c55">09-04 · 推理时缓存压缩</text><rect x="571" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="344" width="5" height="34" rx="2" fill="#a46537"/><text x="593" y="365" font-size="21" font-weight="700" fill="#a46537">Kalman Delta Networks</text><text x="593" y="402" font-size="18" fill="#304c55">新信息到来，旧记忆改多少？</text><text x="593" y="432" font-size="18" fill="#304c55">用不确定性调节状态写入</text><text x="593" y="462" font-size="18" fill="#304c55">09-07 · 序列模型</text><rect x="40" y="522" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="540" width="5" height="34" rx="2" fill="#4b7b51"/><text x="62" y="561" font-size="21" font-weight="700" fill="#4b7b51">Environments as Scaffold</text><text x="62" y="598" font-size="18" fill="#304c55">训练环境能否多给一点帮助？</text><text x="62" y="628" font-size="18" fill="#304c55">行动指导逐步转为观察补充</text><text x="62" y="658" font-size="18" fill="#304c55">09-08 · 长任务训练</text><rect x="571" y="522" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="540" width="5" height="34" rx="2" fill="#a65463"/><text x="593" y="561" font-size="21" font-weight="700" fill="#a65463">EVOHARNESSBENCH</text><text x="593" y="598" font-size="18" fill="#304c55">加了新工具，旧任务还会吗？</text><text x="593" y="628" font-size="18" fill="#304c55">分开测旧能力保留与新任务适应</text><text x="593" y="658" font-size="18" fill="#304c55">09-03 · Agent 回归评测</text><text x="40" y="778" font-size="17" fill="#60767e">本站原创问题地图；详细方法、结果与限制见站内阅读卡。</text></g></svg>
