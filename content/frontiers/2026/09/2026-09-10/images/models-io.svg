<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 806" role="img" aria-labelledby="title desc"><title id="title">六个模型，先按任务选择</title><desc id="desc">当前模型卡与开放范围整理；没有独立推理测速。Gander，持续音视频 → 流式语音回应，Thinker 与 Talker 协作，Apache 2.0 · 数据仍待开放；Nex-N2.5-mini，任务与界面 → 电脑 / 浏览器操作，只讨论已公开的 mini 权重，Apache 2.0 · 先核对执行环境；Spark-X2.5-4B，指令 → 工具调用与回答，4B · 部署需匹配适配版本，Apache 2.0 · 端侧可作试验；VibeVoice Streaming 7B，连续音频 → 转写与说话人标记，先测漏字、插话与热词，MIT · 不负责语音合成；DeepSeek Flash Vision Exp，视觉输入 → 复杂任务推理，实验版本 · 官方示例为多卡，MIT · Flash 不是显存承诺；GLM-5.3-Flash，指令 → 推理与工具请求，320B 总参数 / 18B 活跃，MIT · 显式设置推理档位</desc><rect width="1120" height="806" rx="24" fill="#f4f6f7"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="40" y="57" font-size="30" font-weight="700" fill="#173a43">六个模型，先按任务选择</text><text x="40" y="94" font-size="18" fill="#536b72">当前模型卡与开放范围整理；没有独立推理测速</text><rect x="40" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="148" width="5" height="34" rx="2" fill="#007f86"/><text x="62" y="169" font-size="21" font-weight="700" fill="#007f86">Gander</text><text x="62" y="206" font-size="18" fill="#304c55">持续音视频 → 流式语音回应</text><text x="62" y="236" font-size="18" fill="#304c55">Thinker 与 Talker 协作</text><text x="62" y="266" font-size="18" fill="#304c55">Apache 2.0 · 数据仍待开放</text><rect x="571" y="130" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="148" width="5" height="34" rx="2" fill="#3868a5"/><text x="593" y="169" font-size="21" font-weight="700" fill="#3868a5">Nex-N2.5-mini</text><text x="593" y="206" font-size="18" fill="#304c55">任务与界面 → 电脑 / 浏览器操作</text><text x="593" y="236" font-size="18" fill="#304c55">只讨论已公开的 mini 权重</text><text x="593" y="266" font-size="18" fill="#304c55">Apache 2.0 · 先核对执行环境</text><rect x="40" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="344" width="5" height="34" rx="2" fill="#6c58a5"/><text x="62" y="365" font-size="21" font-weight="700" fill="#6c58a5">Spark-X2.5-4B</text><text x="62" y="402" font-size="18" fill="#304c55">指令 → 工具调用与回答</text><text x="62" y="432" font-size="18" fill="#304c55">4B · 部署需匹配适配版本</text><text x="62" y="462" font-size="18" fill="#304c55">Apache 2.0 · 端侧可作试验</text><rect x="571" y="326" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="344" width="5" height="34" rx="2" fill="#a46537"/><text x="593" y="365" font-size="21" font-weight="700" fill="#a46537">VibeVoice Streaming 7B</text><text x="593" y="402" font-size="18" fill="#304c55">连续音频 → 转写与说话人标记</text><text x="593" y="432" font-size="18" fill="#304c55">先测漏字、插话与热词</text><text x="593" y="462" font-size="18" fill="#304c55">MIT · 不负责语音合成</text><rect x="40" y="522" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="40" y="540" width="5" height="34" rx="2" fill="#4b7b51"/><text x="62" y="561" font-size="21" font-weight="700" fill="#4b7b51">DeepSeek Flash Vision Exp</text><text x="62" y="598" font-size="18" fill="#304c55">视觉输入 → 复杂任务推理</text><text x="62" y="628" font-size="18" fill="#304c55">实验版本 · 官方示例为多卡</text><text x="62" y="658" font-size="18" fill="#304c55">MIT · Flash 不是显存承诺</text><rect x="571" y="522" width="509" height="174" rx="15" fill="white" stroke="#dbe3e6"/><rect x="571" y="540" width="5" height="34" rx="2" fill="#a65463"/><text x="593" y="561" font-size="21" font-weight="700" fill="#a65463">GLM-5.3-Flash</text><text x="593" y="598" font-size="18" fill="#304c55">指令 → 推理与工具请求</text><text x="593" y="628" font-size="18" fill="#304c55">320B 总参数 / 18B 活跃</text><text x="593" y="658" font-size="18" fill="#304c55">MIT · 显式设置推理档位</text><text x="40" y="778" font-size="17" fill="#60767e">本站原创用途示意；条目顺序不表示性能排名。</text></g></svg>
