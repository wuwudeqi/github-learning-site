<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#f3f0e7;color:#16362f;font:26px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}#figure{width:840px;padding:44px;background:#f3f0e7}h1{font-size:38px;line-height:1.35;margin:12px 0 16px;letter-spacing:-1px}p{font-size:25px;line-height:1.6;margin:12px 0}.eyebrow{font-size:18px;letter-spacing:2px;color:#58736b}.sub{color:#52665e;font-size:24px}.panel{background:#fffefa;border:1px solid #d7ded4;border-radius:16px;padding:24px;margin:22px 0}h2{font-size:28px;margin:0 0 16px}.footer{font-size:22px;line-height:1.65;color:#52665e;margin-top:26px;border-top:1px solid #bacbc1;padding-top:18px}.row{margin:18px 0}.label{display:flex;justify-content:space-between;font-size:24px;margin-bottom:9px}.track{position:relative;height:22px;border-radius:4px;background:#e3e9e4}.bar{height:100%;border-radius:4px;background:#2c6e5b}.bf{background:#ca8250}.ci{height:30px;position:absolute;top:-4px;border-left:2px solid #523822;border-right:2px solid #523822;border-top:2px solid #523822}code{font:25px ui-monospace,SFMono-Regular,Menlo,monospace}.result{font-size:54px;font-weight:700;margin:12px 0}.muted{color:#52665e}.badge{font-size:22px;padding:5px 10px;background:#e3e9e4;border-radius:5px}.warn{color:#905124}</style><div id="figure"><div class="eyebrow">论文结果读图 · 2026 / 09 / 16</div><h1>“轨迹完全一样”<br>对计算精度有多敏感？</h1><p class="sub">相同提示与贪心解码，比较完整生成序列。<br>每个配置均为 1,190 条提示，最多 128 token。</p><div id="panels"></div><div class="footer">指标是完整序列一致率，不是任务正确率。<br>BF16 标注论文报告的 95% 置信区间；FP32 的 100% 仅限本组样本。<br>来源：Orthrus 独立复现论文，表 3、表 8。<br>HTML / JS 按原表绘制；本站未运行模型。</div></div><script type="module">const d=await fetch('./orthrus-precision-data.json.txt').then(r=>r.json());document.querySelector('#panels').innerHTML=d.values.map(v=>`<section class="panel"><h2>${v.model}</h2>${[['BF16',v.bf16,'bf',v.bf16CI95],['FP32',v.fp32,'',0]].map(([name,val,cls,ci])=>`<div class="row"><div class="label"><span>${name}</span><strong>${val}%${ci?' ± '+ci+' 个百分点':''}</strong></div><div class="track"><div class="bar ${cls}" style="width:${val}%"></div>${ci?`<span class="ci" style="left:${val-ci}%;width:${ci*2}%"></span>`:''}</div></div>`).join('')}</section>`).join('');document.body.dataset.ready='true';</script></html>
