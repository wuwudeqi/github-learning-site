<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500"
     role="img" aria-labelledby="ttl dsc">
<title id="ttl">The Viggle-Animate pipeline</title>
<desc id="dsc">A driving video and one of its own frames, repainted in any image editor, are the
model's only two inputs. Geometry enters from the video, appearance from the repainted frame. No
pose skeleton, segmentation mask, face crop, background plate, depth map or text prompt is ever
computed.</desc>

<style>
  svg{
    --ink:#17141A; --muted:#5A545F; --rule:#D5CFD9;
    --paint:#A33A62; --paint-wash:rgba(163,58,98,.08);
    --drive:#2C6E8F; --drive-wash:rgba(44,110,143,.08);
    --brand:#067A31; --brand-line:#00A63C; --brand-wash:rgba(0,217,79,.10);
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  .card{fill:#FBFAFC;stroke:var(--rule)}
  .box{fill:none;stroke:var(--rule);stroke-width:1.25}
  .box.drive{stroke:var(--drive);fill:var(--drive-wash)}
  .box.paint{stroke:var(--paint);fill:var(--paint-wash)}
  .box.dash{stroke-dasharray:5 4;stroke:var(--muted);opacity:.75}
  .box.model{stroke:var(--brand-line);stroke-width:2;fill:var(--brand-wash)}
  .t{font-family:var(--mono);font-size:17px;font-weight:600;fill:var(--ink)}
  .t.big{font-family:var(--sans);font-size:23px;font-weight:700;letter-spacing:-.3px}
  .d{font-family:var(--sans);font-size:14.5px;fill:var(--muted)}
  .lab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
  .flowline{fill:none;stroke-width:1.5}
  .never{font-family:var(--sans);font-size:13.5px;fill:var(--muted)}
  .never .h{font-family:var(--mono);font-size:12px;letter-spacing:.1em;fill:var(--ink);font-weight:600}
  .strike{text-decoration:line-through;text-decoration-thickness:1px}
</style>

<defs>
  <marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker>
</defs>

<rect class="card" x=".75" y=".75" width="878.5" height="498.5" rx="14"/>

<!-- row 1: the two inputs, and the editor that makes the second one -->
<rect class="box drive" x="18" y="44" width="220" height="84" rx="10"/>
<text class="t" x="36" y="78">driving.mp4</text>
<text class="d" x="36" y="104">motion, camera, timing</text>

<rect class="box dash" x="330" y="44" width="225" height="84" rx="10"/>
<text class="t" x="348" y="78" style="font-family:var(--sans);font-weight:600">any image editor</text>
<text class="d" x="348" y="102">gpt-image or similar,</text>
<text class="d" x="348" y="120" font-style="italic">not this model.</text>

<rect class="box paint" x="642" y="44" width="220" height="84" rx="10"/>
<text class="t" x="660" y="78">ref.png</text>
<text class="d" x="660" y="104">that frame, repainted</text>

<path class="flowline" stroke="var(--muted)" d="M238,86 H322" marker-end="url(#am)"/>
<text class="lab" x="280" y="76" fill="var(--muted)" text-anchor="middle">any frame</text>
<path class="flowline" stroke="var(--muted)" d="M555,86 H634" marker-end="url(#am)"/>

<!-- the two inputs merge; colour carries which half of the problem each one answers -->
<path class="flowline" stroke="var(--drive)" d="M128,128 V186 H438"/>
<path class="flowline" stroke="var(--paint)" d="M752,128 V186 H442"/>
<text class="lab" x="140" y="162" fill="var(--drive)">geometry</text>
<text class="lab" x="740" y="162" fill="var(--paint)" text-anchor="end">appearance</text>
<path class="flowline" stroke="var(--muted)" d="M440,186 V222" marker-end="url(#am)"/>

<rect class="box model" x="190" y="230" width="500" height="96" rx="12"/>
<text class="t big" x="440" y="266" text-anchor="middle" fill="var(--brand)">Viggle-Animate</text>
<text class="d" x="440" y="292" text-anchor="middle" fill="var(--ink)">33.1 B <tspan style="font-family:var(--mono);font-size:13.5px">ref2va</tspan> finetune + DMD2 LoRA</text>
<text class="d" x="440" y="313" text-anchor="middle">3 forward passes &#183; 26 s per clip on one B200</text>

<path class="flowline" stroke="var(--muted)" d="M440,326 V362" marker-end="url(#am)"/>

<rect class="box" x="290" y="370" width="300" height="60" rx="10"/>
<text class="t" x="440" y="396" text-anchor="middle">out.mp4</text>
<text class="d" x="440" y="418" text-anchor="middle">same motion, new character</text>

<path d="M40,452 H840" stroke="var(--rule)" stroke-width="1"/>
<text class="never" x="440" y="476" text-anchor="middle">
  <tspan class="h">NEVER COMPUTED</tspan><tspan>&#8195;</tspan><tspan class="strike">pose skeleton</tspan><tspan>&#8195;</tspan><tspan class="strike">segmentation mask</tspan><tspan>&#8195;</tspan><tspan class="strike">face crop</tspan><tspan>&#8195;</tspan><tspan class="strike">depth</tspan><tspan>&#8195;</tspan><tspan class="strike">text prompt</tspan>
</text>
</svg>
