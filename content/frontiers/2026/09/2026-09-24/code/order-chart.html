<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>换序实验真实结果</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:#18323a;font-family:"PingFang SC",sans-serif}main{width:1200px;padding:55px 62px 42px}h1{font-size:43px;margin:0 0 14px}p{font-size:23px;line-height:1.6;margin:0;color:#506569}.legend{display:flex;gap:36px;font-size:22px;margin:28px 0 22px}.dot{display:inline-block;width:18px;height:18px;border-radius:3px;margin-right:10px}.blue{background:#176994}.orange{background:#c7762b}.head,.row{display:grid;grid-template-columns:270px 1fr 156px;gap:28px}.head{font-size:20px;color:#506569;padding:0 0 13px}.row{border-top:1px solid #c8d1cc;padding:22px 0;align-items:center}.name{font-size:25px;font-weight:650;line-height:1.45}.pair{display:grid;gap:10px}.track{height:32px;background:#e1e3dc;position:relative}.bar{height:100%}.value{position:absolute;right:10px;top:1px;font-size:22px;font-weight:650;color:#122e38;background:#f4f1e9dd;padding:0 4px}.consistency{font-size:29px;font-weight:700;text-align:center}.note{border-top:2px solid #9baca6;padding-top:20px;font-size:21px;margin-top:8px}.tiny{font-size:18px;margin-top:14px}
</style><main id="chart"><h1>换序以后，“都答对”与“一致”不同</h1><p>同一道二选一题，交换候选顺序再判断一次。</p><div class="legend"><span><i class="dot blue"></i>两次判断的平均准确率</span><span><i class="dot orange"></i>两种顺序都正确</span></div><div class="head"><span>合成策略</span><span>0% ————————————————— 100%</span><span>语义一致率</span></div><div id="rows"></div><p class="note">位置偏好可藏在50%的准确率里；稳定选择也可能稳定地答错。</p><p class="tiny">本机 Python 实际输出 · 10000题 · 种子42 · 无模型调用 · 非 TasteBench 复现</p></main><script>
const data={"kind": "本机运行的合成教学示例；没有调用任何模型或真实基准", "seed": 42, "n": 10000, "python": "3.14.3", "platform": "Darwin arm64", "executedAt": "2026-09-24T00:10:51.245126+00:00", "rows": [{"strategy": "每次独立猜", "meanAccuracy": 0.49715, "bothCorrect": 0.248, "semanticConsistency": 0.5017, "correctFirst": 4975, "correctSwapped": 4968, "bothCount": 2480, "consistentCount": 5017}, {"strategy": "总选第一个位置", "meanAccuracy": 0.5, "bothCorrect": 0.0, "semanticConsistency": 0.0, "correctFirst": 5000, "correctSwapped": 5000, "bothCount": 0, "consistentCount": 0}, {"strategy": "稳定但仅七成题正确", "meanAccuracy": 0.7, "bothCorrect": 0.7, "semanticConsistency": 1.0, "correctFirst": 7000, "correctSwapped": 7000, "bothCount": 7000, "consistentCount": 10000}, {"strategy": "总选正确内容", "meanAccuracy": 1.0, "bothCorrect": 1.0, "semanticConsistency": 1.0, "correctFirst": 10000, "correctSwapped": 10000, "bothCount": 10000, "consistentCount": 10000}]};
for(const r of data.rows){const row=document.createElement('div');row.className='row';const name=document.createElement('div');name.className='name';name.textContent=r.strategy;row.append(name);const pair=document.createElement('div');pair.className='pair';for(const [key,color] of [['meanAccuracy','blue'],['bothCorrect','orange']]){const track=document.createElement('div');track.className='track';const bar=document.createElement('div');bar.className='bar '+color;bar.style.width=(r[key]*100)+'%';const v=document.createElement('span');v.className='value';v.textContent=(r[key]*100).toFixed(2)+'%';track.append(bar,v);pair.append(track)}row.append(pair);const c=document.createElement('div');c.className='consistency';c.textContent=(r.semanticConsistency*100).toFixed(2)+'%';row.append(c);document.querySelector('#rows').append(row)}
</script></html>
