<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>置信度与正确率</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#202a31;font-family:"PingFang SC",sans-serif}main{width:1200px;padding:50px 58px}small{font-size:17px;color:#576570;letter-spacing:2px}h1{font-size:40px;margin:14px 0}p{font-size:22px;line-height:1.6;margin:8px 0}#panels{display:flex;gap:28px;margin:30px 0}.panel{width:528px;background:white;border:1px solid #deded7;border-radius:18px;padding:26px}h2{font-size:28px;margin:0 0 16px}.metric{display:flex;justify-content:space-between;font-size:21px;margin:14px 0}.metric b{font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:20px 0}.cell{height:30px;display:grid;place-items:center;color:white;background:#15796c;border-radius:5px;font-size:17px}.wrong{background:#b85b36}.track{height:34px;background:#eee;border-radius:6px;position:relative;overflow:hidden;margin:7px 0 18px}.fill{height:100%;background:#e9b456}.actual{position:absolute;top:0;bottom:0;left:80%;border-left:3px solid #176d66}.label{display:flex;justify-content:space-between;color:#54646a;font-size:18px}.note{padding:20px 24px;border-left:5px solid #176d66;background:#e7eee8;font-size:21px;line-height:1.55}footer{font-size:17px;color:#5c6468;margin-top:22px;line-height:1.6}</style>
<main id="figure"><small>前沿 · 2026.09.27 / 本机计算 · 合成示例</small><h1>同样答对八成，分数可以很不一样</h1><p>两组使用完全相同的20次判断：16次正确，4次错误。</p><div id="panels"></div><div class="note">把分数 ≥ 90% 的判断自动放行：A 放行20次，仍错4次；B 放行0次。<br>分数更高不会让错误消失；零覆盖也不能写成“100%准确”。</div><footer>来源：calibration.py 的实际输出。没有调用模型，不代表 CLM、Julia、swift-newt 等系统的成绩。<br>二分类 Brier = mean((正类概率 − 真实标签)²)，越小越好；它同时受校准与区分能力影响。</footer></main>
<script>fetch('./calibration-results.txt').then(r=>r.json()).then(data=>{document.querySelector('#panels').innerHTML=data.results.map(d=>`<section class="panel"><h2>方案 ${d.name}</h2><div class="metric"><span>每次输出的最高分</span><b>${Math.round(d.confidence*100)}%</b></div><div class="label"><span>0%</span><span>绿色线：实际正确率80%</span><span>100%</span></div><div class="track"><div class="fill" style="width:${d.confidence*100}%"></div><div class="actual"></div></div><div class="grid">${data.rows.map(r=>`<div class="cell ${r.predicted===r.actual?'':'wrong'}">${r.predicted===r.actual?'✓':'×'}</div>`).join('')}</div><div class="metric"><span>实际正确率</span><b>${d.correct}/${d.count} = 80%</b></div><div class="metric"><span>平均置信度 − 正确率</span><b>${Math.round(d.confidence_accuracy_gap*100)} 个百分点</b></div><div class="metric"><span>二分类 Brier</span><b>${d.brier.toFixed(4)}</b></div></section>`).join('');document.body.dataset.ready='true';});</script></html>
